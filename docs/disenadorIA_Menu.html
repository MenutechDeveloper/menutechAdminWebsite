<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcripción de Menú AI | Menutech</title>
    <script src="authGuard.js"></script>
    <link rel="icon" type="image/png" href="https://menutech.services/assets/img/logomt.png">
    <link rel="shortcut icon" href="https://menutech.services/assets/img/logomt.png">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap');

        :root {
            --orange: #ff9533;
            --bg: #fffcf0;
            --card: #ffffff;
            --input: #fffef5;
            --text: #1a1c1e;
            --text-dim: #4a5568;
            --border: #f8e8d8;
            --success: #059669;
            --error: #dc2626;
        }

        body.dark-mode {
            --bg: #121418;
            --card: #1c1f26;
            --input: #242933;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #2d333f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: background 0.3s, color 0.3s; }

        .bg-mesh { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 0% 0%, rgba(255, 149, 51, 0.12) 0%, transparent 40%), radial-gradient(circle at 100% 100%, rgba(255, 149, 51, 0.08) 0%, transparent 40%); }

        #top-nav { position: fixed; top: 24px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between; z-index: 5000; pointer-events: none; }
        #top-nav > * { pointer-events: auto; }

        .btn-panel-top { background: var(--orange); color: #fff; border: none; padding: 12px 28px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; cursor: pointer; transition: 0.4s; letter-spacing: 1.5px; box-shadow: 0 8px 25px rgba(255, 149, 51, 0.3); text-transform: uppercase; }
        .btn-panel-top:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(255, 149, 51, 0.4); filter: brightness(1.1); }

        .theme-switch { width: 50px; height: 50px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.4s; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .theme-switch:hover { transform: translateY(-2px); border-color: var(--orange); }
        .theme-switch svg { width: 24px; height: 24px; transition: 0.4s; }
        .sun-icon { color: var(--orange); }
        .moon-icon { color: #8b5cf6; display: none; }
        body.dark-mode .sun-icon { display: none; }
        body.dark-mode .moon-icon { display: block; }

        #user-display-pill {
            background: var(--card); backdrop-filter: blur(20px); padding: 8px 24px; border-radius: 40px; border: 1.5px solid var(--border);
            display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); cursor: pointer; position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); min-width: 180px;
        }
        #user-display-pill:hover { transform: translateY(-2px); border-color: var(--orange); }

        #user-display-pill.admin-glow {
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 20%, #b38728 40%, #fbf5b7 60%, #aa771c 80%, #bf953f 100%);
            background-size: 400% 400%; animation: foil-shine 25s ease infinite; border: none !important;
        }
        #user-display-pill.admin-glow #user-name, #user-display-pill.admin-glow #user-role-label { color: #3e2b14 !important; }

        #user-display-pill.dev-glow {
            background: linear-gradient(135deg, #70706F 0%, #E9E9E7 20%, #70706F 40%, #E9E9E7 60%, #70706F 80%, #E9E9E7 100%);
            background-size: 400% 400%; animation: foil-shine 25s ease infinite; border: none !important;
        }
        #user-display-pill.dev-glow #user-name, #user-display-pill.dev-glow #user-role-label { color: #1e293b !important; }

        #user-display-pill.owner-glow {
            background: #000;
            background-image: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.1) 20%, transparent 40%, rgba(255,255,255,0.1) 60%, transparent 80%, rgba(255,255,255,0.1) 100%);
            background-size: 400% 400%; animation: foil-shine 25s ease infinite; border: none !important;
        }
        #user-display-pill.owner-glow #user-name, #user-display-pill.owner-glow #user-role-label { color: #fff !important; }

        @keyframes foil-shine { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .pill-info { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
        #user-name { font-weight: 800; font-size: 0.85rem; font-family: 'Outfit', sans-serif; }
        #user-role-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); }

        .pill-menu { position: absolute; top: calc(100% + 12px); right: 0; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 12px; min-width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.2); opacity: 0; transform: translateY(10px); pointer-events: none; transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 6000; }
        #user-display-pill.active .pill-menu { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .pill-menu-item { padding: 12px 18px; border-radius: 14px; font-size: 0.85rem; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; text-decoration: none; }
        .pill-menu-item:hover { background: rgba(255, 149, 51, 0.1); color: var(--orange); }
        .pill-menu-item.danger:hover { background: rgba(239, 68, 68, 0.1); color: var(--error); }

        .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 100px 24px 60px 24px; animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        header { text-align: center; margin-bottom: 40px; }
        .logo-main { width: 100%; max-width: 260px; height: auto; margin: 0 auto 12px auto; display: block; filter: drop-shadow(0 10px 20px rgba(255,149,51,0.15)); }

        /* Results section */
        #results-wrapper { display: block; }

        .section-header { position: relative; z-index: 9999; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .section-header h2 { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }

        .export-actions { position: relative; z-index: 9999; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .btn-export {
            background: var(--input); border: 1.5px solid var(--border); color: var(--text); padding: 10px 18px;
            border-radius: 14px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 8px; font-family: inherit;
        }
        .btn-export:hover { border-color: var(--orange); color: var(--orange); transform: translateY(-2px); }
        .btn-export.primary { background: var(--orange); color: #ffffff; border-color: var(--orange); font-weight: 800; }
        .btn-export.primary:hover { filter: brightness(1.1); }

        /* Dropdown Menu Styles */
        .dropdown { position: relative; display: inline-block; z-index: 10000; }
        .dropdown-menu {
            position: absolute; right: 0; top: calc(100% + 8px); background: #ffffff;
            border: 1.5px solid var(--border); border-radius: 16px; padding: 8px; min-width: 240px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); display: none; flex-direction: column; gap: 4px;
            z-index: 10001; animation: dropdownFade 0.2s ease;
        }
        body.dark-mode .dropdown-menu { background: #1c1f26; }
        .dropdown.active .dropdown-menu { display: flex; }
        @keyframes dropdownFade { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .dropdown-item {
            padding: 10px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: 700;
            color: var(--text); cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; text-align: left;
        }
        .dropdown-item:hover { background: rgba(255,149,51,0.1); color: var(--orange); }

        /* Account Modal Styles */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            z-index: 20000; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: var(--card); border: 1.5px solid var(--border); border-radius: 28px;
            padding: 30px; width: 100%; max-width: 520px; box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            max-height: 85vh; display: flex; flex-direction: column; animation: modalSlide 0.3s ease;
        }
        @keyframes modalSlide { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .modal-header h3 { font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--text); }
        .modal-close { background: none; border: none; font-size: 1.2rem; color: var(--text-dim); cursor: pointer; }
        .modal-search { width: 100%; padding: 12px 16px; border-radius: 14px; background: var(--input); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 0.85rem; margin-bottom: 15px; outline: none; }
        .modal-search:focus { border-color: var(--orange); }
        .account-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; max-height: 320px; padding-right: 4px; }
        .account-item {
            padding: 12px 16px; border-radius: 14px; background: var(--input); border: 1px solid var(--border);
            cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 2px;
        }
        .account-item:hover { border-color: var(--orange); background: rgba(255,149,51,0.06); }
        .account-name { font-weight: 700; font-size: 0.88rem; color: var(--text); }
        .account-sub { font-size: 0.72rem; color: var(--text-dim); }
        .hidden { display: none !important; }

        /* General Info Card */
        .info-card {
            background: var(--card); border: 1.5px solid var(--border); border-radius: 28px; padding: 28px;
            margin-bottom: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;
        }
        .info-field label { display: block; font-size: 0.7rem; font-weight: 800; color: var(--orange); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        .info-field div { font-size: 0.95rem; font-weight: 600; color: var(--text); word-break: break-word; }
        .info-field div.empty { color: var(--text-dim); font-style: italic; font-weight: 400; font-size: 0.85rem; }

        /* Menu Display */
        .categories-container { display: flex; flex-direction: column; gap: 28px; }

        .category-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 28px; padding: 28px; }
        .category-title {
            font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--orange);
            margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .category-count { font-size: 0.75rem; font-weight: 700; background: rgba(255,149,51,0.12); color: var(--orange); padding: 4px 12px; border-radius: 20px; }

        .dishes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }

        .dish-card {
            background: var(--input); border: 1px solid var(--border); border-radius: 20px; padding: 20px;
            display: flex; flex-direction: column; justify-content: space-between; gap: 12px; transition: 0.3s;
        }
        .dish-card:hover { border-color: var(--orange); }

        .dish-header { display: flex; gap: 14px; align-items: flex-start; }
        .dish-main-info { flex: 1; min-width: 0; }
        .dish-name { font-weight: 700; font-size: 0.95rem; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
        .dish-price { font-weight: 800; font-size: 0.9rem; color: var(--orange); font-family: 'Outfit', sans-serif; }
        .dish-desc { font-size: 0.8rem; color: var(--text-dim); line-height: 1.4; margin-top: 6px; }

        /* Copyable elements highlight green when copied */
        .copyable {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1.5px solid transparent;
            border-radius: 8px;
            padding: 4px 8px;
            margin: -2px -6px;
            display: inline-block;
            max-width: 100%;
        }
        .copyable:hover {
            border-color: var(--orange);
            background: rgba(255, 149, 51, 0.05);
        }
        .copyable.copied {
            border-color: var(--success) !important;
            box-shadow: 0 0 0 1px var(--success);
            background: rgba(5, 150, 105, 0.1) !important;
        }

        .dish-meta { font-size: 0.75rem; border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 4px; display: flex; flex-direction: column; gap: 6px; }
        .dish-meta-item { display: flex; gap: 6px; flex-wrap: wrap; }
        .meta-tag { background: var(--card); border: 1px solid var(--border); padding: 2px 8px; border-radius: 8px; color: var(--text-dim); font-size: 0.7rem; font-weight: 600; }

        /* Empty state */
        .empty-state-card {
            background: var(--card); border: 1.5px solid var(--border); border-radius: 32px; padding: 60px 30px; text-align: center;
        }
        .empty-state-card i { font-size: 3.5rem; color: var(--orange); margin-bottom: 16px; }
        .empty-state-card h3 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
        .empty-state-card p { font-size: 0.9rem; color: var(--text-dim); max-width: 500px; margin: 0 auto; }

        /* Toast Notifications */
        #toast-container { position: fixed; top: 24px; right: 24px; z-index: 20000; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
        .toast { min-width: 300px; max-width: 460px; padding: 16px 20px; border-radius: 20px; background: #1c1f26; border: 1px solid var(--border); color: #fff; font-size: 0.85rem; font-weight: 500; box-shadow: 0 12px 32px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 12px; pointer-events: auto; animation: toastSlideIn 0.4s ease; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
        .toast.success { border-left: 5px solid var(--success); }
        .toast.error { border-left: 5px solid var(--error); }
        .toast.warning { border-left: 5px solid var(--orange); }
        @keyframes toastSlideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (max-width: 640px) {
            .container { padding-top: 90px; }
            .dishes-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div id="toast-container"></div>

    <div id="top-nav">
        <div>
            <button class="btn-panel-top" onclick="location.href='index.html'">PANEL</button>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="theme-switch" id="theme-toggle" title="Cambiar Tema">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </div>
            <div id="user-display-pill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:20px; height:20px; color: inherit;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <div class="pill-info">
                    <div id="user-name">&nbsp;</div>
                    <div id="user-role-label">&nbsp;</div>
                </div>
                <div class="pill-menu">
                    <a href="index.html" class="pill-menu-item">Home</a>
                    <div class="pill-menu-item danger" onclick="logout()">Logout</div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <img src="https://menutech.services/assets/img/logomt.png" class="logo-main" alt="Menutech Logo">
        </header>

        <!-- Results Display -->
        <div id="results-wrapper">
            <div class="section-header">
                <h2>Menú Transcrito</h2>
                <div class="export-actions">
                    <button class="btn-export primary" id="btn-toggle-transcribe" onclick="toggleTranscribeSection()">
                        Transcribir
                    </button>
                    <div class="dropdown" id="digital-menu-dropdown">
                        <button class="btn-export primary" id="btn-digital-menu-trigger" onclick="toggleDigitalMenuDropdown(event)">
                            Digital Menu <i class="fa-solid fa-chevron-down" style="font-size:0.7rem; margin-left:4px;"></i>
                        </button>
                        <div class="dropdown-menu">
                            <div class="dropdown-item" onclick="openAccountModal('create')">
                                create
                            </div>
                            <div class="dropdown-item" onclick="openAccountModal('update')">
                                update
                            </div>
                        </div>
                    </div>
                    <button class="btn-export" onclick="exportTXT()">
                        Exportar TXT
                    </button>
                    <button class="btn-export" onclick="exportSVG()">
                        Exportar SVG
                    </button>
                    <button class="btn-export" onclick="copyFullMenuJSON()">
                        Copiar JSON
                    </button>
                </div>
            </div>

            <!-- Collapsible Drag & Drop Area for Direct Menu Transcription -->
            <div id="transcribe-drop-container" class="hidden" style="margin-bottom: 24px; animation: fadeIn 0.3s ease;">
                <div class="transcribe-card" style="background: var(--card); border: 2px dashed var(--orange); border-radius: 28px; padding: 28px; text-align: center; position: relative;">
                    <input type="file" id="transcribe-file-input" accept="image/*" style="display:none;" onchange="handleTranscribeFileSelect(event)">
                    <div id="transcribe-drop-zone" style="cursor: pointer; padding: 24px; border-radius: 20px; transition: background 0.2s;" onclick="document.getElementById('transcribe-file-input').click()" ondragover="handleTranscribeDragOver(event)" ondragleave="handleTranscribeDragLeave(event)" ondrop="handleTranscribeDrop(event)">
                        <i class="fa-solid fa-cloud-arrow-up" style="font-size: 3rem; color: var(--orange); margin-bottom: 12px;"></i>
                        <h4 style="font-family: 'Outfit', sans-serif; font-size: 1.15rem; margin-bottom: 6px; color: var(--text);">Arrastra tu imagen del menú aquí o haz clic para seleccionar</h4>
                        <p style="font-size: 0.8rem; color: var(--text-dim);">La IA transcribirá automáticamente todas las secciones, platillos, descripciones y precios</p>
                    </div>
                    <div id="transcribe-preview-area" class="hidden" style="margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
                        <img id="transcribe-preview-img" src="" alt="Vista previa" style="max-width: 260px; max-height: 220px; border-radius: 16px; border: 2px solid var(--orange); object-fit: cover; box-shadow: 0 8px 20px rgba(0,0,0,0.1);">
                        <span id="transcribe-preview-name" style="font-size: 0.85rem; font-weight: 700; color: var(--text);">imagen.png</span>
                    </div>
                    <div style="margin-top: 22px; display: flex; justify-content: center; gap: 12px;">
                        <button class="btn-export primary" id="btn-generate-transcription" onclick="executeTranscriptionFromPage()" style="padding: 12px 32px; font-size: 0.95rem;">
                            Generar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Modal for Account Selection -->
            <div class="modal-overlay" id="account-select-modal">
                <div class="modal-card">
                    <div class="modal-header">
                        <h3 id="modal-action-title">Seleccionar Cuenta</h3>
                        <button class="modal-close" onclick="closeAccountModal()"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <input type="text" class="modal-search" id="account-search-input" placeholder="Buscar cuenta o dominio..." oninput="filterAccountsList()">
                    <div class="account-list" id="account-list-container">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>

            <div id="structured-content-display">
                <!-- Visual Cards render dynamically -->
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase as sb } from './supabase.js';

        window.lastTranscribedMenu = null;

        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const msg = document.createElement('div');
            msg.textContent = message;
            toast.appendChild(msg);
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        };

        window.copyElementText = (el) => {
            const textToCopy = (el.getAttribute('data-copy-text') || el.innerText || el.textContent || '').trim();
            if (!textToCopy) return;

            el.classList.add('copied');

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showToast(`Copiado: "${textToCopy.substring(0, 35)}${textToCopy.length > 35 ? '...' : ''}"`, 'success');
                }).catch(() => {
                    fallbackCopyText(textToCopy);
                });
            } else {
                fallbackCopyText(textToCopy);
            }
        };

        function fallbackCopyText(text) {
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(`Copiado: "${text.substring(0, 35)}${text.length > 35 ? '...' : ''}"`, 'success');
            } catch (e) {
                showToast(`Elemento marcado como copiado`, 'success');
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            checkUserSession();
            loadTranscribedMenuData();
        });

        let currentUserRole = '';
        let allAccountsList = [];
        let selectedMenuMode = 'create'; // 'create' or 'update'

        async function checkUserSession() {
            if (sb) {
                try {
                    const { data: { session } } = await sb.auth.getSession();
                    if (!session || !session.user) {
                        window.location.href = 'index.html';
                        return;
                    }
                    const pill = document.getElementById('user-display-pill');
                    if (pill) {
                        pill.onclick = (e) => { e.stopPropagation(); pill.classList.toggle('active'); };
                        document.addEventListener('click', () => pill.classList.remove('active'));
                    }
                    const { data: profile } = await sb.from('profiles').select('username, role').eq('id', session.user.id).single();
                    const nameEl = document.getElementById('user-name');
                    const roleEl = document.getElementById('user-role-label');
                    if (profile) {
                        currentUserRole = (profile.role || '').toUpperCase();
                        if (nameEl) nameEl.textContent = profile.username || session.user.email.split('@')[0];
                        if (roleEl) roleEl.textContent = profile.role || 'User';
                        if (pill) {
                            if (currentUserRole === 'ADMIN') pill.classList.add('admin-glow');
                            else if (currentUserRole === 'DEVELOPER') pill.classList.add('dev-glow');
                            else pill.classList.add('owner-glow');
                        }
                        if (currentUserRole === 'OWNER') {
                            const dropdownEl = document.getElementById('digital-menu-dropdown');
                            if (dropdownEl) dropdownEl.style.display = 'none';
                        }
                    } else {
                        if (nameEl) nameEl.textContent = session.user.email.split('@')[0];
                        if (roleEl) roleEl.textContent = 'User';
                        if (pill) pill.classList.add('owner-glow');
                    }
                    if (window.revealPage) window.revealPage();
                } catch (e) {}
            }
        }

        window.logout = async () => {
            if (sb) await sb.auth.signOut();
            window.location.href = 'index.html';
        };

        window.toggleDigitalMenuDropdown = (e) => {
            e.stopPropagation();
            if (currentUserRole === 'OWNER') return;
            const dropdown = document.getElementById('digital-menu-dropdown');
            dropdown.classList.toggle('active');
        };

        document.addEventListener('click', () => {
            const dropdown = document.getElementById('digital-menu-dropdown');
            if (dropdown) dropdown.classList.remove('active');
        });

        window.openAccountModal = async (mode) => {
            if (!window.lastTranscribedMenu) {
                showToast("No hay menú transcrito activo para procesar.", "warning");
                return;
            }
            if (currentUserRole === 'OWNER') {
                showToast("Esta función no está disponible para cuentas de tipo OWNER.", "error");
                return;
            }

            selectedMenuMode = mode;
            const dropdown = document.getElementById('digital-menu-dropdown');
            if (dropdown) dropdown.classList.remove('active');

            const titleEl = document.getElementById('modal-action-title');
            if (titleEl) {
                titleEl.textContent = mode === 'create'
                    ? 'Crear Menú Digital'
                    : 'Actualizar Menú Digital';
            }

            const modal = document.getElementById('account-select-modal');
            modal.classList.add('active');

            await loadAccountsList();
        };

        window.closeAccountModal = () => {
            const modal = document.getElementById('account-select-modal');
            if (modal) modal.classList.remove('active');
        };

        async function loadAccountsList() {
            const container = document.getElementById('account-list-container');
            container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-dim);"><i class="fa-solid fa-spinner fa-spin"></i> Cargando cuentas...</div>`;

            try {
                const { data, error } = await sb.from('profiles').select('id, username, email, domain, role').order('username', { ascending: true });
                if (error) throw error;
                allAccountsList = data || [];
                renderAccountsList(allAccountsList);
            } catch (err) {
                console.error("Error loading accounts:", err);
                container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--error);">Error al cargar la lista de cuentas.</div>`;
            }
        }

        function renderAccountsList(accounts) {
            const container = document.getElementById('account-list-container');
            if (!accounts || accounts.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-dim);">No se encontraron cuentas.</div>`;
                return;
            }

            container.innerHTML = accounts.map(acc => {
                const name = acc.username || acc.email || 'Usuario';
                const domain = acc.domain || 'Sin dominio';
                const role = acc.role || 'user';
                return `
                    <div class="account-item" onclick="selectAccountForDigitalMenu('${acc.id}', '${escapeJsString(name)}', '${escapeJsString(domain)}')">
                        <div class="account-name">${escapeHtml(name)}</div>
                        <div class="account-sub">${escapeHtml(domain)} • ${escapeHtml(role)}</div>
                    </div>
                `;
            }).join('');
        }

        window.filterAccountsList = () => {
            const term = (document.getElementById('account-search-input').value || '').toLowerCase().trim();
            if (!term) {
                renderAccountsList(allAccountsList);
                return;
            }
            const filtered = allAccountsList.filter(a =>
                (a.username || '').toLowerCase().includes(term) ||
                (a.email || '').toLowerCase().includes(term) ||
                (a.domain || '').toLowerCase().includes(term)
            );
            renderAccountsList(filtered);
        };

        window.selectAccountForDigitalMenu = async (targetUserId, accountName, accountDomain) => {
            closeAccountModal();
            showToast(`Procesando menú para ${accountName}...`, "warning");

            try {
                const transcribed = window.lastTranscribedMenu;
                if (!transcribed) {
                    showToast("No se encontró información del menú.", "error");
                    return;
                }

                // Standardize categories & dishes into adminMenus format
                const newCategories = (transcribed.categories || []).map(cat => {
                    const rawDishes = cat.dishes || cat.items || [];
                    const formattedDishes = rawDishes.map(d => {
                        let parsedPrice = 0;
                        if (typeof d.price === 'number') parsedPrice = d.price;
                        else if (typeof d.price === 'string') {
                            const cleaned = d.price.replace(/[^0-9\.]/g, '');
                            parsedPrice = parseFloat(cleaned) || 0;
                        }
                        return {
                            name: d.name || 'Platillo',
                            description: d.description || '',
                            price: parsedPrice,
                            image: '',
                            sizes: [],
                            toppings: []
                        };
                    });

                    return {
                        name: cat.name || 'General',
                        description: '',
                        image: '',
                        visibility: { days: [0, 1, 2, 3, 4, 5, 6], start: '00:00', end: '23:59', startDate: '', endDate: '' },
                        dishes: formattedDishes
                    };
                });

                // Get target user profile to determine slug & domain
                const { data: targetProfile } = await sb.from('profiles').select('*').eq('id', targetUserId).single();
                let domain = targetProfile?.domain || accountDomain || 'undetermined';
                let defaultSlug = '';
                if (domain && !domain.includes('menutech')) {
                    defaultSlug = domain.split('.')[0];
                } else {
                    defaultSlug = targetProfile?.username || accountName || 'restaurant';
                }
                let slug = defaultSlug.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');

                if (selectedMenuMode === 'create') {
                    // Full overwrite / creation from scratch
                    const finalConfig = {
                        categories: newCategories,
                        toppings: []
                    };

                    const { error } = await sb.from('menutech_menus').upsert({
                        user_id: targetUserId,
                        domain: domain,
                        slug: slug,
                        menu_style: 'mode2',
                        cover_url: '',
                        cover_type: 'image',
                        config: finalConfig
                    }, { onConflict: 'user_id' });

                    if (error) throw error;
                    showToast(`Menú digital CREADO con éxito para ${accountName}.`, "success");
                } else {
                    // UPDATE mode: Merge missing categories and dishes
                    const { data: existingMenu } = await sb.from('menutech_menus').select('*').eq('user_id', targetUserId).maybeSingle();

                    let existingConfig = existingMenu?.config || { categories: [], toppings: [] };
                    if (!existingConfig.categories) existingConfig.categories = [];
                    if (!existingConfig.toppings) existingConfig.toppings = [];

                    newCategories.forEach(newCat => {
                        let existingCat = existingConfig.categories.find(c => c.name.toLowerCase().trim() === newCat.name.toLowerCase().trim());

                        if (!existingCat) {
                            // Add new category directly
                            existingConfig.categories.push(newCat);
                        } else {
                            // Category exists: append missing dishes
                            if (!existingCat.dishes) existingCat.dishes = [];

                            newCat.dishes.forEach(newDish => {
                                const dishExists = existingCat.dishes.some(d => d.name.toLowerCase().trim() === newDish.name.toLowerCase().trim());
                                if (!dishExists) {
                                    existingCat.dishes.push(newDish);
                                }
                            });
                        }
                    });

                    const finalSlug = existingMenu?.slug || slug;
                    const finalDomain = existingMenu?.domain || domain;

                    const { error } = await sb.from('menutech_menus').upsert({
                        user_id: targetUserId,
                        domain: finalDomain,
                        slug: finalSlug,
                        menu_style: existingMenu?.menu_style || 'mode2',
                        cover_url: existingMenu?.cover_url || '',
                        cover_type: existingMenu?.cover_type || 'image',
                        config: existingConfig
                    }, { onConflict: 'user_id' });

                    if (error) throw error;
                    showToast(`Menú digital ACTUALIZADO con éxito para ${accountName}.`, "success");
                }

                // Optional delay toast informing user they can view it in adminMenus.html
                setTimeout(() => {
                    showToast("Puedes ver los cambios en adminMenus.html", "success");
                }, 1500);

            } catch (err) {
                console.error("Error processing digital menu operation:", err);
                showToast(`Error al procesar el menú: ${err.message || err}`, "error");
            }
        };

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeJsString(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function initTheme() {
            const toggle = document.getElementById('theme-toggle');
            if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
            toggle.onclick = () => {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            };
        }

        window.selectedTranscribeImage = null;

        window.toggleTranscribeSection = () => {
            const container = document.getElementById('transcribe-drop-container');
            if (container) {
                container.classList.toggle('hidden');
            }
        };

        window.handleTranscribeFileSelect = (e) => {
            if (e.target.files && e.target.files.length > 0) {
                processTranscribeImageFile(e.target.files[0]);
            }
        };

        window.handleTranscribeDragOver = (e) => {
            e.preventDefault();
            const zone = document.getElementById('transcribe-drop-zone');
            if (zone) zone.style.background = 'rgba(255, 149, 51, 0.12)';
        };

        window.handleTranscribeDragLeave = (e) => {
            e.preventDefault();
            const zone = document.getElementById('transcribe-drop-zone');
            if (zone) zone.style.background = 'transparent';
        };

        window.handleTranscribeDrop = (e) => {
            e.preventDefault();
            const zone = document.getElementById('transcribe-drop-zone');
            if (zone) zone.style.background = 'transparent';
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                processTranscribeImageFile(e.dataTransfer.files[0]);
            }
        };

        function processTranscribeImageFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                showToast("Por favor selecciona un archivo de imagen válido.", "warning");
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                const base64Data = e.target.result;
                window.selectedTranscribeImage = {
                    mimeType: file.type,
                    data: base64Data
                };
                const previewArea = document.getElementById('transcribe-preview-area');
                const previewImg = document.getElementById('transcribe-preview-img');
                const previewName = document.getElementById('transcribe-preview-name');
                if (previewImg) previewImg.src = base64Data;
                if (previewName) previewName.textContent = file.name;
                if (previewArea) previewArea.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        window.executeTranscriptionFromPage = async () => {
            if (!window.selectedTranscribeImage) {
                showToast("Por favor arrastra o selecciona una imagen del menú.", "warning");
                return;
            }

            const btn = document.getElementById('btn-generate-transcription');
            const originalText = btn ? btn.innerHTML : '';
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `Transcribiendo...`;
            }

            showToast("Transcribiendo menu con MenutechIA", "warning");

            try {
                const res = await fetch("https://eemqyrysdgasfjlitads.supabase.co/functions/v1/LectorMenus", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlbXF5cnlzZGdhc2ZqbGl0YWRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3MjA0NDUsImV4cCI6MjA4OTI5NjQ0NX0.UiyZLqhXSQ1Z_FoL006PDrDYKXbr_pxCOugYTulhdPY",
                        "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlbXF5cnlzZGdhc2ZqbGl0YWRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3MjA0NDUsImV4cCI6MjA4OTI5NjQ0NX0.UiyZLqhXSQ1Z_FoL006PDrDYKXbr_pxCOugYTulhdPY"
                    },
                    body: JSON.stringify({
                        prompt: "Transcribe todo el menú de esta imagen de forma limpia, organizada y estructurada.",
                        image: window.selectedTranscribeImage
                    })
                });

                const data = await res.json().catch(() => ({}));
                if (res.ok && (data.menu || data.categories || data.success)) {
                    const menuObj = data.menu || data;
                    window.lastTranscribedMenu = menuObj;
                    sessionStorage.setItem('menutech_transcribed_menu', JSON.stringify(menuObj));
                    renderMenuUI(menuObj);
                    showToast("¡Menú transcrito con éxito!", "success");

                    const container = document.getElementById('transcribe-drop-container');
                    if (container) container.classList.add('hidden');
                } else {
                    showToast("Error al transcribir: " + (data.error || "Sin respuesta"), "error");

            } catch (err) {
                showToast("Error de conexión: " + err.message, "error");

                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            }

        window.loadTranscribedMenuData = function() {
            const raw = sessionStorage.getItem('menutech_transcribed_menu');
            if (!raw) {
                if (!window.lastTranscribedMenu) {
                    renderEmptyState();
                }
                return;
            }
            sessionStorage.removeItem('menutech_transcribed_menu');

            try {
                const parsed = JSON.parse(raw);
                window.lastTranscribedMenu = parsed;
                renderMenuUI(parsed);
            } catch (err) {
                console.error("Error parsing transcribed menu from sessionStorage:", err);
                if (!window.lastTranscribedMenu) {
                    renderEmptyState();
                }
            }
        };

        function renderEmptyState() {
            const container = document.getElementById('structured-content-display');
            container.innerHTML = `
                <div class="empty-state-card">
                    <i class="fa-solid fa-image"></i>
                    <h3>No hay menú transcrito activo</h3>
                    <p>Pídele a MenutechAI en el chat: <strong>"transcribe este menu"</strong> adjuntando una imagen.</p>
                </div>
            `;
        }

        function renderMenuUI(data) {
            const container = document.getElementById('structured-content-display');
            const r = data.restaurant || {};
            const categories = data.categories || [];

            let html = `
                <div class="info-card">
                    <div class="info-field">
                        <label>Restaurante</label>
                        <div class="${!r.name ? 'empty' : 'copyable'}" ${r.name ? 'onclick="copyElementText(this)"' : ''}>${r.name || 'No especificado'}</div>
                    </div>
                    <div class="info-field">
                        <label>Dirección</label>
                        <div class="${!r.address ? 'empty' : 'copyable'}" ${r.address ? 'onclick="copyElementText(this)"' : ''}>${r.address || 'No especificada'}</div>
                    </div>
                    <div class="info-field">
                        <label>Teléfono</label>
                        <div class="${!r.phone ? 'empty' : 'copyable'}" ${r.phone ? 'onclick="copyElementText(this)"' : ''}>${r.phone || 'No especificado'}</div>
                    </div>
                    <div class="info-field">
                        <label>Horarios</label>
                        <div class="${!r.hours ? 'empty' : 'copyable'}" ${r.hours ? 'onclick="copyElementText(this)"' : ''}>${r.hours || 'No especificados'}</div>
                    </div>
                </div>
            `;

            if (categories.length === 0) {
                html += `
                    <div class="category-card" style="text-align:center; color:var(--text-dim); padding:40px;">
                        No se detectaron categorías ni platillos en el menú.
                    </div>
                `;
            } else {
                html += `<div class="categories-container">`;
                categories.forEach(cat => {
                    const dishes = cat.dishes || cat.items || [];
                    html += `
                        <div class="category-card">
                            <div class="category-title">
                                <span class="copyable" onclick="copyElementText(this)">${cat.name || 'Categoría'}</span>
                                <span class="category-count">${dishes.length} elementos</span>
                            </div>
                            <div class="dishes-grid">
                                ${dishes.map(d => `
                                    <div class="dish-card">
                                        <div>
                                            <div class="dish-header">
                                                <div class="dish-main-info">
                                                    <div class="dish-name copyable" onclick="copyElementText(this)">${d.name || 'Elemento'}</div>
                                                    <div class="dish-price copyable" onclick="copyElementText(this)">${d.price ? (typeof d.price === 'number' ? '$' + parseFloat(d.price).toFixed(2) : d.price) : 'Sin precio'}</div>
                                                </div>
                                            </div>
                                            ${d.description ? `<div class="dish-desc copyable" onclick="copyElementText(this)">${d.description}</div>` : ''}
                                        </div>
                                        ${(d.variants?.length || d.extras?.length) ? `
                                            <div class="dish-meta">
                                                ${d.variants?.length ? `<div class="dish-meta-item"><strong>Variantes:</strong> ${d.variants.map(v => `<span class="meta-tag copyable" onclick="copyElementText(this)">${v}</span>`).join('')}</div>` : ''}
                                                ${d.extras?.length ? `<div class="dish-meta-item"><strong>Extras:</strong> ${d.extras.map(e => `<span class="meta-tag copyable" onclick="copyElementText(this)">${e}</span>`).join('')}</div>` : ''}
                                            </div>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        window.exportTXT = () => {
            const data = window.lastTranscribedMenu;
            if (!data) {
                showToast("No hay menú transcrito para exportar.", "warning");
                return;
            }

            let text = `========================================\n`;
            text += `TRANSCRIPCIÓN DE MENÚ - MENUTECH AI\n`;
            text += `========================================\n\n`;

            const r = data.restaurant || {};
            if (r.name) text += `RESTAURANTE: ${r.name}\n`;
            if (r.address) text += `Dirección: ${r.address}\n`;
            if (r.phone) text += `Teléfono: ${r.phone}\n`;
            if (r.hours) text += `Horarios: ${r.hours}\n`;
            text += `\n`;

            const categories = data.categories || [];
            categories.forEach(cat => {
                text += `--- CATEGORÍA: ${(cat.name || 'General').toUpperCase()} ---\n`;
                (cat.dishes || cat.items || []).forEach(d => {
                    text += `• ${d.name} - ${d.price || 'S/N'}\n`;
                    if (d.description) text += `  Descripción: ${d.description}\n`;
                    if (d.variants?.length) text += `  Variantes: ${d.variants.join(', ')}\n`;
                    if (d.extras?.length) text += `  Extras: ${d.extras.join(', ')}\n`;
                });
                text += `\n`;
            });

            downloadBlob(text, 'transcripcion_menu.txt', 'text/plain;charset=utf-8');
        };

        window.exportSVG = () => {
            const data = window.lastTranscribedMenu;
            if (!data) {
                showToast("No hay menú transcrito para exportar.", "warning");
                return;
            }

            let y = 60;
            const width = 800;
            let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} 2000" width="${width}" style="background-color:#ffffff; font-family:sans-serif; color:#1a1c1e;">`;
            svgContent += `<style>
                .title { font-size: 26px; font-weight: bold; fill: #ff9533; }
                .sub { font-size: 14px; fill: #4a5568; }
                .cat-title { font-size: 20px; font-weight: bold; fill: #ff9533; }
                .item-title { font-size: 16px; font-weight: bold; fill: #1a1c1e; }
                .item-desc { font-size: 13px; fill: #4a5568; }
            </style>`;

            svgContent += `<text x="40" y="${y}" class="title">Transcripción de Menú - Menutech AI</text>`;
            y += 40;

            const r = data.restaurant || {};
            if (r.name) { svgContent += `<text x="40" y="${y}" class="item-title">Restaurante: ${escapeXml(r.name)}</text>`; y += 25; }
            if (r.address) { svgContent += `<text x="40" y="${y}" class="sub">Dirección: ${escapeXml(r.address)}</text>`; y += 20; }
            y += 20;

            const categories = data.categories || [];
            categories.forEach(cat => {
                svgContent += `<text x="40" y="${y}" class="cat-title">${escapeXml(cat.name)}</text>`; y += 25;
                (cat.dishes || cat.items || []).forEach(d => {
                    svgContent += `<text x="40" y="${y}" class="item-title">${escapeXml(d.name)} (${escapeXml(String(d.price || ''))})</text>`; y += 20;
                    if (d.description) { svgContent += `<text x="40" y="${y}" class="item-desc">${escapeXml(d.description.substring(0, 90))}</text>`; y += 20; }
                });
                y += 15;
            });

            svgContent += `</svg>`;
            downloadBlob(svgContent, 'transcripcion_menu.svg', 'image/svg+xml');
        };

        window.copyFullMenuJSON = () => {
            const data = window.lastTranscribedMenu;
            if (!data) return;
            navigator.clipboard.writeText(JSON.stringify(data, null, 2)).then(() => {
                showToast("JSON completo copiado al portapapeles.", "success");
            }).catch(() => {
                showToast("Error al copiar JSON.", "error");
            });
        };

        function downloadBlob(content, fileName, mimeType) {
            const blob = content instanceof Blob ? content : new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function escapeXml(unsafe) {
            if (!unsafe) return "";
            return unsafe.replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                }
            });
        }
    </script>
    <script>
        window.MENUTECH_BOT_MODEL_URL = "./assets/img/design.gltf";
    </script>
    <script src="chatbot.js"></script>
