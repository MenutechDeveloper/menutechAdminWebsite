<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor de Menús | Menutech</title>
    <link rel="icon" type="image/png" href="https://menutech.services/assets/img/logomt.png">
    <link rel="shortcut icon" href="https://menutech.services/assets/img/logomt.png">

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap');

        :root {
            --orange: #ff9533;
            --bg: #fffcf0;
            --card: #ffffff;
            --input: #fffef5;
            --text: #1a1c1e;
            --text-dim: #4a5568;
            --border: #f8e8d8;
            --success: #059669;
            --error: #dc2626;
        }

        body.dark-mode {
            --bg: #121418;
            --card: #1c1f26;
            --input: #242933;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #2d333f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: background 0.3s, color 0.3s; }

        .bg-mesh { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 0% 0%, rgba(255, 149, 51, 0.12) 0%, transparent 40%), radial-gradient(circle at 100% 100%, rgba(255, 149, 51, 0.08) 0%, transparent 40%); }

        #top-nav { position: fixed; top: 24px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between; z-index: 5000; pointer-events: none; }
        #top-nav > * { pointer-events: auto; }

        .btn-panel-top { background: var(--orange); color: #fff; border: none; padding: 12px 28px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; cursor: pointer; transition: 0.4s; letter-spacing: 1.5px; box-shadow: 0 8px 25px rgba(255, 149, 51, 0.3); text-transform: uppercase; }
        .btn-panel-top:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(255, 149, 51, 0.4); filter: brightness(1.1); }

        .theme-switch { width: 50px; height: 50px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.4s; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .theme-switch:hover { transform: translateY(-2px); border-color: var(--orange); }
        .theme-switch svg { width: 24px; height: 24px; transition: 0.4s; }
        .sun-icon { color: var(--orange); }
        .moon-icon { color: #8b5cf6; display: none; }
        body.dark-mode .sun-icon { display: none; }
        body.dark-mode .moon-icon { display: block; }

        #user-display-pill {
            background: var(--card); backdrop-filter: blur(20px); padding: 8px 24px; border-radius: 40px; border: 1.5px solid var(--border);
            display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); cursor: pointer; position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); min-width: 180px;
        }
        #user-display-pill:hover { transform: translateY(-2px); border-color: var(--orange); }
        .pill-info { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
        #user-name { font-weight: 800; font-size: 0.85rem; font-family: 'Outfit', sans-serif; }
        #user-role-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); }

        .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 100px 24px 60px 24px; animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        header { text-align: center; margin-bottom: 40px; }
        .logo-main { width: 100%; max-width: 260px; height: auto; margin: 0 auto 12px auto; display: block; filter: drop-shadow(0 10px 20px rgba(255,149,51,0.15)); }

        .extractor-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 32px; padding: 36px; box-shadow: 0 20px 50px rgba(0,0,0,0.06); margin-bottom: 40px; }

        .input-group { display: flex; gap: 16px; flex-wrap: wrap; }
        .input-wrapper { flex: 1; min-width: 280px; position: relative; }
        .input-wrapper input {
            width: 100%; background: var(--input); border: 1.5px solid var(--border); border-radius: 20px;
            padding: 18px 24px; color: var(--text); font-size: 1rem; font-family: inherit; transition: 0.3s;
        }
        .input-wrapper input:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 4px rgba(255,149,51,0.12); }

        .btn-extract {
            background: var(--orange); color: #ffffff; border: none; padding: 18px 36px; border-radius: 20px;
            font-size: 0.95rem; font-weight: 800; cursor: pointer; transition: 0.3s; display: inline-flex;
            align-items: center; gap: 10px; font-family: 'Outfit', sans-serif; letter-spacing: 0.5px;
            box-shadow: 0 8px 25px rgba(255,149,51,0.3); white-space: nowrap;
        }
        .btn-extract:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255,149,51,0.4); }
        .btn-extract:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Progress section */
        #progress-card { display: none; margin-top: 24px; background: var(--input); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }
        .progress-bar-container { width: 100%; height: 8px; background: var(--border); border-radius: 10px; overflow: hidden; margin-top: 12px; }
        .progress-bar { height: 100%; width: 0%; background: var(--orange); transition: width 0.4s ease; border-radius: 10px; }
        .progress-status { font-size: 0.85rem; font-weight: 700; color: var(--orange); display: flex; align-items: center; justify-content: space-between; }

        /* Results section */
        #results-wrapper { display: none; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .section-header h2 { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 700; }

        .export-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-export {
            background: var(--input); border: 1.5px solid var(--border); color: var(--text); padding: 10px 18px;
            border-radius: 14px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 8px; font-family: inherit;
        }
        .btn-export:hover { border-color: var(--orange); color: var(--orange); transform: translateY(-2px); }
        .btn-export.primary { background: var(--orange); color: #000; border-color: var(--orange); }
        .btn-export.primary:hover { filter: brightness(1.1); color: #000; }

        .restaurant-info-card {
            background: var(--card); border: 1.5px solid var(--border); border-radius: 28px; padding: 28px;
            margin-bottom: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;
        }
        .info-field label { display: block; font-size: 0.7rem; font-weight: 800; color: var(--orange); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        .info-field div { font-size: 0.95rem; font-weight: 600; color: var(--text); word-break: break-word; }
        .info-field div.empty { color: var(--text-dim); font-style: italic; font-weight: 400; font-size: 0.85rem; }

        .categories-container { display: flex; flex-direction: column; gap: 28px; }

        .category-card {
            background: var(--card); border: 1.5px solid var(--border); border-radius: 28px; padding: 28px;
        }
        .category-title {
            font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--orange);
            margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .category-count { font-size: 0.75rem; font-weight: 700; background: rgba(255,149,51,0.12); color: var(--orange); padding: 4px 12px; border-radius: 20px; }

        .dishes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }

        .dish-card {
            background: var(--input); border: 1px solid var(--border); border-radius: 20px; padding: 20px;
            display: flex; flex-direction: column; justify-content: space-between; gap: 12px; transition: 0.3s;
        }
        .dish-card:hover { border-color: var(--orange); }

        .dish-header { display: flex; gap: 14px; align-items: flex-start; }
        .dish-img { width: 70px; height: 70px; border-radius: 14px; object-fit: cover; background: var(--border); flex-shrink: 0; }
        .dish-main-info { flex: 1; min-width: 0; }
        .dish-name { font-weight: 700; font-size: 0.95rem; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
        .dish-price { font-weight: 800; font-size: 0.9rem; color: var(--orange); font-family: 'Outfit', sans-serif; }
        .dish-desc { font-size: 0.8rem; color: var(--text-dim); line-height: 1.4; margin-top: 6px; }

        .dish-meta { font-size: 0.75rem; border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 4px; display: flex; flex-direction: column; gap: 6px; }
        .dish-meta-item { display: flex; gap: 6px; flex-wrap: wrap; }
        .meta-tag { background: var(--card); border: 1px solid var(--border); padding: 2px 8px; border-radius: 8px; color: var(--text-dim); font-size: 0.7rem; font-weight: 600; }

        /* Toast Notifications */
        #toast-container { position: fixed; top: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
        .toast { min-width: 300px; max-width: 460px; padding: 16px 20px; border-radius: 20px; background: #1c1f26; border: 1px solid var(--border); color: #fff; font-size: 0.85rem; font-weight: 500; box-shadow: 0 12px 32px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 12px; pointer-events: auto; animation: toastSlideIn 0.4s ease; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
        .toast.success { border-left: 5px solid var(--success); }
        .toast.error { border-left: 5px solid var(--error); }
        .toast.warning { border-left: 5px solid var(--orange); }
        @keyframes toastSlideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .loader-spin { border: 3px solid rgba(255, 149, 51, 0.2); width: 22px; height: 22px; border-radius: 50%; border-left-color: var(--orange); animation: rotate 0.8s linear infinite; display: inline-block; }
        @keyframes rotate { to { transform: rotate(360deg); } }

        /* Tabs Navigation */
        .tabs-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            justify-content: center;
        }
        .tab-btn {
            background: var(--card);
            border: 1.5px solid var(--border);
            color: var(--text-dim);
            padding: 12px 28px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }
        .tab-btn:hover {
            color: var(--text);
            border-color: var(--orange);
        }
        .tab-btn.active {
            background: var(--orange);
            color: #ffffff;
            border-color: var(--orange);
            box-shadow: 0 6px 20px rgba(255, 149, 51, 0.25);
        }

        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }

        /* Apify Results JSON Pre Container */
        .apify-json-container {
            background: var(--input);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .btn-floating-leads {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 9999;
            background: var(--orange);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 149, 51, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }
        .btn-floating-leads:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 14px 35px rgba(255, 149, 51, 0.5);
            filter: brightness(1.1);
            color: #ffffff;
        }

        @media (max-width: 640px) {
            .container { padding-top: 90px; }
            .input-group { flex-direction: column; }
            .btn-extract { width: 100%; justify-content: center; }
            .dishes-grid { grid-template-columns: 1fr; }
            .btn-floating-leads { bottom: 16px; left: 16px; padding: 12px 22px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div id="toast-container"></div>

    <div id="top-nav">
        <div>
            <button class="btn-panel-top" onclick="location.href='index.html'">PANEL</button>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="theme-switch" id="theme-toggle" title="Cambiar Tema">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </div>
            <div id="user-display-pill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:20px; height:20px; color: var(--orange);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <div class="pill-info">
                    <div id="user-name">Menutech</div>
                    <div id="user-role-label">Extractor Tool</div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <img src="https://menutech.services/assets/img/logomt.png" class="logo-main" alt="Menutech Logo">
        </header>

        <div class="extractor-card">
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
                    <div class="input-wrapper">
                        <label style="display: block; font-size: 0.75rem; font-weight: 800; color: var(--orange); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px;">Categoría</label>
                        <select id="apify-search" style="width: 100%; background: var(--input); border: 1.5px solid var(--border); border-radius: 20px; padding: 18px 24px; color: var(--text); font-size: 1rem; font-family: inherit; transition: 0.3s; cursor: pointer;">
                            <option value="restaurant">Restaurante</option>
                        </select>
                    </div>
                    <div class="input-wrapper">
                        <label style="display: block; font-size: 0.75rem; font-weight: 800; color: var(--orange); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px;">Ubicación</label>
                        <input type="text" id="apify-location" autocomplete="off">
                    </div>
                    <div class="input-wrapper" style="max-width: 200px;">
                        <label style="display: block; font-size: 0.75rem; font-weight: 800; color: var(--orange); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px;">Límite de resultados</label>
                        <input type="number" id="apify-limit" autocomplete="off" value="20" min="1" max="500">
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end;">
                    <button class="btn-extract" id="btn-extract-apify" onclick="startApifyScraping()">
                        <span>Ejecutar</span>
                    </button>
                </div>
            </div>

            <div id="apify-progress-card" style="display: none; margin-top: 24px; background: var(--input); border: 1px solid var(--border); border-radius: 20px; padding: 20px;">
                <div class="progress-status">
                    <span id="apify-progress-text">Ejecutando Actor en Apify...</span>
                    <span id="apify-progress-percent">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="apify-progress-bar"></div>
                </div>
            </div>
        </div>

        <!-- Apify Results Display -->
        <div id="apify-results-wrapper" style="display: none; margin-top: 30px;">
            <div class="section-header">
                <h2>Resultados de Apify</h2>
                <div class="export-actions">
                    <button class="btn-export" onclick="exportApifyTXT()">
                        Exportar TXT
                    </button>
                    <button class="btn-export" onclick="exportApifyCSV()">
                        Descargar para Google Sheet
                    </button>
                    <button class="btn-export" onclick="exportApifyJSON()">
                        Exportar JSON
                    </button>
                    <button class="btn-export" onclick="copyApifyJSON()">
                        Copiar JSON
                    </button>
                    <button class="btn-export primary" id="btn-save-apify-sb" onclick="saveApifyToSupabase()">
                        Guardar en Supabase
                    </button>
                </div>
            </div>

            <div class="restaurant-info-card" id="apify-summary-display" style="margin-bottom: 24px;">
                <!-- Dynamically filled summary -->
            </div>

            <!-- Apify Filtered Items Cards Grid -->
            <div id="apify-items-display" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 30px;">
                <!-- Dynamically filled item cards -->
            </div>

            <details style="margin-top: 20px;">
                <summary style="cursor: pointer; font-weight: 700; color: var(--orange); margin-bottom: 10px; font-size: 0.9rem;">Ver JSON completo</summary>
                <div class="apify-json-container" id="apify-json-display">
                    <!-- Dynamically filled raw output -->
                </div>
            </details>
        </div>
    </div>


    <script type="module">
        import { supabase as sb } from './supabase.js';

        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const msg = document.createElement('div');
            msg.textContent = message;
            toast.appendChild(msg);
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        };

        document.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            checkUserSession();
        });

        async function checkUserSession() {
            if (sb) {
                const { data: { session } } = await sb.auth.getSession();
                if (session && session.user) {
                    const { data: profile } = await sb.from('profiles').select('username, role').eq('id', session.user.id).single();
                    if (profile) {
                        document.getElementById('user-name').textContent = profile.username || session.user.email.split('@')[0];
                        document.getElementById('user-role-label').textContent = profile.role || 'User';
                    }
                }
            }
        }

        function initTheme() {
            const toggle = document.getElementById('theme-toggle');
            if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
            toggle.onclick = () => {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            };
        }

        function downloadBlob(content, fileName, mimeType) {
            const blob = content instanceof Blob ? content : new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function escapeXml(unsafe) {
            if (!unsafe) return "";
            return unsafe.replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                }
            });
        }

        // ==========================================
        // APIFY INTEGRATION (Independent Logic)
        // ==========================================

        window.apifyExtractedData = null;


        function updateApifyProgress(percent, text) {
            const card = document.getElementById('apify-progress-card');
            const bar = document.getElementById('apify-progress-bar');
            const pText = document.getElementById('apify-progress-text');
            const pPercent = document.getElementById('apify-progress-percent');

            if (card && bar && pText && pPercent) {
                card.style.display = 'block';
                bar.style.width = percent + '%';
                pText.textContent = text;
                pPercent.textContent = percent + '%';
            }
        }

        function hideApifyProgress() {
            const card = document.getElementById('apify-progress-card');
            if (card) card.style.display = 'none';
        }

        window.startApifyScraping = async () => {
            const searchInput = document.getElementById('apify-search');
            const locationInput = document.getElementById('apify-location');
            const limitInput = document.getElementById('apify-limit');

            const search = searchInput ? searchInput.value.trim() : 'restaurant';
            const location = locationInput ? locationInput.value.trim() : '';
            const limit = limitInput ? limitInput.value.trim() : '20';

            if (!location) {
                showToast("Por favor ingresa una ubicación para realizar la búsqueda.", "warning");
                return;
            }

            const btn = document.getElementById('btn-extract-apify');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<span class="loader-spin"></span> Procesando Apify...`;
            }

            document.getElementById('apify-results-wrapper').style.display = 'none';
            updateApifyProgress(15, "Iniciando ejecución de Actor en Apify...");

            try {
                let resultData = null;
                const requestPayload = {
                    search: search,
                    location: location,
                    limit: parseInt(limit, 10) || 20
                };

                updateApifyProgress(40, "Ejecutando Actor nwua9Gu5YrADL7ZDj...");

                if (sb && sb.functions) {
                    const { data, error } = await sb.functions.invoke('apify-scraper', {
                        body: requestPayload
                    });

                    if (error) {
                        throw new Error(error.message || "Error al llamar a Edge Function apify-scraper");
                    }
                    if (data && data.error) {
                        throw new Error(data.error);
                    }
                    resultData = data;
                } else {
                    // Fallback direct HTTP fetch to Edge Function endpoint if sb client unavailable
                    const res = await fetch("https://eemqyrysdgasfjlitads.supabase.co/functions/v1/apify-scraper", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(requestPayload)
                    });
                    const json = await res.json();
                    if (!res.ok || json.error) {
                        throw new Error(json.error || `HTTP ${res.status}`);
                    }
                    resultData = json;
                }

                updateApifyProgress(90, "Procesando respuesta del Actor...");

                window.apifyExtractedData = resultData;
                renderApifyResults(resultData, search, location);

                updateApifyProgress(100, "¡Scraping de Apify completado!");
                setTimeout(hideApifyProgress, 1200);
                showToast("Scraping con Apify finalizado con éxito.", "success");
            } catch (err) {
                console.error("Apify scraping failed:", err);
                hideApifyProgress();
                showToast("Error en Apify: " + err.message, "error");
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = `<span>Ejecutar</span>`;
                }
            }
        };

        function formatApifyHours(hours) {
            if (!hours) return '';
            if (typeof hours === 'string') return hours;
            if (Array.isArray(hours)) {
                return hours.map(h => {
                    if (typeof h === 'string') return h;
                    if (h && typeof h === 'object') {
                        const day = h.day || h.dayOfWeek || '';
                        const time = h.hours || h.time || h.openingHours || '';
                        return [day, time].filter(Boolean).join(': ');
                    }
                    return '';
                }).filter(Boolean).join(' | ');
            }
            if (typeof hours === 'object') {
                return Object.entries(hours).map(([k, v]) => `${k}: ${v}`).join(' | ');
            }
            return '';
        }

        window.renderApifyResults = renderApifyResults;
        function renderApifyResults(res, search, location) {
            const wrapper = document.getElementById('apify-results-wrapper');
            const summaryDisplay = document.getElementById('apify-summary-display');
            const itemsDisplay = document.getElementById('apify-items-display');
            const jsonDisplay = document.getElementById('apify-json-display');

            let rawItems = [];
            if (Array.isArray(res)) rawItems = res;
            else if (res && Array.isArray(res.data)) rawItems = res.data;
            else if (res && Array.isArray(res.items)) rawItems = res.items;
            else if (res) rawItems = [res];

            const itemsCount = rawItems.length;
            const queryLabel = [search, location].filter(Boolean).join(" - ");

            summaryDisplay.innerHTML = `
                <div class="info-field">
                    <label>Actor ID</label>
                    <div>${res?.actorId || 'nwua9Gu5YrADL7ZDj'}</div>
                </div>
                <div class="info-field">
                    <label>Búsqueda / Ubicación</label>
                    <div>${queryLabel || 'Búsqueda general'}</div>
                </div>
                <div class="info-field">
                    <label>Elementos Obtenidos</label>
                    <div>${itemsCount} ${itemsCount === 1 ? 'registro' : 'registros'}</div>
                </div>
                <div class="info-field">
                    <label>Estado</label>
                    <div style="color: var(--success); font-weight: 700;">Completado</div>
                </div>
            `;

            if (itemsCount === 0) {
                itemsDisplay.innerHTML = `
                    <div class="category-card" style="grid-column: 1 / -1; text-align: center; color: var(--text-dim); padding: 40px;">
                        No se encontraron resultados para esta búsqueda.
                    </div>
                `;
            } else {
                itemsDisplay.innerHTML = rawItems.map(item => {
                    const name = item.title || item.name || 'Sin nombre';
                    const address = item.address || item.street || '';
                    const zipcode = item.postalCode || item.zipCode || item.zipcode || item.zip || '';
                    const city = item.city || item.addressCity || item.municipality || '';
                    const phone = item.phone || item.phoneUnformatted || item.telephone || '';
                    const hours = formatApifyHours(item.openingHours || item.hours);
                    const website = item.website || item.url || item.web || '';

                    return `
                        <div class="category-card" style="display: flex; flex-direction: column; justify-content: space-between; gap: 14px; margin-bottom: 0;">
                            <div>
                                <div style="font-family: 'Outfit', sans-serif; font-size: 1.15rem; font-weight: 700; color: var(--orange); margin-bottom: 12px; line-height: 1.3;">
                                    ${escapeXml(name)}
                                </div>
                                <div style="display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem;">
                                    <div class="info-field">
                                        <label>Dirección</label>
                                        <div class="${!address ? 'empty' : ''}">${escapeXml(address) || 'No especificada'}</div>
                                    </div>
                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                                        <div class="info-field">
                                            <label>Ciudad</label>
                                            <div class="${!city ? 'empty' : ''}">${escapeXml(city) || 'No especificada'}</div>
                                        </div>
                                        <div class="info-field">
                                            <label>Zipcode</label>
                                            <div class="${!zipcode ? 'empty' : ''}">${escapeXml(zipcode) || 'No especificado'}</div>
                                        </div>
                                    </div>
                                    <div class="info-field">
                                        <label>Teléfono</label>
                                        <div class="${!phone ? 'empty' : ''}">${escapeXml(phone) || 'No especificado'}</div>
                                    </div>
                                    <div class="info-field">
                                        <label>Horario</label>
                                        <div class="${!hours ? 'empty' : ''}" style="max-height: 80px; overflow-y: auto;">${escapeXml(hours) || 'No especificado'}</div>
                                    </div>
                                    <div class="info-field">
                                        <label>Website</label>
                                        <div>${website ? `<a href="${escapeXml(website)}" target="_blank" rel="noopener noreferrer" style="color: var(--orange); word-break: break-all; font-weight: 600;">${escapeXml(website)}</a>` : '<span class="empty">No especificado</span>'}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            jsonDisplay.textContent = JSON.stringify(res, null, 2);
            wrapper.style.display = 'block';
            wrapper.scrollIntoView({ behavior: 'smooth' });
        }

        function getApifyParsedItems() {
            if (!window.apifyExtractedData) return [];
            const res = window.apifyExtractedData;
            let rawItems = [];
            if (Array.isArray(res)) rawItems = res;
            else if (res && Array.isArray(res.data)) rawItems = res.data;
            else if (res && Array.isArray(res.items)) rawItems = res.items;
            else if (res) rawItems = [res];

            const searchLocation = document.getElementById('apify-location')?.value?.trim() || '';

            return rawItems.map(item => {
                const title = (item.title || item.name || 'Sin nombre').trim();
                const address = (item.address || item.street || '').trim();
                const zipcode = (item.postalCode || item.zipCode || item.zipcode || item.zip || '').trim();
                let city = (item.city || item.addressCity || item.municipality || '').trim();
                if (!city && searchLocation) city = searchLocation;
                if (!city) city = 'Desconocida';
                const phone = (item.phone || item.phoneUnformatted || item.telephone || '').trim();
                const hours = formatApifyHours(item.openingHours || item.hours);
                const website = (item.website || item.url || item.web || '').trim();

                return { title, address, city, zipcode, phone, hours, website };
            });
        }

        window.exportApifyTXT = () => {
            const items = getApifyParsedItems();
            if (items.length === 0) {
                showToast("No hay datos de Apify para exportar.", "warning");
                return;
            }
            let text = `========================================\n`;
            text += `RESULTADOS DE APIFY (${items.length} Registros)\n`;
            text += `========================================\n\n`;

            items.forEach((item, index) => {
                text += `[${index + 1}] ${item.title.toUpperCase()}\n`;
                text += `• Dirección: ${item.address || 'No especificada'}\n`;
                text += `• Ciudad: ${item.city}\n`;
                text += `• Zipcode: ${item.zipcode || 'No especificado'}\n`;
                text += `• Teléfono: ${item.phone || 'No especificado'}\n`;
                text += `• Horarios: ${item.hours || 'No especificado'}\n`;
                text += `• Website: ${item.website || 'No especificado'}\n\n`;
            });

            downloadBlob(text, `apify_restaurantes_${Date.now()}.txt`, 'text/plain;charset=utf-8');
        };

        window.exportApifyCSV = () => {
            const items = getApifyParsedItems();
            if (items.length === 0) {
                showToast("No hay datos de Apify para exportar.", "warning");
                return;
            }

            const headers = ["Nombre", "Direccion", "Ciudad", "Zipcode", "Telefono", "Horarios", "Website"];

            function escapeCsvCell(val) {
                if (!val) return '""';
                const str = String(val).replace(/"/g, '""');
                return `"${str}"`;
            }

            const rows = [
                headers.map(escapeCsvCell).join(','),
                ...items.map(item => [
                    escapeCsvCell(item.title),
                    escapeCsvCell(item.address),
                    escapeCsvCell(item.city),
                    escapeCsvCell(item.zipcode),
                    escapeCsvCell(item.phone),
                    escapeCsvCell(item.hours),
                    escapeCsvCell(item.website)
                ].join(','))
            ];

            const csvContent = '\uFEFF' + rows.join('\r\n');
            downloadBlob(csvContent, `apify_google_sheets_${Date.now()}.csv`, 'text/csv;charset=utf-8;');
        };

        window.saveApifyToSupabase = async () => {
            const items = getApifyParsedItems();
            if (items.length === 0) {
                showToast("No hay datos de Apify para guardar.", "warning");
                return;
            }

            if (!sb) {
                showToast("Error de conexión con Supabase.", "error");
                return;
            }

            const btn = document.getElementById('btn-save-apify-sb');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<span class="loader-spin"></span> Guardando...`;
            }

            try {
                const payload = items.map(it => ({
                    title: it.title,
                    address: it.address,
                    city: it.city,
                    zipcode: it.zipcode,
                    phone: it.phone,
                    hours: it.hours,
                    website: it.website,
                    is_called: false,
                    status: 'active'
                }));

                const { data, error } = await sb
                    .from('menutech_scraped_restaurants')
                    .upsert(payload, { onConflict: 'title,city', ignoreDuplicates: true })
                    .select();

                if (error) {
                    throw error;
                }

                const insertedCount = data ? data.length : payload.length;

                showToast(`¡Datos guardados en Supabase! (${insertedCount} procesados). Puedes verlos en Datos Scraping.`, "success");

                let shortcutBtn = document.getElementById('btn-go-restaurant-data');
                if (!shortcutBtn) {
                    const exportActions = document.querySelector('#apify-results-wrapper .export-actions');
                    if (exportActions) {
                        const linkBtn = document.createElement('button');
                        linkBtn.id = 'btn-go-restaurant-data';
                        linkBtn.className = 'btn-export primary';
                        linkBtn.style.background = '#059669';
                        linkBtn.style.color = '#fff';
                        linkBtn.style.borderColor = '#059669';
                        linkBtn.innerHTML = `Ver en restaurantData.html →`;
                        linkBtn.onclick = () => window.location.href = 'restaurantData.html';
                        exportActions.appendChild(linkBtn);
                    }
                }
            } catch (err) {
                console.error("Error saving to Supabase:", err);
                showToast("Error al guardar en Supabase: " + err.message, "error");
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = `Guardar en Supabase`;
                }
            }
        };

        window.exportApifyJSON = () => {
            if (!window.apifyExtractedData) {
                showToast("No hay datos de Apify para exportar.", "warning");
                return;
            }
            const jsonStr = JSON.stringify(window.apifyExtractedData, null, 2);
            downloadBlob(jsonStr, `apify_result_${Date.now()}.json`, 'application/json');
        };

        window.copyApifyJSON = () => {
            if (!window.apifyExtractedData) {
                showToast("No hay datos de Apify para copiar.", "warning");
                return;
            }
            const jsonStr = JSON.stringify(window.apifyExtractedData, null, 2);
            navigator.clipboard.writeText(jsonStr).then(() => {
                showToast("JSON de Apify copiado al portapapeles.", "success");
            }).catch(() => {
                showToast("No se pudo copiar el JSON.", "error");
            });
        };
    </script>
    <!-- Floating Button to Leads (restaurantData.html) -->
    <a href="restaurantData.html" class="btn-floating-leads" title="Ver Leads">Leads</a>

    <script src="chatbot.js"></script>
</body>
