<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services Management - Menutech</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="authGuard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #FBF9F5;
            --card: #FFFFFF;
            --border: #F0ECE1;
            --text: #2D241E;
            --text-dim: #8C827A;
            --orange: #FF7A00;
            --orange-glow: rgba(255, 122, 0, 0.15);
            --danger: #EF4444;
            --success: #10B981;
        }

        body.dark-mode {
            --bg: #0C0D0E;
            --card: #141618;
            --border: #22262A;
            --text: #F1F3F5;
            --text-dim: #717882;
            --orange-glow: rgba(255, 122, 0, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 30px 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-panel {
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text);
            font-weight: 800;
            padding: 10px 22px;
            border-radius: 999px;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: 0.3s;
        }
        body.dark-mode .btn-panel { background: var(--card); }
        .btn-panel:hover { border-color: var(--orange); color: var(--orange); transform: translateY(-1px); }

        .top-right { display: flex; align-items: center; gap: 15px; }

        .theme-toggle-btn {
            background: #fff;
            border: 1px solid var(--border);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            transition: 0.3s;
        }
        body.dark-mode .theme-toggle-btn { background: var(--card); }

        #user-display-pill {
            background: #fff;
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
        }
        body.dark-mode #user-display-pill { background: var(--card); }
        #user-display-pill.superadmin-glow {
            background: linear-gradient(135deg, #ff416c, #ff4b2b) !important;
            color: #fff !important;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
        }
        #user-display-pill.superadmin-glow #user-name, #user-display-pill.superadmin-glow #user-role-label { color: #fff !important; }
        #user-display-pill.admin-glow {
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 20%, #b38728 40%, #fbf5b7 60%, #aa771c 80%, #bf953f 100%);
            border: none !important;
        }
        #user-display-pill.admin-glow #user-name, #user-display-pill.admin-glow #user-role-label { color: #3e2b14 !important; }

        .pill-info { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
        #user-name { font-weight: 800; font-size: 0.85rem; }
        #user-role-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Standard Menutech Collapsible Sidebar Switcher */
        #sidebar-container {
            position: fixed;
            top: 100px;
            left: 0;
            bottom: 40px;
            width: 320px;
            background: var(--card);
            border: 1px solid var(--border);
            border-left: none;
            border-radius: 0 24px 24px 0;
            box-shadow: 10px 0 30px rgba(0,0,0,0.05);
            z-index: 500;
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #sidebar-container.collapsed {
            transform: translateX(-320px);
        }
        #sidebar-tab {
            position: absolute;
            top: 50%;
            left: 100%;
            transform: translateY(-50%);
            background: var(--orange);
            color: #fff;
            padding: 12px 10px;
            border-radius: 0 16px 16px 0;
            cursor: pointer;
            box-shadow: 5px 0 15px rgba(255, 122, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-weight: 800;
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            user-select: none;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-search {
            width: 100%;
            background: #FAFAFA;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
        }
        body.dark-mode .sidebar-search { background: #1a1d20; }
        .client-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .client-item {
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .client-item:hover { background: rgba(255, 122, 0, 0.05); border-color: var(--orange); }
        .client-item.active { background: rgba(255, 122, 0, 0.1); border-color: var(--orange); }
        .client-item-name { font-weight: 700; font-size: 0.88rem; }
        .client-item-domain { font-size: 0.72rem; color: var(--orange); font-weight: 600; }

        /* Search input above table */
        .search-bar-wrap {
            margin-bottom: 24px;
            max-width: 440px;
        }
        .main-search-input {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 20px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            transition: 0.3s;
        }
        .main-search-input:focus { border-color: var(--orange); }

        /* Clean Table */
        .table-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        thead th {
            background: #FAF8F5;
            padding: 18px 24px;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
        }
        body.dark-mode thead th { background: #17191C; }
        tbody tr { border-bottom: 1px solid var(--border); transition: background 0.2s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: rgba(0,0,0,0.015); }
        body.dark-mode tbody tr:hover { background: rgba(255,255,255,0.02); }
        tbody td {
            padding: 18px 24px;
            font-size: 0.88rem;
            color: var(--text);
            vertical-align: middle;
        }

        /* Clean Toggle Switch */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #E2E8F0;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 999px;
        }
        body.dark-mode .toggle-slider { background-color: #2D3748; }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        input:checked + .toggle-slider {
            background-color: var(--orange);
        }
        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        /* Toast notifications */
        #toast-container { position: fixed; top: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
        .toast { min-width: 280px; max-width: 380px; padding: 14px 20px; border-radius: 16px; background: #1c1f26; border: 1px solid var(--border); color: #fff; font-size: 0.85rem; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.3); pointer-events: auto; }
        .toast.success { border-left: 5px solid var(--success); }
        .toast.error { border-left: 5px solid var(--danger); }
    </style>
</head>
<body>
    <div id="toast-container"></div>

    <div class="top-bar">
        <a href="index.html" class="btn-panel">PANEL</a>
        <div class="top-right">
            <button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <div id="user-display-pill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:18px; height:18px; color: inherit;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <div class="pill-info">
                    <div id="user-name">&nbsp;</div>
                    <div id="user-role-label">&nbsp;</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Collapsible Sidebar Switcher -->
    <div id="sidebar-container" class="collapsed">
        <div id="sidebar-tab" onclick="toggleSidebar()">FIND RESTAURANT</div>
        <div class="sidebar-header">
            <input type="text" id="client-search" class="sidebar-search" placeholder="Search restaurant or domain..." oninput="filterClients()">
        </div>
        <div class="client-list" id="client-list"></div>
    </div>

    <!-- Search Above Table -->
    <div class="search-bar-wrap">
        <input type="text" id="main-search" class="main-search-input" placeholder="Search restaurant or domain..." oninput="filterMainTable()">
    </div>

    <!-- Main Accounts Services Table -->
    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>Restaurante</th>
                    <th>Dominio</th>
                    <th>Rol</th>
                    <th>Online Payment</th>
                    <th>Promotions</th>
                    <th>Reservations</th>
                </tr>
            </thead>
            <tbody id="services-tbody"></tbody>
        </table>
    </div>

    <script type="module">
        import { supabase as sb } from './supabase.js';

        let allProfiles = [];
        let activeRestaurantId = null;

        window.toggleTheme = () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        };

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        };

        window.toggleSidebar = () => {
            document.getElementById('sidebar-container').classList.toggle('collapsed');
        };

        async function init() {
            if (window.location.search.includes('mock=true')) {
                mockData();
                return;
            }

            const { data: { session } } = await sb.auth.getSession();
            if (!session) { location.href = 'index.html'; return; }

            const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
            const role = (profile?.role || '').trim().toUpperCase();

            if (!['ADMIN', 'SUPERADMIN'].includes(role)) {
                location.href = 'index.html';
                return;
            }

            const pill = document.getElementById('user-display-pill');
            document.getElementById('user-name').textContent = profile?.username || session.user.email.split('@')[0];
            document.getElementById('user-role-label').textContent = role;
            if (role === 'SUPERADMIN') pill.classList.add('superadmin-glow');
            else if (role === 'ADMIN') pill.classList.add('admin-glow');

            await loadProfiles();
        }

        function mockData() {
            const pill = document.getElementById('user-display-pill');
            document.getElementById('user-name').textContent = 'SuperAdmin';
            document.getElementById('user-role-label').textContent = 'SUPERADMIN';
            pill.classList.add('superadmin-glow');

            allProfiles = [
                { id: '1', username: 'Taquería Los Hermanos', domain: 'taquerialoshermanos.com', role: 'owner', services_enabled: { online_payment: true, promotions: true, reservations: false } },
                { id: '2', username: 'Sushi Bistro', domain: 'sushibistro.com', role: 'owner', services_enabled: { online_payment: false, promotions: true, reservations: true } }
            ];

            renderSidebar(allProfiles);
            renderTable(allProfiles);
        }

        async function loadProfiles() {
            const { data, error } = await sb.from('profiles').select('*').order('username', { ascending: true });
            if (error) {
                showToast("Error loading restaurants: " + error.message, "error");
                return;
            }
            allProfiles = data || [];
            renderSidebar(allProfiles);
            renderTable(allProfiles);
        }

        function renderSidebar(profiles) {
            const container = document.getElementById('client-list');
            container.innerHTML = profiles.map(p => `
                <div class="client-item ${p.id === activeRestaurantId ? 'active' : ''}" onclick="selectRestaurant('${p.id}')">
                    <div class="client-item-name">${p.username || 'Sin Nombre'}</div>
                    <div class="client-item-domain">${p.domain || ''}</div>
                </div>
            `).join('');
        }

        window.selectRestaurant = (id) => {
            activeRestaurantId = id;
            renderSidebar(allProfiles);
            const target = allProfiles.find(p => p.id === id);
            if (target) {
                document.getElementById('main-search').value = target.username || target.domain || '';
                filterMainTable();
            }
            document.getElementById('sidebar-container').classList.add('collapsed');
        };

        window.filterClients = () => {
            const term = document.getElementById('client-search').value.toLowerCase().trim();
            const filtered = allProfiles.filter(p =>
                (p.username || '').toLowerCase().includes(term) ||
                (p.domain || '').toLowerCase().includes(term)
            );
            renderSidebar(filtered);
        };

        window.filterMainTable = () => {
            const term = document.getElementById('main-search').value.toLowerCase().trim();
            const filtered = allProfiles.filter(p =>
                (p.username || '').toLowerCase().includes(term) ||
                (p.domain || '').toLowerCase().includes(term)
            );
            renderTable(filtered);
        };

        function renderTable(profiles) {
            const tbody = document.getElementById('services-tbody');
            if (profiles.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-dim); padding: 40px;">No restaurants found.</td></tr>`;
                return;
            }

            tbody.innerHTML = profiles.map(p => {
                const svcs = p.services_enabled || { online_payment: true, promotions: true, reservations: true };
                const isOnlinePay = svcs.online_payment !== false;
                const isPromos = svcs.promotions !== false;
                const isReservations = svcs.reservations !== false;

                return `
                    <tr>
                        <td style="font-weight: 700;">${p.username || 'Sin Nombre'}</td>
                        <td style="color: var(--orange); font-weight: 600; font-size: 0.82rem;">${p.domain || '-'}</td>
                        <td><span style="font-size: 0.72rem; font-weight: 800; text-transform: uppercase; border: 1px solid var(--border); padding: 3px 8px; border-radius: 6px;">${p.role || 'USER'}</span></td>
                        <td>
                            <label class="toggle-switch">
                                <input type="checkbox" ${isOnlinePay ? 'checked' : ''} onchange="toggleService('${p.id}', 'online_payment', this.checked)">
                                <span class="toggle-slider"></span>
                            </label>
                        </td>
                        <td>
                            <label class="toggle-switch">
                                <input type="checkbox" ${isPromos ? 'checked' : ''} onchange="toggleService('${p.id}', 'promotions', this.checked)">
                                <span class="toggle-slider"></span>
                            </label>
                        </td>
                        <td>
                            <label class="toggle-switch">
                                <input type="checkbox" ${isReservations ? 'checked' : ''} onchange="toggleService('${p.id}', 'reservations', this.checked)">
                                <span class="toggle-slider"></span>
                            </label>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.toggleService = async (profileId, serviceKey, isEnabled) => {
            const profile = allProfiles.find(p => p.id === profileId);
            if (!profile) return;

            const svcs = profile.services_enabled || { online_payment: true, promotions: true, reservations: true };
            svcs[serviceKey] = isEnabled;
            profile.services_enabled = svcs;

            if (window.location.search.includes('mock=true')) {
                showToast(`Servicio ${serviceKey} ${isEnabled ? 'activado' : 'desactivado'}`);
                return;
            }

            const { error } = await sb.from('profiles').update({
                services_enabled: svcs
            }).eq('id', profileId);

            if (error) {
                showToast("Error updating service: " + error.message, "error");
            } else {
                showToast(`Servicio ${serviceKey} ${isEnabled ? 'activado' : 'desactivado'}`);
            }
        };

        init();
    </script>
</body>
</html>
