<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avance de Funciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;

      --color-orange: #ea580c;
      --color-green: #16a34a;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 10px -2px rgba(15, 23, 42, 0.06);
      --shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 36px 24px 80px;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    /* BARRA SUPERIOR DISCRETA (SOLO VISIBLE SI ES ADMIN AUTENTICADO) */
    .top-bar {
      display: none;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      min-height: 42px;
    }
    body.is-admin-user .top-bar { display: flex; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      font-family: inherit;
    }

    .btn-toggle-admin {
      background: #ffffff;
      color: #334155;
      border-color: #cbd5e1;
      box-shadow: var(--shadow-sm);
    }
    .btn-toggle-admin:hover { background: #f8fafc; border-color: #94a3b8; }
    .btn-toggle-admin.active { background: #0f172a; color: #ffffff; border-color: #0f172a; }

    .btn-primary {
      background: #ea580c;
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(234, 88, 12, 0.2);
    }
    .btn-primary:hover { background: #c2410c; transform: translateY(-1px); }

    .btn-ghost { background: #ffffff; color: #334155; border-color: #cbd5e1; }
    .btn-ghost:hover { background: #f8fafc; border-color: #94a3b8; }

    .admin-only-btn { display: none; }
    body.is-admin-editing .admin-only-btn { display: inline-flex; }

    /* LISTA VERTICAL DE FUNCIONES */
    .objectives-list { display: flex; flex-direction: column; gap: 16px; }

    .objective-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
      position: relative;
    }
    .objective-row:hover { border-color: #cbd5e1; box-shadow: var(--shadow-md); }

    .row-main { display: flex; width: 100%; align-items: center; gap: 20px; flex-wrap: wrap; }

    /* ARRASTRAR PARA REORDENAR */
    .drag-handle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      color: #94a3b8;
      cursor: grab;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    body.is-admin-editing .drag-handle { display: flex; }
    .drag-handle:hover { background: #f1f5f9; color: #0f172a; }
    .drag-handle:active { cursor: grabbing; }

    .objective-row.dragging {
      opacity: 0.45;
      border-style: dashed;
      border-color: var(--color-orange);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
    }
    .objective-row.drop-target {
      border-color: var(--color-orange);
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.12);
    }

    /* SUBFUNCIONES */
    .subfunctions-wrap {
      display: none;
      margin-top: 14px;
      padding-left: 18px;
      border-left: 2px solid #e2e8f0;
      flex-direction: column;
      gap: 12px;
    }
    .subfunctions-wrap.open { display: flex; }

    .objective-row.is-sub {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: #f8fafc;
    }
    .objective-row.is-sub .media-thumb-box { width: 74px; height: 52px; }
    .objective-row.is-sub .obj-title { font-size: 15px; }
    .objective-row.is-sub .progress-pill { font-size: 13px; padding: 4px 12px; min-width: 52px; }

    .sub-toggle-btn {
      display: none;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 3px 6px;
      margin-top: 4px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      align-self: flex-start;
      transition: background 0.15s, color 0.15s;
    }
    .sub-toggle-btn.visible { display: inline-flex; }
    .sub-toggle-btn:hover { background: #f1f5f9; color: #0f172a; }
    .sub-toggle-btn .chev { transition: transform 0.2s ease; font-size: 10px; }
    .sub-toggle-btn.open .chev { transform: rotate(90deg); }

    .btn-add-sub {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: var(--radius-full);
      border: 1px dashed #cbd5e1;
      background: #ffffff;
      color: #64748b;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    body.is-admin-editing .btn-add-sub { display: inline-flex; }
    .btn-add-sub:hover { border-color: #ea580c; color: #ea580c; background: #fff7ed; }

    .computed-hint {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
      white-space: nowrap;
    }

    /* MINIATURA */
    .media-thumb-box {
      width: 90px;
      height: 62px;
      flex-shrink: 0;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #0f172a;
      position: relative;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-thumb-box:hover {
      transform: scale(1.04);
      border-color: #ea580c;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }
    .media-thumb-box video,
    .media-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: 0.9;
      transition: opacity 0.2s;
    }
    .media-thumb-box:hover video,
    .media-thumb-box:hover img { opacity: 1; }

    .thumb-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.28);
      transition: background 0.2s;
    }
    .media-thumb-box:hover .thumb-play-overlay { background: rgba(15, 23, 42, 0.08); }

    .thumb-play-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s, background 0.2s, color 0.2s;
    }
    .media-thumb-box:hover .thumb-play-btn { transform: scale(1.12); background: #ea580c; color: #ffffff; }
    .media-thumb-box.is-100:hover .thumb-play-btn { background: #16a34a; }

    .thumb-count-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(15, 23, 42, 0.75);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: var(--radius-full);
      backdrop-filter: blur(2px);
    }

    /* INFORMACION */
    .obj-info-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .obj-title {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .obj-desc { font-size: 13px; color: #64748b; line-height: 1.45; font-weight: 450; }

    /* PROGRESO Y CONTROLES */
    .obj-progress-col { display: flex; align-items: center; gap: 16px; margin-left: auto; flex-shrink: 0; }

    .progress-pill {
      font-size: 14px;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      padding: 5px 14px;
      border-radius: var(--radius-full);
      min-width: 58px;
      text-align: center;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .admin-slider-wrap { display: none; align-items: center; gap: 12px; width: 200px; }
    body.is-admin-editing .admin-slider-wrap { display: flex; }

    .admin-range-slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #e2e8f0;
      border-radius: var(--radius-full);
      outline: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .admin-range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: var(--radius-full);
      background: #0f172a;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s, background 0.15s;
    }
    .admin-range-slider::-webkit-slider-thumb:hover { transform: scale(1.2); background: #ea580c; }

    .admin-actions { display: none; align-items: center; gap: 6px; }
    body.is-admin-editing .admin-actions { display: flex; }

    .btn-action-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-full);
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #64748b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    .btn-action-icon:hover { background: #f8fafc; color: #0f172a; border-color: #cbd5e1; }
    .btn-action-icon.btn-delete:hover { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }

    /* ============================================================
       VISOR DE MEDIOS (SLIDE LIMPIO, SIN TITULOS NI BOTONES)
       ============================================================ */
    .viewer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 12, 20, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .viewer-overlay.active { display: flex; }

    .viewer-stage-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      max-width: 1400px;
      width: 100%;
      animation: modalFadeIn 0.22s ease-out;
    }

    .viewer-stage {
      position: relative;
      background: #000;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-modal);
      width: min(92vw, 1180px);
      max-height: 88vh;
      transition: width 0.25s ease;
    }

    .viewer-track {
      display: flex;
      transition: transform 0.38s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: transform;
    }

    .viewer-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 88vh;
      max-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      padding: 60px 70px;
    }

    .viewer-media { position: relative; display: inline-flex; max-width: 100%; max-height: 100%; transform-origin: center center; }
    .viewer-media img,
    .viewer-media video {
      display: block;
      max-width: 100%;
      max-height: 68vh;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      border-radius: var(--radius-md);
    }
    .viewer-media canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    /* Notas flotantes (visor) */
    .viewer-notes-layer {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }
    .viewer-note-box {
      position: absolute;
      transform: translate(-50%, -50%);
      background: #ffffff;
      color: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      line-height: 1.4;
      padding: 8px 10px;
      border-radius: 10px;
      max-width: 190px;
      min-width: 40px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ============================================================
       EDITOR DE FUNCION (MODAL)
       ============================================================ */
    .editor-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 3200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .editor-overlay.active { display: flex; }

    .editor-modal {
      background: #ffffff;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 1080px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-modal);
      animation: modalFadeIn 0.22s ease-out;
    }

    .editor-header {
      padding: 16px 22px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .editor-header h3 { font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 700; }
    .editor-close {
      background: transparent;
      border: none;
      font-size: 22px;
      line-height: 1;
      color: #94a3b8;
      cursor: pointer;
      transition: color 0.2s;
    }
    .editor-close:hover { color: #0f172a; }

    .editor-body {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 0;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }

    .editor-left {
      padding: 18px 22px;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      overflow-y: auto;
      background: #f8fafc;
    }

    .editor-right {
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      overflow-y: auto;
    }

    .editor-stage-wrap { display: flex; flex-direction: column; gap: 10px; align-items: center; }

    .editor-stage {
      position: relative;
      background: #0f172a;
      border-radius: var(--radius-md);
      overflow: hidden;
      width: 100%;
      height: 46vh;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .editor-zoom-layer {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.18s ease;
    }
    .editor-zoom-layer img,
    .editor-zoom-layer video {
      display: block;
      max-width: 100%;
      max-height: 46vh;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .editor-zoom-layer canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .editor-stage > video {
      display: block;
      max-width: 100%;
      max-height: 46vh;
      width: auto;
      height: auto;
    }
    .editor-stage.drawing canvas { pointer-events: auto; cursor: crosshair; }
    .editor-stage.tool-note canvas { pointer-events: auto; cursor: copy; }
    .editor-stage.tool-text canvas { pointer-events: auto; cursor: text; }
    .editor-stage.tool-pan { cursor: grab; }
    .editor-stage.tool-pan:active { cursor: grabbing; }
    .editor-stage.tool-pan canvas { pointer-events: none; }

    /* Capa de notas del editor */
    .editor-notes-layer { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
    .editor-note {
      position: absolute;
      transform: translate(-50%, -50%);
      background: #ffffff;
      color: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      line-height: 1.35;
      border-radius: 9px;
      min-width: 90px;
      max-width: 220px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      border: 1.5px solid transparent;
      touch-action: none;
      pointer-events: auto;
      overflow: hidden;
    }
    .editor-note.active { border-color: #ea580c; box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.25); }
    .editor-note .note-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #f1f5f9;
      padding: 2px 6px;
      cursor: grab;
      user-select: none;
    }
    .editor-note .note-bar:active { cursor: grabbing; }
    .editor-note .note-grip { color: #94a3b8; font-size: 10px; letter-spacing: 1px; }
    .editor-note .note-del {
      border: none;
      background: transparent;
      color: #ef4444;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
    }
    .editor-note .note-input {
      padding: 6px 9px;
      min-height: 18px;
      outline: none;
      white-space: pre-wrap;
      word-break: break-word;
      cursor: text;
      color: #0f172a;
    }
    .editor-note .note-input:empty::before {
      content: attr(data-ph);
      color: #94a3b8;
      font-style: italic;
    }
    .editor-note.placeholder { color: #94a3b8; font-style: italic; }

    /* Entrada de texto flotante (herramienta Texto) */
    .editor-text-input {
      position: absolute;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      border: 1.5px solid #ea580c;
      border-radius: 6px;
      padding: 3px 6px;
      outline: none;
      min-width: 90px;
      z-index: 5;
    }

    .editor-empty { color: #94a3b8; font-size: 13px; padding: 40px 20px; text-align: center; }

    .draw-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }

    .draw-toolbar .swatch {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-full);
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px #cbd5e1;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .draw-toolbar .swatch:hover { transform: scale(1.12); }
    .draw-toolbar .swatch.active { box-shadow: 0 0 0 2px #0f172a; }

    .draw-toolbar .size-dot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: var(--radius-full);
      border: 1px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
    }
    .draw-toolbar .size-dot span { display: block; border-radius: var(--radius-full); background: #0f172a; }
    .draw-toolbar .size-dot.active { border-color: #0f172a; background: #f1f5f9; }

    .tool-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      font-size: 13px;
    }
    .tool-btn:hover { background: #f1f5f9; }
    .tool-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 4px;
      display: block;
    }

    .edit-input,
    .edit-textarea {
      width: 100%;
      padding: 9px 12px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-sm);
      color: #0f172a;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }
    .edit-input:focus,
    .edit-textarea:focus { border-color: #ea580c; box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.12); }
    .edit-textarea { resize: vertical; min-height: 56px; line-height: 1.5; }

    .field-group { display: flex; flex-direction: column; }

    /* Zona de carga (drag & drop) */
    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: var(--radius-md);
      padding: 22px 16px;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      background: #fff;
    }
    .dropzone:hover { border-color: #94a3b8; color: #64748b; }
    .dropzone.dragover { border-color: #ea580c; background: #fff7ed; color: #ea580c; }

    /* Lista de medios del editor */
    .media-list { display: flex; flex-direction: column; gap: 10px; }

    .media-item {

      gap: 10px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;

    .media-item.active { border-color: #ea580c; box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.12); }

    .media-item-thumb {
      width: 64px;
      height: 48px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #0f172a;
      flex-shrink: 0;

      align-items: center;
      justify-content: center;
      cursor: pointer;

    .media-item-thumb img,
    .media-item-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }

    .media-item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

    .media-remove {
      width: 26px;
      height: 26px;
      border-radius: var(--radius-sm);
      border: 1px solid #e2e8f0;
      background: #fff;

      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
