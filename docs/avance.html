<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avance de Funciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;

      --color-orange: #ea580c;
      --color-green: #16a34a;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 10px -2px rgba(15, 23, 42, 0.06);
      --shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 36px 24px 80px;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* BARRA SUPERIOR DISCRETA (SOLO VISIBLE SI ES ADMIN AUTENTICADO) */
    .top-bar {
      display: none;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      min-height: 42px;
    }

    body.is-admin-user .top-bar {
      display: flex;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      font-family: inherit;
    }

    .btn-toggle-admin {
      background: #ffffff;
      color: #334155;
      border-color: #cbd5e1;
      box-shadow: var(--shadow-sm);
    }
    .btn-toggle-admin:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }
    .btn-toggle-admin.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .btn-primary {
      background: #ea580c;
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(234, 88, 12, 0.2);
    }
    .btn-primary:hover {
      background: #c2410c;
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: #ffffff;
      color: #334155;
      border-color: #cbd5e1;
    }
    .btn-ghost:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .admin-only-btn {
      display: none;
    }
    body.is-admin-editing .admin-only-btn {
      display: inline-flex;
    }

    /* LISTA VERTICAL DE FUNCIONES (FILA POR FILA) */
    .objectives-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .objective-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
      position: relative;
    }

    .objective-row:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
    }

    .row-main {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* ARRASTRAR PARA REORDENAR (SOLO EN MODO EDICION) */
    .drag-handle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      color: #94a3b8;
      cursor: grab;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    body.is-admin-editing .drag-handle {
      display: flex;
    }
    .drag-handle:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .drag-handle:active {
      cursor: grabbing;
    }

    .objective-row.dragging {
      opacity: 0.45;
      border-style: dashed;
      border-color: var(--color-orange);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
    }
    .objective-row.drop-target {
      border-color: var(--color-orange);
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.12);
    }

    /* 1. CUADRITO DE VISTA PREVIA */
    .video-thumb-box {
      width: 90px;
      height: 62px;
      flex-shrink: 0;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #0f172a;
      position: relative;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-thumb-box:hover {
      transform: scale(1.04);
      border-color: #ea580c;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    .video-thumb-box video,
    .video-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: 0.9;
      transition: opacity 0.2s;
    }
    .video-thumb-box:hover video,
    .video-thumb-box:hover img {
      opacity: 1;
    }

    .thumb-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.3);
      transition: background 0.2s;
    }
    .video-thumb-box:hover .thumb-play-overlay {
      background: rgba(15, 23, 42, 0.1);
    }

    .thumb-play-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s, background 0.2s, color 0.2s;
    }
    .video-thumb-box:hover .thumb-play-btn {
      transform: scale(1.12);
      background: #ea580c;
      color: #ffffff;
    }
    .video-thumb-box.is-100:hover .thumb-play-btn {
      background: #16a34a;
    }

    /* Indicador de varias piezas (reel) */
    .thumb-count-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(15, 23, 42, 0.75);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      gap: 3px;
      backdrop-filter: blur(2px);
    }

    /* 2. COLUMNA INFORMACION */
    .obj-info-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .obj-title {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .obj-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.45;
      font-weight: 450;
    }

    /* 3. PROGRESO Y CONTROLES */
    .obj-progress-col {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .progress-pill {
      font-size: 14px;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      padding: 5px 14px;
      border-radius: var(--radius-full);
      min-width: 58px;
      text-align: center;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .admin-slider-wrap {
      display: none;
      align-items: center;
      gap: 12px;
      width: 200px;
    }
    body.is-admin-editing .admin-slider-wrap {
      display: flex;
    }

    .admin-range-slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #e2e8f0;
      border-radius: var(--radius-full);
      outline: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .admin-range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: var(--radius-full);
      background: #0f172a;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s, background 0.15s;
    }
    .admin-range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      background: #ea580c;
    }

    /* ACCIONES ADMIN EN FILA */
    .admin-actions {
      display: none;
      align-items: center;
      gap: 6px;
    }
    body.is-admin-editing .admin-actions {
      display: flex;
    }

    .btn-action-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-full);
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #64748b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .btn-action-icon:hover {
      background: #f8fafc;
      color: #0f172a;
      border-color: #cbd5e1;
    }

    .btn-action-icon.btn-delete:hover {
      background: #fef2f2;
      color: #ef4444;
      border-color: #fca5a5;
    }

    /* ============================================================
       VISOR DE MEDIOS (SLIDE LIMPIO, SIN TITULOS NI BOTONES)
       ============================================================ */
    .viewer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 12, 20, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .viewer-overlay.active {
      display: flex;
    }

    .viewer-stage-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      max-width: 1400px;
      width: 100%;
      animation: modalFadeIn 0.22s ease-out;
    }

    .viewer-stage {
      position: relative;
      background: #000;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-modal);
      width: min(88vw, 1100px);
      max-height: 86vh;
      transition: width 0.25s ease;
    }
    /* Cuando hay nota lateral, el escenario se reduce para dejarle sitio */
    .viewer-stage-wrap.has-note .viewer-stage {
      width: min(58vw, 820px);
    }

    .viewer-track {
      display: flex;
      transition: transform 0.38s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: transform;
    }

    .viewer-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 86vh;
      max-height: 86vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .viewer-slide img,
    .viewer-slide video {
      display: block;
      max-width: 100%;
      max-height: 86vh;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Nota lateral: solo aparece si la imagen actual tiene nota */
    .viewer-note-panel {
      width: 320px;
      max-width: 34vw;
      max-height: 80vh;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.98);
      color: #0f172a;
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      box-shadow: var(--shadow-modal);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      display: none;
      animation: modalFadeIn 0.25s ease-out;
    }
    .viewer-note-panel.visible {
      display: block;
    }
    .viewer-note-label {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .viewer-note-text {
      color: #1e293b;
      font-weight: 500;
    }

    /* ============================================================
       EDITOR DE FUNCION (MODAL)
       ============================================================ */
    .editor-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 3200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .editor-overlay.active {
      display: flex;
    }

    .editor-modal {
      background: #ffffff;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 1080px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-modal);
      animation: modalFadeIn 0.22s ease-out;
    }

    .editor-header {
      padding: 16px 22px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .editor-header h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 700;
    }
    .editor-close {
      background: transparent;
      border: none;
      font-size: 22px;
      line-height: 1;
      color: #94a3b8;
      cursor: pointer;
      transition: color 0.2s;
    }
    .editor-close:hover { color: #0f172a; }

    .editor-body {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 0;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }

    .editor-left {
      padding: 18px 22px;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      overflow-y: auto;
      background: #f8fafc;
    }

    .editor-right {
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      overflow-y: auto;
    }

    .editor-stage-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .editor-stage {
      position: relative;
      background: #0f172a;
      border-radius: var(--radius-md);
      overflow: hidden;
      width: 100%;
      max-height: 46vh;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .editor-stage img,
    .editor-stage video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 46vh;
      object-fit: contain;
    }
    .editor-stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .editor-stage.drawing canvas {
      pointer-events: auto;
      cursor: crosshair;
    }

    .editor-empty {
      color: #94a3b8;
      font-size: 13px;
      padding: 40px 20px;
      text-align: center;
    }

    .draw-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .draw-toolbar .swatch {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-full);
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px #cbd5e1;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .draw-toolbar .swatch:hover { transform: scale(1.12); }
    .draw-toolbar .swatch.active { box-shadow: 0 0 0 2px #0f172a; }

    .draw-toolbar .size-dot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: var(--radius-full);
      border: 1px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
    }
    .draw-toolbar .size-dot span {
      display: block;
      border-radius: var(--radius-full);
      background: #0f172a;
    }
    .draw-toolbar .size-dot.active {
      border-color: #0f172a;
      background: #f1f5f9;
    }

    .tool-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .tool-btn:hover { background: #f1f5f9; }
    .tool-btn.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
    }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 4px;
      display: block;
    }

    .edit-input,
    .edit-textarea {
      width: 100%;
      padding: 9px 12px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-sm);
      color: #0f172a;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }
    .edit-input:focus,
    .edit-textarea:focus {
      border-color: #ea580c;
      box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.12);
    }
    .edit-textarea {
      resize: vertical;
      min-height: 62px;
      line-height: 1.5;
    }

    .field-group { display: flex; flex-direction: column; }

    /* Lista de imagenes dentro del editor */
    .images-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .image-item {
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 10px;
      display: flex;
      gap: 10px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .image-item.active {
      border-color: #ea580c;
      box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.12);
    }

    .image-item-thumb {
      width: 64px;
      height: 48px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #0f172a;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .image-item-thumb .ph {
      color: #64748b;
      font-size: 16px;
    }

    .image-item-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .image-item-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .mini-btn {
      width: 26px;
      height: 26px;
      border-radius: var(--radius-sm);
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #64748b;
      cursor: pointer;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .mini-btn:hover { background: #f8fafc; color: #0f172a; }
    .mini-btn.danger:hover { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }

    .note-indicator {
      font-size: 11px;
      color: #ea580c;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .editor-footer {
      padding: 14px 22px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: #fff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.97) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* RESPONSIVE */
    @media (max-width: 860px) {
      .editor-body { grid-template-columns: 1fr; }
      .editor-left { border-right: none; border-bottom: 1px solid #e2e8f0; }
      .viewer-stage-wrap { flex-direction: column; gap: 16px; }
      .viewer-note-panel { width: 100%; max-width: 88vw; max-height: 30vh; }
    }

    @media (max-width: 768px) {
      body { padding: 20px 14px 40px; }
      .row-main { flex-direction: column; align-items: flex-start; gap: 14px; }
      .obj-progress-col { width: 100%; justify-content: space-between; margin-left: 0; }
      .admin-slider-wrap { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- BARRA SUPERIOR DISCRETA (SOLO VISIBLE SI ES ADMIN AUTENTICADO) -->
    <div class="top-bar" id="top-bar">
      <button class="btn btn-primary admin-only-btn" id="btn-add-inline">
        <i class="fa-solid fa-plus"></i> Agregar Función
      </button>
      <button class="btn btn-toggle-admin" id="btn-toggle-admin" title="Activar/Desactivar controles de edición">
        <i class="fa-solid fa-lock" id="icon-admin-status"></i>
        <span id="text-admin-status">Editar</span>
      </button>
    </div>

    <!-- LISTA VERTICAL DE FUNCIONES -->
    <div class="objectives-list" id="objectives-list"></div>

  </div>

  <!-- VISOR DE MEDIOS (SLIDE LIMPIO) -->
  <div class="viewer-overlay" id="viewer-modal">
    <div class="viewer-stage-wrap">
      <div class="viewer-stage" id="viewer-stage">
        <div class="viewer-track" id="viewer-track"></div>
      </div>
      <div class="viewer-note-panel" id="viewer-note-panel">
        <div class="viewer-note-label">Nota</div>
        <div class="viewer-note-text" id="viewer-note-text"></div>
      </div>
    </div>
  </div>

  <!-- EDITOR DE FUNCION -->
  <div class="editor-overlay" id="editor-modal">
    <div class="editor-modal">
      <div class="editor-header">
        <h3>Editar Función</h3>
        <button class="editor-close" id="btn-close-editor">&times;</button>
      </div>
      <div class="editor-body">
        <div class="editor-left">
          <span class="field-label">Dibujar sobre la imagen seleccionada</span>
          <div class="editor-stage-wrap">
            <div class="editor-stage" id="editor-stage"></div>
            <div class="draw-toolbar" id="draw-toolbar"></div>
          </div>
        </div>
        <div class="editor-right">
          <div class="field-group">
            <label class="field-label" for="ed-title">Nombre</label>
            <input type="text" class="edit-input" id="ed-title" placeholder="Nombre de la función">
          </div>
          <div class="field-group">
            <label class="field-label" for="ed-desc">Descripción (opcional)</label>
            <input type="text" class="edit-input" id="ed-desc" placeholder="Descripción opcional">
          </div>
          <div class="field-group">
            <label class="field-label" for="ed-video">Ruta del video (opcional)</label>
            <input type="text" class="edit-input" id="ed-video" placeholder="ej. ./assets/misAvances/img/video.mp4">
          </div>
          <div class="field-group">
            <label class="field-label">Imágenes / Reel</label>
            <div class="images-list" id="images-list"></div>
            <button class="btn btn-ghost" id="btn-add-image" style="margin-top:10px; justify-content:center;">
              <i class="fa-solid fa-image"></i> Agregar imagen
            </button>
          </div>
        </div>
      </div>
      <div class="editor-footer">
        <button class="btn btn-ghost" id="btn-cancel-editor">Cancelar</button>
        <button class="btn btn-primary" id="btn-save-editor"><i class="fa-solid fa-check"></i> Guardar Cambios</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase as sb } from './supabase.js';

    // DATOS POR DEFECTO (cada funcion puede tener video y/o varias imagenes)
    const DEFAULT_OBJECTIVES = [
      {
        id: "obj-1",
        title: "Online payment",
        description: "Integración de pasarela de pagos con Stripe Connect para pedidos y reservas.",
        progress: 95,
        video: "./assets/misAvances/img/onlinepayment.mp4",
        images: []
      },
      {
        id: "obj-2",
        title: "Menu creation",
        description: "Constructor visual de categorías y platillos en tiempo real.",
        progress: 100,
        video: "./assets/misAvances/img/menucreation.mp4",
        images: []
      },
      {
        id: "obj-3",
        title: "Generador de menu con MenutechIA",
        description: "Lectura de fotos de menú físico e importación automática con IA.",
        progress: 85,
        video: "./assets/misAvances/img/menutechia.mp4",
        images: []
      },
      {
        id: "obj-4",
        title: "App Android Flutter",
        description: "Aplicación nativa para restaurantes con alertas sonoras y comanderas.",
        progress: 90,
        video: "./assets/misAvances/img/appflutter.mp4",
        images: []
      },
      {
        id: "obj-5",
        title: "Google play store",
        description: "Preparación de bundle AAB y publicación en Google Play Console.",
        progress: 60,
        video: "./assets/misAvances/img/playstore.mp4",
        images: []
      }
    ];

    const STORAGE_KEY = "menutech_avances_list_v4";

    // ESTADO
    let objectives = [];
    let isUserAdmin = false;
    let isEditingActive = false;
    let editingId = null;

    // Estado del visor (slide)
    let viewerItems = [];
    let viewerIndex = 0;

    // Estado del editor
    let editorItem = null;
    let activeImageIndex = -1;   // imagen seleccionada para dibujar
    let drawColor = "#ef4444";
    let drawSize = 4;
    let drawMode = true;
    let isDrawing = false;
    let currentStroke = null;

    // INICIALIZACION
    async function init() {
      loadData();
      renderList();
      setupEvents();
      await verifyAdminAuthentication();
    }

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          objectives = JSON.parse(saved);
          objectives.forEach(o => { if (!Array.isArray(o.images)) o.images = []; });
        } else {
          objectives = JSON.parse(JSON.stringify(DEFAULT_OBJECTIVES));
          saveData();
        }
      } catch (e) {
        objectives = JSON.parse(JSON.stringify(DEFAULT_OBJECTIVES));
      }
    }

    function saveData() {
      if (!isUserAdmin) return;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(objectives));
      } catch (e) {
        console.error("Error guardando:", e);
      }
    }

    // Helper: Extraer usuario de la sesión de Supabase o directamente de localStorage
    function getStoredAuthUser() {
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.startsWith('sb-') || key.includes('supabase')) && (key.endsWith('-auth-token') || key.includes('auth'))) {
            const raw = localStorage.getItem(key);
            if (!raw) continue;
            const parsed = JSON.parse(raw);
            const user = parsed.user || (parsed.session ? parsed.session.user : null) || (parsed.currentSession ? parsed.currentSession.user : null);
            if (user && user.id) return user;
          }
        }
      } catch (e) {
        console.warn("Error leyendo localStorage de Supabase:", e);
      }
      return null;
    }

    window.verifyAdminAuth = async function verifyAdminAuthentication() {
      try {
        let userId = null;

        if (sb && sb.auth) {
          const { data } = await sb.auth.getSession();
          if (data && data.session && data.session.user) {
            userId = data.session.user.id;
          }
        }

        if (!userId) {
          const storedUser = getStoredAuthUser();
          if (storedUser && storedUser.id) {
            userId = storedUser.id;
          }
        }

        if (!userId) {
          disableAdminUI();
          return;
        }

        const { data, error } = await sb
          .from('profiles')
          .select('role')
          .eq('id', userId);

        const profile = (data && data.length > 0) ? data[0] : null;

        if (error || !profile) {
          console.warn("No se pudo obtener el perfil para verificación de admin:", error);
          disableAdminUI();
          return;
        }

        const role = (profile.role || '').trim().toUpperCase();
        const privilegedRoles = ['ADMIN', 'DEVELOPER', 'CS', 'ADMINCS'];

        if (privilegedRoles.includes(role)) {
          enableAdminUI();
        } else {
          disableAdminUI();
        }
      } catch (err) {
        console.error("Error en verificación de administrador:", err);
        disableAdminUI();
      }
    }

    function enableAdminUI() {
      isUserAdmin = true;
      document.body.classList.add("is-admin-user");
    }

    function disableAdminUI() {
      isUserAdmin = false;
      isEditingActive = false;
      editingId = null;
      document.body.classList.remove("is-admin-user");
      document.body.classList.remove("is-admin-editing");
      renderList();
    }

    function toggleEditMode() {
      if (!isUserAdmin) return;

      isEditingActive = !isEditingActive;
      const btnToggle = document.getElementById("btn-toggle-admin");
      const icon = document.getElementById("icon-admin-status");
      const text = document.getElementById("text-admin-status");

      if (isEditingActive) {
        document.body.classList.add("is-admin-editing");
        btnToggle.classList.add("active");
        icon.className = "fa-solid fa-lock-open";
        text.textContent = "Modo Edición Activo";
      } else {
        document.body.classList.remove("is-admin-editing");
        btnToggle.classList.remove("active");
        icon.className = "fa-solid fa-lock";
        text.textContent = "Editar";
        editingId = null;
      }
      renderList();
    }

    // COLOR DINAMICO PROGRESIVO
    function getColorForProgress(pct) {
      const p = Math.max(0, Math.min(100, Number(pct) || 0));

      if (p >= 100) {
        return { color: "#16a34a", bg: "#dcfce7", text: "#15803d", border: "#86efac", is100: true };
      } else if (p >= 80) {
        return { color: "#65a30d", bg: "#ecfccb", text: "#4d7c0f", border: "#bef264", is100: false };
      } else if (p >= 60) {
        return { color: "#eab308", bg: "#fef9c3", text: "#a16207", border: "#fde047", is100: false };
      } else if (p >= 35) {
        return { color: "#f97316", bg: "#ffedd5", text: "#c2410c", border: "#fed7aa", is100: false };
      } else {
        return { color: "#ea580c", bg: "#ffedd5", text: "#c2410c", border: "#fdba74", is100: false };
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // Devuelve la primera pieza de medio disponible (para la miniatura)
    function getPrimaryMedia(item) {
      if (Array.isArray(item.images) && item.images.length > 0) {
        return { type: "image", src: item.images[0].src || "" };
      }
      if (item.video) {
        return { type: "video", src: item.video };
      }
      return { type: "none", src: "" };
    }

    function getMediaCount(item) {
      const imgs = Array.isArray(item.images) ? item.images.length : 0;
      return imgs + (item.video ? 1 : 0);
    }

    // Construye la lista de medios (video primero, luego imagenes)
    function buildMediaList(item) {
      const list = [];
      if (item.video) list.push({ type: "video", src: item.video, note: "" });
      (item.images || []).forEach(img => list.push({ type: "image", src: img.src || "", note: img.note || "", strokes: img.strokes || [] }));
      return list;
    }

    // RENDERIZAR LISTA
    function renderList() {
      const listContainer = document.getElementById("objectives-list");
      listContainer.innerHTML = "";

      if (objectives.length === 0) {
        listContainer.innerHTML = `
          <div style="background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:36px; text-align:center; color:#64748b;">
            No hay funciones registradas.
          </div>
        `;
        return;
      }

      objectives.forEach(item => {
        const color = getColorForProgress(item.progress);
        const primary = getPrimaryMedia(item);
        const mediaCount = getMediaCount(item);

        const row = document.createElement("div");
        row.className = "objective-row";
        row.dataset.id = item.id;

        let thumbInner = `<div class="thumb-play-overlay"><div class="thumb-play-btn"><i class="fa-regular fa-image"></i></div></div>`;
        if (primary.type === "video") {
          thumbInner = `<video src="${escapeHtml(primary.src)}" preload="metadata" muted></video>` +
            `<div class="thumb-play-overlay"><div class="thumb-play-btn"><i class="fa-solid fa-play"></i></div></div>`;
        } else if (primary.type === "image") {
          thumbInner = `<img src="${escapeHtml(primary.src)}" alt="">` +
            `<div class="thumb-play-overlay"><div class="thumb-play-btn"><i class="fa-solid fa-expand"></i></div></div>`;
        }

        const countBadge = mediaCount > 1 ? `<div class="thumb-count-badge"><i class="fa-solid fa-layer-group"></i>${mediaCount}</div>` : "";

        row.innerHTML = `
          <div class="row-main">

            <div class="drag-handle" title="Arrastra para reordenar"><i class="fa-solid fa-grip-vertical"></i></div>

            <div class="video-thumb-box ${color.is100 ? 'is-100' : ''}" onclick="window.openViewer('${escapeHtml(item.id)}')" title="Ver contenido">
              ${thumbInner}
              ${countBadge}
            </div>

            <div class="obj-info-col">
              <span class="obj-title">${escapeHtml(item.title)}</span>
              ${item.description ? `<p class="obj-desc">${escapeHtml(item.description)}</p>` : ''}
            </div>

            <div class="obj-progress-col">
              <div class="admin-slider-wrap">
                <input type="range" class="admin-range-slider" min="0" max="100" value="${item.progress}"
                  oninput="window.handleSliderChange('${escapeHtml(item.id)}', this.value)">
              </div>

              <span class="progress-pill pill-${escapeHtml(item.id)}" style="background-color: ${color.bg}; color: ${color.text}; border-color: ${color.border};">
                ${item.progress}%
              </span>

              <div class="admin-actions">
                <button class="btn-action-icon" title="Editar función" onclick="window.openEditor('${escapeHtml(item.id)}')">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button class="btn-action-icon btn-delete" title="Eliminar función" onclick="window.deleteObjective('${escapeHtml(item.id)}')">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>

          </div>
        `;

        listContainer.appendChild(row);
      });

      attachDragHandlers();
    }

    // ============================================================
    // ARRASTRAR Y SOLTAR PARA REORDENAR
    // ============================================================
    function attachDragHandlers() {
      const rows = document.querySelectorAll(".objective-row");
      rows.forEach(row => {
        const handle = row.querySelector(".drag-handle");
        if (!handle) return;

        handle.setAttribute("draggable", "true");

        handle.addEventListener("dragstart", (e) => {
          if (!isUserAdmin || !isEditingActive) { e.preventDefault(); return; }
          row.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          try { e.dataTransfer.setData("text/plain", row.dataset.id); } catch (err) {}
        });

        handle.addEventListener("dragend", () => {
          row.classList.remove("dragging");
          document.querySelectorAll(".objective-row").forEach(r => r.classList.remove("drop-target"));
          commitDragOrder();
        });

        row.addEventListener("dragover", (e) => {
          if (!isUserAdmin || !isEditingActive) return;
          const dragging = document.querySelector(".objective-row.dragging");
          if (!dragging || dragging === row) return;
          e.preventDefault();

          const list = document.getElementById("objectives-list");
          const rect = row.getBoundingClientRect();
          const after = (e.clientY - rect.top) > rect.height / 2;

          document.querySelectorAll(".objective-row").forEach(r => r.classList.remove("drop-target"));
          row.classList.add("drop-target");

          if (after) {
            list.insertBefore(dragging, row.nextSibling);
          } else {
            list.insertBefore(dragging, row);
          }
        });

        row.addEventListener("drop", (e) => {
          if (!isUserAdmin || !isEditingActive) return;
          e.preventDefault();
          document.querySelectorAll(".objective-row").forEach(r => r.classList.remove("drop-target"));
          commitDragOrder();
        });
      });
    }

    // Lee el orden visual del DOM y lo guarda en el estado
    function commitDragOrder() {
      if (!isUserAdmin || !isEditingActive) return;
      const ids = Array.from(document.querySelectorAll(".objective-row")).map(r => r.dataset.id);
      const reordered = [];
      ids.forEach(id => {
        const found = objectives.find(o => o.id === id);
        if (found) reordered.push(found);
      });
      if (reordered.length === objectives.length) {
        objectives = reordered;
        saveData();
      }
    }

    // FUNCIONES GLOBALES
    window.handleSliderChange = function(id, val) {
      if (!isUserAdmin) return;
      const p = Math.max(0, Math.min(100, parseInt(val, 10) || 0));
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      item.progress = p;
      saveData();

      const pill = document.querySelector(`.pill-${id}`);
      if (pill) {
        const color = getColorForProgress(p);
        pill.textContent = p + "%";
        pill.style.backgroundColor = color.bg;
        pill.style.color = color.text;
        pill.style.borderColor = color.border;
      }
    };

    function addNewObjective() {
      if (!isUserAdmin) return;
      const newId = "obj-" + Date.now();
      objectives.unshift({
        id: newId,
        title: "Nueva Función",
        description: "",
        progress: 10,
        video: "",
        images: []
      });
      saveData();
      renderList();
      window.openEditor(newId);
    }

    window.deleteObjective = function(id) {
      if (!isUserAdmin) return;
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      if (confirm(`¿Eliminar "${item.title}"?`)) {
        objectives = objectives.filter(o => o.id !== id);
        if (editingId === id) editingId = null;
        saveData();
        renderList();
      }
    };

    // ============================================================
    // VISOR DE MEDIOS (SLIDE)
    // ============================================================
    window.openViewer = function(id) {
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      viewerItems = buildMediaList(item);
      if (viewerItems.length === 0) return;

      viewerIndex = 0;
      const track = document.getElementById("viewer-track");
      track.innerHTML = "";

      viewerItems.forEach(m => {
        const slide = document.createElement("div");
        slide.className = "viewer-slide";
        if (m.type === "video") {
          slide.innerHTML = `<video src="${escapeHtml(m.src)}" controls playsinline></video>`;
        } else {
          slide.innerHTML = `<img src="${escapeHtml(m.src)}" alt="" draggable="false">`;
        }
        track.appendChild(slide);
      });

      updateViewerTransform();
      updateViewerNote();
      document.getElementById("viewer-modal").classList.add("active");
    };

    function updateViewerTransform() {
      const track = document.getElementById("viewer-track");
      track.style.transform = `translateX(${-viewerIndex * 100}%)`;
    }

    function updateViewerNote() {
      const wrap = document.querySelector(".viewer-stage-wrap");
      const panel = document.getElementById("viewer-note-panel");
      const textEl = document.getElementById("viewer-note-text");
      const current = viewerItems[viewerIndex];
      if (current && current.type === "image" && current.note && current.note.trim()) {
        textEl.textContent = current.note;
        panel.classList.add("visible");
        wrap.classList.add("has-note");
      } else {
        panel.classList.remove("visible");
        wrap.classList.remove("has-note");
      }
    }

    function closeViewer() {
      const modal = document.getElementById("viewer-modal");
      modal.classList.remove("active");
      document.querySelectorAll("#viewer-track video").forEach(v => v.pause());
      document.getElementById("viewer-track").innerHTML = "";
      viewerItems = [];
      viewerIndex = 0;
    }

    function viewerGo(delta) {
      const next = viewerIndex + delta;
      if (next < 0 || next >= viewerItems.length) return;
      document.querySelectorAll("#viewer-track video").forEach(v => v.pause());
      viewerIndex = next;
      updateViewerTransform();
      updateViewerNote();
    }

    // Gestos de deslizamiento (swipe)
    function setupViewerGestures() {
      const stage = document.getElementById("viewer-stage");
      let startX = 0, startY = 0, dragging = false;

      stage.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        dragging = true;
      }, { passive: true });

      stage.addEventListener("touchend", (e) => {
        if (!dragging) return;
        dragging = false;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
          viewerGo(dx < 0 ? 1 : -1);
        }
      }, { passive: true });

      stage.addEventListener("wheel", (e) => {
        if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 30) {
          viewerGo(e.deltaX > 0 ? 1 : -1);
        }
      }, { passive: true });
    }

    // ============================================================
    // EDITOR
    // ============================================================
    window.openEditor = function(id) {
      if (!isUserAdmin) return;
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      editingId = id;
      editorItem = JSON.parse(JSON.stringify(item));
      if (!Array.isArray(editorItem.images)) editorItem.images = [];
      editorItem.images.forEach(img => {
        if (!Array.isArray(img.strokes)) img.strokes = [];
      });

      document.getElementById("ed-title").value = editorItem.title || "";
      document.getElementById("ed-desc").value = editorItem.description || "";
      document.getElementById("ed-video").value = editorItem.video || "";

      activeImageIndex = editorItem.images.length > 0 ? 0 : -1;

      renderImagesList();
      renderEditorStage();
      document.getElementById("editor-modal").classList.add("active");
    };

    function closeEditor() {
      document.getElementById("editor-modal").classList.remove("active");
      editorItem = null;
      activeImageIndex = -1;
      isDrawing = false;
      currentStroke = null;
    }

    function renderImagesList() {
      const wrap = document.getElementById("images-list");
      wrap.innerHTML = "";

      if (!editorItem || editorItem.images.length === 0) {
        wrap.innerHTML = `<div style="font-size:12px; color:#94a3b8; padding:6px 2px;">Sin imágenes todavía.</div>`;
        return;
      }

      editorItem.images.forEach((img, idx) => {
        const el = document.createElement("div");
        el.className = "image-item" + (idx === activeImageIndex ? " active" : "");
        const hasDraw = Array.isArray(img.strokes) && img.strokes.length > 0;

        el.innerHTML = `
          <div class="image-item-thumb">
            ${img.src ? `<img src="${escapeHtml(img.src)}" alt="" onerror="this.style.display='none'">` : `<span class="ph"><i class="fa-regular fa-image"></i></span>`}
          </div>
          <div class="image-item-body">
            <input type="text" class="edit-input" data-role="src" placeholder="Ruta de la imagen (ej. ./assets/img/foto.png)" value="${escapeHtml(img.src || '')}">
            <textarea class="edit-textarea" data-role="note" placeholder="Nota de esta imagen (se muestra al lado en el visor)">${escapeHtml(img.note || '')}</textarea>
            <div>
              ${hasDraw ? `<span class="note-indicator"><i class="fa-solid fa-paintbrush"></i> Con dibujo</span>` : ''}
            </div>
          </div>
          <div class="image-item-actions">
            <button class="mini-btn" data-role="up" title="Subir"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="mini-btn" data-role="down" title="Bajar"><i class="fa-solid fa-arrow-down"></i></button>
            <button class="mini-btn danger" data-role="remove" title="Quitar"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;

        el.addEventListener("click", (e) => {
          if (e.target.closest("input, textarea, button")) return;
          activeImageIndex = idx;
          renderImagesList();
          renderEditorStage();
        });

        el.querySelector('[data-role="src"]').addEventListener("input", (e) => {
          editorItem.images[idx].src = e.target.value.trim();
          if (idx === activeImageIndex) renderEditorStage();
          const thumbImg = el.querySelector(".image-item-thumb img");
          if (thumbImg) thumbImg.src = e.target.value.trim();
        });

        el.querySelector('[data-role="note"]').addEventListener("input", (e) => {
          editorItem.images[idx].note = e.target.value;
        });

        el.querySelector('[data-role="up"]').addEventListener("click", () => {
          if (idx === 0) return;
          swapImages(idx, idx - 1);
        });
        el.querySelector('[data-role="down"]').addEventListener("click", () => {
          if (idx === editorItem.images.length - 1) return;
          swapImages(idx, idx + 1);
        });
        el.querySelector('[data-role="remove"]').addEventListener("click", () => {
          editorItem.images.splice(idx, 1);
          if (activeImageIndex >= editorItem.images.length) activeImageIndex = editorItem.images.length - 1;
          renderImagesList();
          renderEditorStage();
        });

        wrap.appendChild(el);
      });
    }

    function swapImages(a, b) {
      const arr = editorItem.images;
      const tmp = arr[a]; arr[a] = arr[b]; arr[b] = tmp;
      if (activeImageIndex === a) activeImageIndex = b;
      else if (activeImageIndex === b) activeImageIndex = a;
      renderImagesList();
      renderEditorStage();
    }

    // Referencias del lienzo activo del editor (para listeners globales únicos)
    let editorCanvasEl = null;
    let editorSetupCanvasFn = null;

    function renderEditorStage() {
      const stage = document.getElementById("editor-stage");
      const toolbar = document.getElementById("draw-toolbar");
      stage.innerHTML = "";
      toolbar.innerHTML = "";

      const img = (editorItem && activeImageIndex >= 0) ? editorItem.images[activeImageIndex] : null;

      if (!img || !img.src) {
        stage.classList.remove("drawing");
        stage.innerHTML = `<div class="editor-empty">Selecciona o agrega una imagen para ver la vista previa y dibujar.</div>`;
        editorCanvasEl = null;
        editorSetupCanvasFn = null;
        return;
      }

      stage.innerHTML = `<img src="${escapeHtml(img.src)}" alt="" draggable="false"><canvas></canvas>`;
      const imgEl = stage.querySelector("img");
      const canvas = stage.querySelector("canvas");

      const setupCanvas = () => {
        const rect = imgEl.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(rect.width * dpr));
        canvas.height = Math.max(1, Math.round(rect.height * dpr));
        redrawStrokes(canvas, img.strokes);
      };

      editorCanvasEl = canvas;
      editorSetupCanvasFn = setupCanvas;

      if (imgEl.complete) setupCanvas();
      imgEl.addEventListener("load", setupCanvas);

      toolbar.appendChild(buildToolbar());

      if (drawMode) stage.classList.add("drawing");

      const getPos = (ev) => {
        const r = canvas.getBoundingClientRect();
        const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
        const cy = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
        return { x: cx / r.width, y: cy / r.height };
      };

      const start = (ev) => {
        if (!drawMode) return;
        ev.preventDefault();
        isDrawing = true;
        currentStroke = { color: drawColor, w: drawSize, pts: [getPos(ev)] };
      };
      const move = (ev) => {
        if (!isDrawing || !currentStroke) return;
        ev.preventDefault();
        currentStroke.pts.push(getPos(ev));
        redrawStrokes(canvas, img.strokes.concat([currentStroke]));
      };

      canvas.addEventListener("mousedown", start);
      canvas.addEventListener("mousemove", move);
      canvas.addEventListener("touchstart", start, { passive: false });
      canvas.addEventListener("touchmove", move, { passive: false });
    }

    // Finaliza el trazo actual (listener global único, registrado en setupEvents)
    function endStroke() {
      if (!isDrawing || !currentStroke) return;
      const img = (editorItem && activeImageIndex >= 0) ? editorItem.images[activeImageIndex] : null;
      isDrawing = false;
      if (img) {
        img.strokes.push(currentStroke);
        if (editorCanvasEl) redrawStrokes(editorCanvasEl, img.strokes);
      }
      currentStroke = null;
    }

    function buildToolbar() {
      const wrap = document.createElement("div");
      wrap.style.display = "flex";
      wrap.style.alignItems = "center";
      wrap.style.gap = "8px";
      wrap.style.flexWrap = "wrap";

      const btnMode = document.createElement("button");
      btnMode.className = "tool-btn" + (drawMode ? " active" : "");
      btnMode.title = drawMode ? "Dibujando (clic para solo navegar)" : "Solo navegar (clic para dibujar)";
      btnMode.innerHTML = `<i class="fa-solid fa-pencil"></i>`;
      btnMode.addEventListener("click", () => {
        drawMode = !drawMode;
        renderEditorStage();
      });
      wrap.appendChild(btnMode);

      const colors = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#3b82f6", "#a855f7", "#0f172a", "#ffffff"];
      colors.forEach(c => {
        const sw = document.createElement("div");
        sw.className = "swatch" + (c === drawColor ? " active" : "");
        sw.style.background = c;
        sw.title = "Color";
        sw.addEventListener("click", () => { drawColor = c; renderEditorStage(); });
        wrap.appendChild(sw);
      });

      [3, 6, 12].forEach(sz => {
        const b = document.createElement("div");
        b.className = "size-dot" + (sz === drawSize ? " active" : "");
        b.innerHTML = `<span style="width:${sz + 2}px;height:${sz + 2}px;"></span>`;
        b.title = "Grosor";
        b.addEventListener("click", () => { drawSize = sz; renderEditorStage(); });
        wrap.appendChild(b);
      });

      const undo = document.createElement("button");
      undo.className = "tool-btn";
      undo.title = "Deshacer";
      undo.innerHTML = `<i class="fa-solid fa-rotate-left"></i>`;
      undo.addEventListener("click", () => {
        const img = editorItem.images[activeImageIndex];
        if (img && img.strokes.length > 0) {
          img.strokes.pop();
          renderEditorStage();
        }
      });
      wrap.appendChild(undo);

      const clear = document.createElement("button");
      clear.className = "tool-btn";
      clear.title = "Limpiar dibujo";
      clear.innerHTML = `<i class="fa-solid fa-eraser"></i>`;
      clear.addEventListener("click", () => {
        const img = editorItem.images[activeImageIndex];
        if (img) { img.strokes = []; renderEditorStage(); }
      });
      wrap.appendChild(clear);

      return wrap;
    }

    function redrawStrokes(canvas, strokes) {
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!strokes) return;
      const dpr = window.devicePixelRatio || 1;

      strokes.forEach(s => {
        if (!s.pts || s.pts.length === 0) return;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.w * dpr;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        s.pts.forEach((p, i) => {
          const x = p.x * canvas.width;
          const y = p.y * canvas.height;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        if (s.pts.length === 1) {
          ctx.arc(s.pts[0].x * canvas.width, s.pts[0].y * canvas.height, (s.w * dpr) / 2, 0, Math.PI * 2);
          ctx.fillStyle = s.color;
          ctx.fill();
        } else {
          ctx.stroke();
        }
      });
    }

    function addImageToEditor() {
      if (!editorItem) return;
      editorItem.images.push({ src: "", note: "", strokes: [] });
      activeImageIndex = editorItem.images.length - 1;
      renderImagesList();
      renderEditorStage();
      const inputs = document.querySelectorAll('#images-list [data-role="src"]');
      if (inputs[activeImageIndex]) inputs[activeImageIndex].focus();
    }

    function saveEditor() {
      if (!isUserAdmin || !editorItem) return;
      const item = objectives.find(o => o.id === editorItem.id);
      if (!item) return;

      item.title = document.getElementById("ed-title").value.trim() || item.title;
      item.description = document.getElementById("ed-desc").value.trim();
      item.video = document.getElementById("ed-video").value.trim();

      item.images = editorItem.images
        .filter(img => (img.src || "").trim())
        .map(img => ({
          src: img.src.trim(),
          note: (img.note || "").trim(),
          strokes: img.strokes || []
        }));

      saveData();
      closeEditor();
      renderList();
    }

    function setupEvents() {
      document.getElementById("btn-toggle-admin").addEventListener("click", toggleEditMode);
      document.getElementById("btn-add-inline").addEventListener("click", addNewObjective);

      document.getElementById("viewer-modal").addEventListener("click", (e) => {
        if (e.target.id === "viewer-modal") closeViewer();
      });
      setupViewerGestures();

      document.getElementById("btn-close-editor").addEventListener("click", closeEditor);
      document.getElementById("btn-cancel-editor").addEventListener("click", closeEditor);
      document.getElementById("btn-save-editor").addEventListener("click", saveEditor);
      document.getElementById("btn-add-image").addEventListener("click", addImageToEditor);
      document.getElementById("editor-modal").addEventListener("click", (e) => {
        if (e.target.id === "editor-modal") closeEditor();
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (document.getElementById("editor-modal").classList.contains("active")) closeEditor();
          else closeViewer();
        }
        if (document.getElementById("viewer-modal").classList.contains("active")) {
          if (e.key === "ArrowRight") viewerGo(1);
          if (e.key === "ArrowLeft") viewerGo(-1);
        }
      });

      document.getElementById("ed-title").addEventListener("input", (e) => { if (editorItem) editorItem.title = e.target.value; });
      document.getElementById("ed-desc").addEventListener("input", (e) => { if (editorItem) editorItem.description = e.target.value; });
      document.getElementById("ed-video").addEventListener("input", (e) => { if (editorItem) editorItem.video = e.target.value; });

      // Listeners globales únicos para terminar el trazo y reajustar el lienzo
      window.addEventListener("mouseup", endStroke);
      window.addEventListener("touchend", endStroke);
      window.addEventListener("resize", () => {
        if (document.getElementById("editor-modal").classList.contains("active") && editorSetupCanvasFn) {
          editorSetupCanvasFn();
        }
      });

      if (sb && sb.auth && sb.auth.onAuthStateChange) {
        sb.auth.onAuthStateChange(() => { window.verifyAdminAuth(); });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
