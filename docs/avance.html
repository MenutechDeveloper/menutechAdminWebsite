    .media-remove:hover { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }

    .editor-footer {
      padding: 14px 22px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: #fff;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.97) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* RESPONSIVE */
    @media (max-width: 860px) {
      .editor-body { grid-template-columns: 1fr; }
      .editor-left { border-right: none; border-bottom: 1px solid #e2e8f0; }
      .viewer-slide { padding: 40px 24px; }
    }

    @media (max-width: 768px) {
      body { padding: 20px 14px 40px; }
      .row-main { flex-direction: column; align-items: flex-start; gap: 14px; }
      .obj-progress-col { width: 100%; justify-content: space-between; margin-left: 0; }
      .admin-slider-wrap { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="top-bar" id="top-bar">
      <button class="btn btn-primary admin-only-btn" id="btn-add-inline">
        <i class="fa-solid fa-plus"></i> Agregar Función
      </button>
      <button class="btn btn-toggle-admin" id="btn-toggle-admin" title="Activar/Desactivar controles de edición">
        <i class="fa-solid fa-lock" id="icon-admin-status"></i>
        <span id="text-admin-status">Editar</span>
      </button>
    </div>

    <div class="objectives-list" id="objectives-list"></div>

  </div>

  <!-- VISOR DE MEDIOS (SLIDE LIMPIO) -->
  <div class="viewer-overlay" id="viewer-modal">
    <div class="viewer-stage-wrap">
      <div class="viewer-stage" id="viewer-stage">
        <div class="viewer-track" id="viewer-track"></div>
      </div>
    </div>
  </div>

  <!-- EDITOR DE FUNCION -->
  <div class="editor-overlay" id="editor-modal">
    <div class="editor-modal">
      <div class="editor-header">
        <h3>Editar Función</h3>
        <button class="editor-close" id="btn-close-editor">&times;</button>
      </div>
      <div class="editor-body">
        <div class="editor-left">
          <span class="field-label">Editar la imagen seleccionada</span>
          <div class="editor-stage-wrap">
            <div class="editor-stage" id="editor-stage"></div>
            <div class="draw-toolbar" id="draw-toolbar"></div>
          </div>
        </div>
        <div class="editor-right">
          <div class="field-group">
            <label class="field-label" for="ed-title">Nombre</label>
            <input type="text" class="edit-input" id="ed-title" placeholder="Nombre de la función">
          </div>
          <div class="field-group">
            <label class="field-label" for="ed-desc">Descripción</label>
            <input type="text" class="edit-input" id="ed-desc" placeholder="Descripción">
          </div>
          <div class="field-group">
            <span class="field-label">Imagen/Video</span>
            <div class="dropzone" id="dropzone">Arrastra imágenes o videos aquí</div>
            <div class="media-list" id="media-list" style="margin-top:10px;"></div>
          </div>
        </div>
      </div>
      <div class="editor-footer">
        <button class="btn btn-ghost" id="btn-cancel-editor">Cancelar</button>
        <button class="btn btn-primary" id="btn-save-editor">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase as sb } from './supabase.js';

    // Cloudinary (solo para este archivo)
    const CLOUDINARY = {
      CLOUD_NAME: "dp776nphp",
      UPLOAD_PRESET: "vit0x7dr"
    };

    const TABLE = "avances";

    // Datos de ejemplo (solo si la tabla está vacía)
    const DEFAULT_OBJECTIVES = [
      {
        id: "obj-1",
        title: "Online payment",
        description: "Integración de pasarela de pagos con Stripe Connect para pedidos y reservas.",
        progress: 95,
        media: [{ type: "video", url: "./assets/misAvances/img/onlinepayment.mp4", notes: [], strokes: [] }]
      },
      {
        id: "obj-2",
        title: "Menu creation",
        description: "Constructor visual de categorías y platillos en tiempo real.",
        progress: 100,
        media: [{ type: "video", url: "./assets/misAvances/img/menucreation.mp4", notes: [], strokes: [] }]
      },
      {
        id: "obj-3",
        title: "Generador de menu con MenutechIA",
        description: "Lectura de fotos de menú físico e importación automática con IA.",
        progress: 85,
        media: [{ type: "video", url: "./assets/misAvances/img/menutechia.mp4", notes: [], strokes: [] }]
      },
      {
        id: "obj-4",
        title: "App Android Flutter",
        description: "Aplicación nativa para restaurantes con alertas sonoras y comanderas.",
        progress: 90,
        media: [{ type: "video", url: "./assets/misAvances/img/appflutter.mp4", notes: [], strokes: [] }]
      },
      {
        id: "obj-5",
        title: "Google play store",
        description: "Preparación de bundle AAB y publicación en Google Play Console.",
        progress: 60,
        media: [{ type: "video", url: "./assets/misAvances/img/playstore.mp4", notes: [], strokes: [] }]
      }
    ];

    // ESTADO
    let objectives = [];
    let isUserAdmin = false;
    let isEditingActive = false;
    let editingId = null;

    // Visor
    let viewerItems = [];
    let viewerIndex = 0;

    // Editor
    let editorItem = null;
    let activeMediaIndex = -1;
    let drawColor = "#ef4444";
    let drawSize = 6;
    let drawTool = "pen";        // pen | rect | arrow | text | note | pan
    let isDrawing = false;
    let currentStroke = null;
    let editorCanvasEl = null;
    let editorSetupCanvasFn = null;
    let editorZoom = 1;          // 1 | 2 | 3
    let editorPan = { x: 0, y: 0 };
    let activeNoteId = null;     // nota seleccionada en el editor

    // INICIALIZACION
    async function init() {
      await loadData();
      renderList();
      setupEvents();
      await window.verifyAdminAuth();
    }

    function newId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return "av-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    }

    // Migra el formato antiguo (una sola "note") al nuevo (varias "notes")
    function normalizeNotes(m) {
      let notes = [];
      if (Array.isArray(m.notes)) {
        notes = m.notes.map(n => ({
          id: n.id || newId(),
          text: n.text || "",
          x: typeof n.x === "number" ? n.x : 0.5,
          y: typeof n.y === "number" ? n.y : 0.5
        })).filter(n => n.text !== undefined);
      }
      if (notes.length === 0 && m.note && String(m.note).trim()) {
        notes = [{ id: newId(), text: String(m.note), x: 0.5, y: 0.5 }];
      }
      return notes;
    }

    function normalizeMedia(media) {
      if (!Array.isArray(media)) return [];
      return media.map(m => ({
        type: m.type === "video" ? "video" : "image",
        url: m.url || m.src || "",
        notes: normalizeNotes(m),
        strokes: Array.isArray(m.strokes) ? m.strokes : []
      })).filter(m => m.url);
    }

    // Normaliza una funcion (o subfuncion) con sus subfunciones
    function normalizeItem(raw) {
      return {
        id: raw.id || newId(),
        title: raw.title || "",
        description: raw.description || "",
        progress: Number(raw.progress) || 0,
        media: normalizeMedia(raw.media),
        subfunctions: Array.isArray(raw.subfunctions) ? raw.subfunctions.map(normalizeItem) : []
      };
    }

    // Busca un item (funcion o subfuncion) por id en cualquier nivel
    function findItem(id, list) {
      const arr = list || objectives;
      for (const o of arr) {
        if (o.id === id) return o;
        const found = findItem(id, o.subfunctions || []);
        if (found) return found;
      }
      return null;
    }

    // El progreso de una funcion con subfunciones es el promedio de estas
    function computeProgress(item) {
      if (Array.isArray(item.subfunctions) && item.subfunctions.length > 0) {
        const total = item.subfunctions.reduce((sum, s) => sum + computeProgress(s), 0);
        return Math.round(total / item.subfunctions.length);
      }
      return Math.max(0, Math.min(100, Number(item.progress) || 0));
    }

    async function loadData() {
      try {
        const { data, error } = await sb
          .from(TABLE)
          .select("*")
          .order("sort_order", { ascending: true })
          .order("created_at", { ascending: true });

        if (error) throw error;

        if (data && data.length > 0) {
          objectives = data.map(row => normalizeItem({
            id: row.id,
            title: row.title || "",
            description: row.description || "",
            progress: Number(row.progress) || 0,
            media: row.media,
            subfunctions: row.subfunctions
          }));
        } else {
          // Tabla vacía: se muestran los ejemplos (no se guardan)
          objectives = JSON.parse(JSON.stringify(DEFAULT_OBJECTIVES));
        }
      } catch (e) {
        console.error("Error cargando avances:", e);
        objectives = JSON.parse(JSON.stringify(DEFAULT_OBJECTIVES));
      }
    }

    // Persistencia en Supabase (solo admin)
    let saveTimer = null;
    function saveData() {
      if (!isUserAdmin) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(persistAll, 250);
    }

    async function persistAll() {
      try {
        for (let i = 0; i < objectives.length; i++) {
          const o = objectives[i];
          await sb.from(TABLE).upsert({
            id: o.id,
            title: o.title || "",
            description: o.description || "",
            progress: computeProgress(o),
            media: o.media || [],
            subfunctions: o.subfunctions || [],
            sort_order: i,
            updated_at: new Date().toISOString()
          });
        }
      } catch (e) {
        console.error("Error guardando avances:", e);
      }
    }

    async function persistOne(item) {
      if (!isUserAdmin) return;
      try {
        const index = objectives.findIndex(o => o.id === item.id);
        await sb.from(TABLE).upsert({
          id: item.id,
          title: item.title || "",
          description: item.description || "",
          progress: computeProgress(item),
          media: item.media || [],
          subfunctions: item.subfunctions || [],
          sort_order: index < 0 ? 0 : index,
          updated_at: new Date().toISOString()
        });
      } catch (e) {
        console.error("Error guardando avance:", e);
      }
    }

    // Helper: usuario de Supabase en localStorage
    function getStoredAuthUser() {
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.startsWith('sb-') || key.includes('supabase')) && (key.endsWith('-auth-token') || key.includes('auth'))) {
            const raw = localStorage.getItem(key);
            if (!raw) continue;
            const parsed = JSON.parse(raw);
            const user = parsed.user || (parsed.session ? parsed.session.user : null) || (parsed.currentSession ? parsed.currentSession.user : null);
            if (user && user.id) return user;
          }
        }
      } catch (e) {
        console.warn("Error leyendo localStorage de Supabase:", e);
      }
      return null;
    }

    window.verifyAdminAuth = async function verifyAdminAuthentication() {
      try {
        let userId = null;

        if (sb && sb.auth) {
          const { data } = await sb.auth.getSession();
          if (data && data.session && data.session.user) userId = data.session.user.id;
        }

        if (!userId) {
          const storedUser = getStoredAuthUser();
          if (storedUser && storedUser.id) userId = storedUser.id;
        }

        if (!userId) { disableAdminUI(); return; }

        const { data, error } = await sb.from('profiles').select('role').eq('id', userId);
        const profile = (data && data.length > 0) ? data[0] : null;

        if (error || !profile) { disableAdminUI(); return; }

        const role = (profile.role || '').trim().toUpperCase();
        const privilegedRoles = ['ADMIN', 'DEVELOPER', 'CS', 'ADMINCS'];

        if (privilegedRoles.includes(role)) enableAdminUI();
        else disableAdminUI();
      } catch (err) {
        console.error("Error en verificación de administrador:", err);
        disableAdminUI();
      }
    }

    function enableAdminUI() {
      isUserAdmin = true;
      document.body.classList.add("is-admin-user");
    }

    function disableAdminUI() {
      isUserAdmin = false;
      isEditingActive = false;
      editingId = null;
      document.body.classList.remove("is-admin-user");
      document.body.classList.remove("is-admin-editing");
      renderList();
    }

    function toggleEditMode() {
      if (!isUserAdmin) return;

      isEditingActive = !isEditingActive;
      const btnToggle = document.getElementById("btn-toggle-admin");
      const icon = document.getElementById("icon-admin-status");
      const text = document.getElementById("text-admin-status");

      if (isEditingActive) {
        document.body.classList.add("is-admin-editing");
        btnToggle.classList.add("active");
        icon.className = "fa-solid fa-lock-open";
        text.textContent = "Modo Edición Activo";
      } else {
        document.body.classList.remove("is-admin-editing");
        btnToggle.classList.remove("active");
        icon.className = "fa-solid fa-lock";
        text.textContent = "Editar";
        editingId = null;
      }
      renderList();
    }

    function getColorForProgress(pct) {
      const p = Math.max(0, Math.min(100, Number(pct) || 0));
      if (p >= 100) return { bg: "#dcfce7", text: "#15803d", border: "#86efac", is100: true };
      if (p >= 80)  return { bg: "#ecfccb", text: "#4d7c0f", border: "#bef264", is100: false };
      if (p >= 60)  return { bg: "#fef9c3", text: "#a16207", border: "#fde047", is100: false };
      if (p >= 35)  return { bg: "#ffedd5", text: "#c2410c", border: "#fed7aa", is100: false };
      return { bg: "#ffedd5", text: "#c2410c", border: "#fdba74", is100: false };
    }

    function escapeHtml(str) {
      if (!str) return "";
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function getPrimaryMedia(item) {
      const list = Array.isArray(item.media) ? item.media : [];
      return list.length > 0 ? list[0] : { type: "none", url: "" };
    }

    function getMediaCount(item) {
      return Array.isArray(item.media) ? item.media.length : 0;
    }

    // RENDERIZAR LISTA
    let collapsedIds = new Set();

    function buildRow(item, depth, parentId) {
      const color = getColorForProgress(computeProgress(item));
      const primary = getPrimaryMedia(item);
      const mediaCount = getMediaCount(item);
      const subs = Array.isArray(item.subfunctions) ? item.subfunctions : [];
      const hasSubs = subs.length > 0;
      const isOpen = !collapsedIds.has(item.id);

      const row = document.createElement("div");
      row.className = "objective-row" + (depth > 0 ? " is-sub" : "");
      row.dataset.id = item.id;

      let thumbInner = `<div class="thumb-play-overlay"><div class="thumb-play-btn"></div></div>`;
      if (primary.type === "video") {
        thumbInner = `<video src="${escapeHtml(primary.url)}" preload="metadata" muted></video>` +
          `<div class="thumb-play-overlay"><div class="thumb-play-btn"><i class="fa-solid fa-play"></i></div></div>`;
      } else if (primary.type === "image") {
        thumbInner = `<img src="${escapeHtml(primary.url)}" alt="">` +
          `<div class="thumb-play-overlay"><div class="thumb-play-btn"><i class="fa-solid fa-expand"></i></div></div>`;
      }

      const countBadge = mediaCount > 1 ? `<div class="thumb-count-badge">${mediaCount}</div>` : "";

      const subWord = subs.length === 1 ? "subfunción" : "subfunciones";

      const sliderHtml = hasSubs
        ? `<span class="computed-hint">Promedio de ${subs.length} ${subWord}</span>`
        : `<div class="admin-slider-wrap">
             <input type="range" class="admin-range-slider" min="0" max="100" value="${computeProgress(item)}"
               oninput="window.handleSliderChange('${escapeHtml(item.id)}', this.value)">
           </div>`;

      const toggleHtml = hasSubs
        ? `<button class="sub-toggle-btn visible ${isOpen ? 'open' : ''}" data-role="toggle-sub" data-id="${escapeHtml(item.id)}">
             <i class="fa-solid fa-chevron-right chev"></i> ${subs.length} ${subWord}
           </button>`
        : ``;

      const addSubHtml = depth === 0
        ? `<button class="btn-add-sub" data-role="add-sub" data-id="${escapeHtml(item.id)}">
             <i class="fa-solid fa-plus"></i> Subfunción
           </button>`
        : ``;

      row.innerHTML = `
        <div class="row-main">
          <div class="drag-handle" title="Arrastra para reordenar"><i class="fa-solid fa-grip-vertical"></i></div>

          <div class="media-thumb-box ${color.is100 ? 'is-100' : ''}" onclick="window.openViewer('${escapeHtml(item.id)}')" title="Ver contenido">
            ${thumbInner}
            ${countBadge}
          </div>

          <div class="obj-info-col">
            <span class="obj-title">${escapeHtml(item.title)}</span>
            ${item.description ? `<p class="obj-desc">${escapeHtml(item.description)}</p>` : ''}
            ${toggleHtml}
          </div>

          <div class="obj-progress-col">
            ${sliderHtml}

            <span class="progress-pill pill-${escapeHtml(item.id)}" style="background-color: ${color.bg}; color: ${color.text}; border-color: ${color.border};">
              ${computeProgress(item)}%
            </span>

            <div class="admin-actions">
              <button class="btn-action-icon" title="Editar" onclick="window.openEditor('${escapeHtml(item.id)}')">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button class="btn-action-icon btn-delete" title="Eliminar" onclick="window.deleteObjective('${escapeHtml(item.id)}')">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      `;

      // Contenedor de subfunciones (recursivo)
      const subWrap = document.createElement("div");
      subWrap.className = "subfunctions-wrap" + (isOpen ? " open" : "");
      subWrap.dataset.parentId = item.id;
      subs.forEach(sub => subWrap.appendChild(buildRow(sub, depth + 1, item.id)));

      // Boton para agregar subfuncion (solo en funciones de primer nivel)
      if (addSubHtml) {
        const bar = document.createElement("div");
        bar.style.marginTop = "12px";
        bar.innerHTML = addSubHtml;
        row.appendChild(subWrap);
        row.appendChild(bar);
      } else {
        row.appendChild(subWrap);
      }

      return row;
    }

    function renderList() {
      const listContainer = document.getElementById("objectives-list");
      listContainer.innerHTML = "";

      if (objectives.length === 0) {
        listContainer.innerHTML = `
          <div style="background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:36px; text-align:center; color:#64748b;">
            No hay funciones registradas.
          </div>
        `;
        return;
      }

      objectives.forEach(item => {
        listContainer.appendChild(buildRow(item, 0, null));
      });

      attachDragHandlers();
    }

    // ARRASTRAR Y SOLTAR PARA REORDENAR (por contenedor: nivel superior o subfunciones)
    function getContainerArray(container) {
      const pid = container.dataset.parentId;
      if (!pid) return objectives;
      const parent = findItem(pid);
      return parent ? parent.subfunctions : null;
    }

    function attachDragHandlers() {
      document.querySelectorAll(".objective-row").forEach(row => {
        const handle = row.querySelector(":scope > .row-main > .drag-handle");
        if (!handle) return;

        handle.setAttribute("draggable", "true");

        handle.addEventListener("dragstart", (e) => {
          if (!isUserAdmin || !isEditingActive) { e.preventDefault(); return; }
          row.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          try { e.dataTransfer.setData("text/plain", row.dataset.id); } catch (err) {}
        });

        handle.addEventListener("dragend", () => {
          row.classList.remove("dragging");
          document.querySelectorAll(".objective-row").forEach(r => r.classList.remove("drop-target"));
          commitDragOrder(row.parentElement);
        });

        row.addEventListener("dragover", (e) => {
          if (!isUserAdmin || !isEditingActive) return;
          if (e.target.closest(".objective-row") !== row) return;
          const dragging = document.querySelector(".objective-row.dragging");
          if (!dragging || dragging === row) return;
          // Solo se reordena dentro del mismo contenedor
          if (dragging.parentElement !== row.parentElement) return;
          e.preventDefault();

          const container = row.parentElement;
          const rect = row.getBoundingClientRect();
          const after = (e.clientY - rect.top) > rect.height / 2;

          document.querySelectorAll(".objective-row").forEach(r => r.classList.remove("drop-target"));
          row.classList.add("drop-target");

          if (after) container.insertBefore(dragging, row.nextSibling);
          else container.insertBefore(dragging, row);
        });

        row.addEventListener("drop", (e) => {
          if (!isUserAdmin || !isEditingActive) return;
          if (e.target.closest(".objective-row") !== row) return;
          e.preventDefault();
          document.querySelectorAll(".objective-row").forEach(r => r.classList.remove("drop-target"));
          commitDragOrder(row.parentElement);
        });
      });
    }

    function commitDragOrder(container) {
      if (!isUserAdmin || !isEditingActive || !container) return;
      const arr = getContainerArray(container);
      if (!arr) return;

      const ids = Array.from(container.querySelectorAll(":scope > .objective-row")).map(r => r.dataset.id);
      const reordered = ids.map(id => arr.find(o => o.id === id)).filter(Boolean);
      if (reordered.length === arr.length) {
        arr.splice(0, arr.length, ...reordered);
        saveData();
      }
    }

    // Alternar subfunciones
    window.toggleSubfunctions = function(id, btn) {
      const wrap = document.querySelector(`.subfunctions-wrap[data-parent-id="${CSS.escape(id)}"]`);
      if (!wrap) return;
      const open = wrap.classList.toggle("open");
      if (btn) btn.classList.toggle("open", open);
      if (open) collapsedIds.delete(id); else collapsedIds.add(id);
    };

    window.handleSliderChange = function(id, val) {
      if (!isUserAdmin) return;
      const item = findItem(id);
      if (!item) return;
      if (Array.isArray(item.subfunctions) && item.subfunctions.length > 0) return; // progreso calculado

      const p = Math.max(0, Math.min(100, parseInt(val, 10) || 0));
      item.progress = p;

      // Actualiza los porcentajes (incluye el promedio de la funcion padre)
      refreshProgressPills();

      // Se persiste la fila de primer nivel que contiene este item
      const root = findTopLevel(id);
      if (root) persistOne(root);
    };

    function findTopLevel(id) {
      for (const o of objectives) {
        if (o.id === id) return o;
        if (containsId(o.subfunctions || [], id)) return o;
      }
      return null;
    }

    function containsId(list, id) {
      for (const o of list) {
        if (o.id === id) return true;
        if (containsId(o.subfunctions || [], id)) return true;
      }
      return false;
    }

    function refreshProgressPills() {
      const walk = (list) => {
        list.forEach(o => {
          const pill = document.querySelector(`.pill-${CSS.escape(o.id)}`);
          if (pill) {
            const p = computeProgress(o);
            const color = getColorForProgress(p);
            pill.textContent = p + "%";
            pill.style.backgroundColor = color.bg;
            pill.style.color = color.text;
            pill.style.borderColor = color.border;
          }
          if (o.subfunctions && o.subfunctions.length) walk(o.subfunctions);
        });
      };
      walk(objectives);
    }

    function addNewObjective() {
      if (!isUserAdmin) return;
      const item = {
        id: newId(),
        title: "Nueva Función",
        description: "",
        progress: 10,
        media: [],
        subfunctions: []
      };
      objectives.unshift(item);
      renderList();
      saveData();
      window.openEditor(item.id);
    }

    window.addSubfunction = function(parentId) {
      if (!isUserAdmin) return;
      const parent = findItem(parentId);
      if (!parent) return;
      if (!Array.isArray(parent.subfunctions)) parent.subfunctions = [];

      const sub = {
        id: newId(),
        title: "Nueva Subfunción",
        description: "",
        progress: 10,
        media: [],
        subfunctions: []
      };
      parent.subfunctions.push(sub);
      collapsedIds.delete(parentId);
      renderList();
      saveData();
      window.openEditor(sub.id);
    };

    window.deleteObjective = async function(id) {
      if (!isUserAdmin) return;
      const item = findItem(id);
      if (!item) return;

      if (confirm(`¿Eliminar "${item.title}"?`)) {
        removeItemById(id);
        if (editingId === id) editingId = null;
        renderList();
        await persistAll();
      }
    };

    function removeItemById(id) {
      // Nivel superior
      const topIdx = objectives.findIndex(o => o.id === id);
      if (topIdx >= 0) {
        objectives.splice(topIdx, 1);
        return true;
      }
      // Buscar en subfunciones (recursivo)
      for (const o of objectives) {
        if (removeFromArray(o.subfunctions || [], id)) return true;
      }
      return false;
    }

    function removeFromArray(arr, id) {
      const idx = arr.findIndex(o => o.id === id);
      if (idx >= 0) { arr.splice(idx, 1); return true; }
      for (const o of arr) {
        if (removeFromArray(o.subfunctions || [], id)) return true;
      }
      return false;
    }


    // ============================================================
    // VISOR DE MEDIOS (SLIDE)
    // ============================================================
    window.openViewer = function(id) {
      const item = findItem(id);
      if (!item) return;

      viewerItems = Array.isArray(item.media) ? item.media : [];
      if (viewerItems.length === 0) return;

      viewerIndex = 0;
      const track = document.getElementById("viewer-track");
      track.innerHTML = "";

      viewerItems.forEach(m => {
        const slide = document.createElement("div");
        slide.className = "viewer-slide";

        const wrap = document.createElement("div");
        wrap.className = "viewer-media";
        wrap.dataset.mediaIndex = viewerItems.indexOf(m);

        if (m.type === "video") {
          const v = document.createElement("video");
          v.src = m.url;
          v.controls = true;
          v.playsInline = true;
          wrap.appendChild(v);
        } else {
          const img = document.createElement("img");
          img.src = m.url;
          img.alt = "";
          img.draggable = false;
          wrap.appendChild(img);

          if (Array.isArray(m.strokes) && m.strokes.length > 0) {
            const canvas = document.createElement("canvas");
            wrap.appendChild(canvas);
            attachViewerStrokes(img, canvas, m.strokes);
          }

          // Notas flotantes posicionadas sobre la imagen
          const notes = Array.isArray(m.notes) ? m.notes : [];
          if (notes.length > 0) {
            const layer = document.createElement("div");
            layer.className = "viewer-notes-layer";
            wrap.appendChild(layer);
            positionViewerNotes(img, layer, notes);
          }
        }

        slide.appendChild(wrap);
        track.appendChild(slide);
      });

      updateViewerTransform();
      document.getElementById("viewer-modal").classList.add("active");
    };

    // Coloca las notas segun su posicion relativa (0..1) dentro de la imagen
    function positionViewerNotes(img, layer, notes) {
      const place = () => {
        const w = img.clientWidth, h = img.clientHeight;
        if (!w || !h) return;
        layer.style.width = w + "px";
        layer.style.height = h + "px";
        layer.style.left = "0";
        layer.style.top = "0";
        notes.forEach((n, i) => {
          let box = layer.querySelector(`[data-note="${i}"]`);
          if (!box) {
            box = document.createElement("div");
            box.className = "viewer-note-box";
            box.dataset.note = i;
            box.textContent = n.text || "";
            layer.appendChild(box);
          }
          box.style.left = (n.x * w) + "px";
          box.style.top = (n.y * h) + "px";
        });
      };
      if (img.complete) place();
      img.addEventListener("load", place);
    }

    function attachViewerStrokes(img, canvas, strokes) {
      const draw = () => {
        const rect = img.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        drawStrokesOn(canvas, strokes);
      };
      if (img.complete) draw();
      else img.addEventListener("load", draw);
    }

    // Dibuja un trazo/formas sobre el canvas (coordenadas normalizadas 0..1)
    function drawStrokesOn(canvas, strokes) {
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!strokes) return;
      strokes.forEach(s => drawStroke(ctx, canvas, s));
    }

    function drawStroke(ctx, canvas, s) {
      const W = canvas.width, H = canvas.height;
      const color = s.color || "#ef4444";
      const tool = s.tool || "pen";
      const pts = s.pts || [];
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = (s.w || 0.006) * W;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (tool === "rect" && pts.length >= 2) {
        const x1 = pts[0].x * W, y1 = pts[0].y * H;
        const x2 = pts[pts.length - 1].x * W, y2 = pts[pts.length - 1].y * H;
        ctx.strokeRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
        return;
      }

      if (tool === "arrow" && pts.length >= 2) {
        const x1 = pts[0].x * W, y1 = pts[0].y * H;
        const x2 = pts[pts.length - 1].x * W, y2 = pts[pts.length - 1].y * H;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        const angle = Math.atan2(y2 - y1, x2 - x1);
        const head = Math.max(ctx.lineWidth * 3, 10);
        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - head * Math.cos(angle - Math.PI / 7), y2 - head * Math.sin(angle - Math.PI / 7));
        ctx.lineTo(x2 - head * Math.cos(angle + Math.PI / 7), y2 - head * Math.sin(angle + Math.PI / 7));
        ctx.closePath();
        ctx.fill();
        return;
      }

      if (tool === "text" && pts.length >= 1) {
        const size = (s.size || 12) * (W / 1000);   // 12px a 1000px de ancho
        ctx.font = `${size}px Arial, Helvetica, sans-serif`;
        ctx.textBaseline = "top";
        const lines = String(s.text || "").split("\n");
        lines.forEach((line, i) => {
          ctx.fillText(line, pts[0].x * W, pts[0].y * H + i * size * 1.25);
        });
        return;
      }

      // Trazo libre (pen)
      if (pts.length === 0) return;
      ctx.beginPath();
      pts.forEach((p, i) => {
        const x = p.x * W, y = p.y * H;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      if (pts.length === 1) {
        ctx.arc(pts[0].x * W, pts[0].y * H, ((s.w || 0.006) * W) / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.stroke();
      }
    }

    function updateViewerTransform() {
      const track = document.getElementById("viewer-track");
      track.style.transform = `translateX(${-viewerIndex * 100}%)`;
    }

    function closeViewer() {
      const modal = document.getElementById("viewer-modal");
      modal.classList.remove("active");
      document.querySelectorAll("#viewer-track video").forEach(v => v.pause());
      document.getElementById("viewer-track").innerHTML = "";
      viewerItems = [];
      viewerIndex = 0;
    }

    function viewerGo(delta) {
      const next = viewerIndex + delta;
      if (next < 0 || next >= viewerItems.length) return;
      document.querySelectorAll("#viewer-track video").forEach(v => v.pause());
      viewerIndex = next;
      updateViewerTransform();
    }

    function setupViewerGestures() {
      const stage = document.getElementById("viewer-stage");
      let startX = 0, startY = 0, dragging = false;

      stage.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        dragging = true;
      }, { passive: true });

      stage.addEventListener("touchend", (e) => {
        if (!dragging) return;
        dragging = false;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) viewerGo(dx < 0 ? 1 : -1);
      }, { passive: true });

      stage.addEventListener("wheel", (e) => {
        if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 30) {
          viewerGo(e.deltaX > 0 ? 1 : -1);
        }
      }, { passive: true });
    }

    // ============================================================
    // EDITOR
    // ============================================================
    window.openEditor = function(id) {
      if (!isUserAdmin) return;
      const item = findItem(id);
      if (!item) return;

      editingId = id;
      editorItem = JSON.parse(JSON.stringify(item));
      if (!Array.isArray(editorItem.media)) editorItem.media = [];
      editorItem.media.forEach(m => {
        if (!Array.isArray(m.strokes)) m.strokes = [];
        if (!Array.isArray(m.notes)) m.notes = [];
      });
      if (!Array.isArray(editorItem.subfunctions)) editorItem.subfunctions = [];

      document.getElementById("ed-title").value = editorItem.title || "";
      document.getElementById("ed-desc").value = editorItem.description || "";

      // Selecciona la primera imagen para dibujar
      activeMediaIndex = editorItem.media.findIndex(m => m.type === "image");
      if (activeMediaIndex < 0 && editorItem.media.length > 0) activeMediaIndex = 0;

      editorZoom = 1;
      editorPan = { x: 0, y: 0 };
      drawTool = "pen";
      activeNoteId = null;

      renderMediaList();
      renderEditorStage();
      document.getElementById("editor-modal").classList.add("active");
    };

    function isSubfunctionId(id) {
      for (const o of objectives) {
        if ((o.subfunctions || []).some(s => s.id === id)) return true;
      }
      return false;
    }

    function closeEditor() {
      document.getElementById("editor-modal").classList.remove("active");
      editorItem = null;
      activeMediaIndex = -1;
      isDrawing = false;
      currentStroke = null;
      activeNoteId = null;
      editorZoom = 1;
      editorPan = { x: 0, y: 0 };
    }

    function renderMediaList() {
      const wrap = document.getElementById("media-list");
      wrap.innerHTML = "";

      if (!editorItem || editorItem.media.length === 0) return;

      editorItem.media.forEach((m, idx) => {
        const el = document.createElement("div");
        el.className = "media-item" + (idx === activeMediaIndex ? " active" : "");

        const thumbHtml = m.type === "video"
          ? `<video src="${escapeHtml(m.url)}" muted preload="metadata"></video>`
          : `<img src="${escapeHtml(m.url)}" alt="" onerror="this.style.display='none'">`;

        let infoHtml = "";
        if (m.type === "image") {
          const nCount = Array.isArray(m.notes) ? m.notes.length : 0;
          const sCount = Array.isArray(m.strokes) ? m.strokes.length : 0;
          const parts = [];
          if (nCount > 0) parts.push(`${nCount} nota${nCount === 1 ? '' : 's'}`);
          if (sCount > 0) parts.push(`${sCount} trazo${sCount === 1 ? '' : 's'}`);
          infoHtml = `<span style="font-size:12px;color:#94a3b8;">${parts.length ? parts.join(' · ') : 'Sin anotaciones'}</span>`;
        } else {
          infoHtml = `<span style="font-size:12px;color:#94a3b8;">Video</span>`;
        }

        el.innerHTML = `
          <div class="media-item-thumb">${thumbHtml}</div>
          <div class="media-item-body">
            ${infoHtml}
          </div>
          <button class="media-remove" data-role="remove" title="Quitar">&times;</button>
        `;

        el.querySelector(".media-item-thumb").addEventListener("click", () => {
          activeMediaIndex = idx;
          activeNoteId = null;
          editorZoom = 1;
          editorPan = { x: 0, y: 0 };
          renderMediaList();
          renderEditorStage();
        });

        el.querySelector('[data-role="remove"]').addEventListener("click", () => {
          editorItem.media.splice(idx, 1);
          if (activeMediaIndex >= editorItem.media.length) activeMediaIndex = editorItem.media.length - 1;
          renderMediaList();
          renderEditorStage();
        });

        wrap.appendChild(el);
      });
    }

    function renderEditorStage() {
      const stage = document.getElementById("editor-stage");
      const toolbar = document.getElementById("draw-toolbar");
      stage.innerHTML = "";
      toolbar.innerHTML = "";
      stage.className = "editor-stage";

      const m = (editorItem && activeMediaIndex >= 0) ? editorItem.media[activeMediaIndex] : null;

      if (!m) {
        stage.innerHTML = `<div class="editor-empty">Agrega una imagen o video</div>`;
        editorCanvasEl = null;
        editorSetupCanvasFn = null;
        return;
      }

      if (m.type === "video") {
        stage.innerHTML = `<video src="${escapeHtml(m.url)}" controls playsinline></video>`;
        editorCanvasEl = null;
        editorSetupCanvasFn = null;
        return;
      }

      if (!Array.isArray(m.notes)) m.notes = [];
      if (!Array.isArray(m.strokes)) m.strokes = [];

      // Capa con zoom/pan que contiene imagen + canvas + notas
      const zoomLayer = document.createElement("div");
      zoomLayer.className = "editor-zoom-layer";
      zoomLayer.innerHTML = `<img src="${escapeHtml(m.url)}" alt="" draggable="false"><canvas></canvas>`;
      stage.appendChild(zoomLayer);

      const imgEl = zoomLayer.querySelector("img");
      const canvas = zoomLayer.querySelector("canvas");
      const notesLayer = document.createElement("div");
      notesLayer.className = "editor-notes-layer";
      zoomLayer.appendChild(notesLayer);

      const applyZoom = () => {
        zoomLayer.style.transform = `translate(${editorPan.x}px, ${editorPan.y}px) scale(${editorZoom})`;
      };
      applyZoom();

      const setupCanvas = () => {
        const rect = imgEl.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(rect.width * dpr));
        canvas.height = Math.max(1, Math.round(rect.height * dpr));
        drawStrokesOn(canvas, m.strokes);
        notesLayer.style.width = imgEl.clientWidth + "px";
        notesLayer.style.height = imgEl.clientHeight + "px";
        notesLayer.style.left = "0";
        notesLayer.style.top = "0";
        renderEditorNotes(notesLayer, imgEl, m);
      };

      editorCanvasEl = canvas;
      editorSetupCanvasFn = setupCanvas;

      if (imgEl.complete) setupCanvas();
      imgEl.addEventListener("load", setupCanvas);

      toolbar.appendChild(buildToolbar());

      // Clases de modo
      if (drawTool === "pen" || drawTool === "rect" || drawTool === "arrow" || drawTool === "text") {
        stage.classList.add("drawing");
      }
      stage.classList.add("tool-" + drawTool);

      const getPos = (ev) => {
        const r = canvas.getBoundingClientRect();
        const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
        const cy = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
        return { x: cx / r.width, y: cy / r.height };
      };

      const isShapeTool = () => drawTool === "pen" || drawTool === "rect" || drawTool === "arrow";

      const start = (ev) => {
        if (!isShapeTool()) return;
        ev.preventDefault();
        isDrawing = true;
        const r = canvas.getBoundingClientRect();
        const stroke = { tool: drawTool, color: drawColor, w: drawSize / Math.max(1, r.width), pts: [getPos(ev)] };
        if (drawTool === "rect" || drawTool === "arrow") stroke.pts.push(getPos(ev));
        currentStroke = stroke;
      };
      const move = (ev) => {
        if (!isDrawing || !currentStroke) return;
        ev.preventDefault();
        const p = getPos(ev);
        if (drawTool === "pen") currentStroke.pts.push(p);
        else currentStroke.pts[1] = p;
        drawStrokesOn(canvas, m.strokes.concat([currentStroke]));
      };

      canvas.addEventListener("mousedown", start);
      canvas.addEventListener("mousemove", move);
      canvas.addEventListener("touchstart", start, { passive: false });
      canvas.addEventListener("touchmove", move, { passive: false });

      // Colocar texto (Arial 12) con un clic: entrada flotante directa
      canvas.addEventListener("click", (ev) => {
        if (drawTool !== "text") return;
        openTextInput(zoomLayer, canvas, imgEl, m, getPos(ev));
      });

      // Herramienta de nota: clic para crear una nota en esa posicion
      canvas.addEventListener("click", (ev) => {
        if (drawTool !== "note") return;
        const p = getPos(ev);
        addNoteAt(p);
      });

      // Herramienta de mano (pan)
      let panning = false, panStart = null;
      stage.addEventListener("mousedown", (ev) => {
        if (drawTool !== "pan") return;
        ev.preventDefault();
        panning = true;
        panStart = { x: ev.clientX - editorPan.x, y: ev.clientY - editorPan.y };
      });
      stage.addEventListener("mousemove", (ev) => {
        if (!panning) return;
        editorPan = { x: ev.clientX - panStart.x, y: ev.clientY - panStart.y };
        applyZoom();
      });
      stage.addEventListener("touchstart", (ev) => {
        if (drawTool !== "pan" || ev.touches.length !== 1) return;
        panning = true;
        panStart = { x: ev.touches[0].clientX - editorPan.x, y: ev.touches[0].clientY - editorPan.y };
      }, { passive: true });
      stage.addEventListener("touchmove", (ev) => {
        if (!panning || ev.touches.length !== 1) return;
        editorPan = { x: ev.touches[0].clientX - panStart.x, y: ev.touches[0].clientY - panStart.y };
        applyZoom();
      }, { passive: true });
      const stopPan = () => { panning = false; };
      window.addEventListener("mouseup", stopPan);
      window.addEventListener("touchend", stopPan);
    }

    // Entrada flotante para la herramienta Texto (Arial 12), sin prompt
    function openTextInput(container, canvas, imgEl, m, p) {
      const existing = container.querySelector(".editor-text-input");
      if (existing) existing.remove();

      const inp = document.createElement("input");
      inp.type = "text";
      inp.className = "editor-text-input";
      inp.placeholder = "Escribe y pulsa Enter";
      inp.style.left = (p.x * 100) + "%";
      inp.style.top = (p.y * 100) + "%";
      container.appendChild(inp);
      inp.focus();

      let done = false;
      const commit = () => {
        if (done) return;
        done = true;
        const text = inp.value;
        inp.remove();
        if (text && text.trim() !== "") {
          m.strokes.push({ tool: "text", color: drawColor, size: 12, text: text, pts: [{ x: p.x, y: p.y }] });
          drawStrokesOn(canvas, m.strokes);
          renderMediaList();
        }
      };
      inp.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "Enter") { e.preventDefault(); commit(); }
        else if (e.key === "Escape") { done = true; inp.remove(); }
      });
      inp.addEventListener("blur", commit);
      inp.addEventListener("mousedown", (e) => e.stopPropagation());
      inp.addEventListener("click", (e) => e.stopPropagation());
    }

    // Renderiza las notas (cuadros movibles) sobre la imagen del editor
    function renderEditorNotes(layer, imgEl, m) {
      layer.innerHTML = "";
      m.notes.forEach((n) => {
        const box = document.createElement("div");
        box.className = "editor-note" + (n.id === activeNoteId ? " active" : "");
        box.dataset.id = n.id;
        box.style.left = (n.x * 100) + "%";
        box.style.top = (n.y * 100) + "%";
        box.innerHTML =
          `<div class="note-bar">` +
            `<span class="note-grip" title="Arrastrar">⠿</span>` +
            `<button class="note-del" title="Eliminar nota">&times;</button>` +
          `</div>` +
          `<div class="note-input" contenteditable="true" data-ph="Escribe la nota…"></div>`;

        // Texto editable directamente (sin ventanas emergentes)
        const input = box.querySelector(".note-input");
        input.textContent = n.text || "";
        input.addEventListener("input", () => { n.text = input.textContent; });
        // Evita que escribir arrastre la nota o dispare dibujo
        input.addEventListener("mousedown", (e) => e.stopPropagation());
        input.addEventListener("touchstart", (e) => e.stopPropagation(), { passive: true });

        box.querySelector(".note-del").addEventListener("click", (e) => {
          e.stopPropagation();
          m.notes = m.notes.filter(x => x.id !== n.id);
          if (activeNoteId === n.id) activeNoteId = null;
          renderEditorNotes(layer, imgEl, m);
          renderMediaList();
        });

        // Arrastrar la nota desde su barra
        const bar = box.querySelector(".note-bar");
        bar.addEventListener("mousedown", (e) => startNoteDrag(e, box, n, imgEl, layer, m));
        bar.addEventListener("touchstart", (e) => startNoteDrag(e, box, n, imgEl, layer, m), { passive: false });

        layer.appendChild(box);
      });
    }

    // Enfoca el input de la nota recien creada
    function focusNoteInput() {
      const input = document.querySelector(".editor-note.active .note-input");
      if (!input) return;
      input.focus();
      const range = document.createRange();
      range.selectNodeContents(input);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function startNoteDrag(ev, box, note, imgEl, layer, m) {
      if (ev.target.classList.contains("note-del")) return;
      ev.stopPropagation();
      ev.preventDefault();
      activeNoteId = note.id;
      layer.querySelectorAll(".editor-note").forEach(b => b.classList.toggle("active", b.dataset.id === note.id));

      const rect = imgEl.getBoundingClientRect();
      const move = (e) => {
        const cx = (e.touches ? e.touches[0].clientX : e.clientX);
        const cy = (e.touches ? e.touches[0].clientY : e.clientY);
        let nx = (cx - rect.left) / rect.width;
        let ny = (cy - rect.top) / rect.height;
        note.x = Math.max(0, Math.min(1, nx));
        note.y = Math.max(0, Math.min(1, ny));
        box.style.left = (note.x * 100) + "%";
        box.style.top = (note.y * 100) + "%";
      };
      const up = () => {
        window.removeEventListener("mousemove", move);
        window.removeEventListener("touchmove", move);
        window.removeEventListener("mouseup", up);
        window.removeEventListener("touchend", up);
      };
      window.addEventListener("mousemove", move);
      window.addEventListener("touchmove", move, { passive: false });
      window.addEventListener("mouseup", up);
      window.addEventListener("touchend", up);
    }

    function addNoteAt(p) {
      const m = (editorItem && activeMediaIndex >= 0) ? editorItem.media[activeMediaIndex] : null;
      if (!m || m.type !== "image") return;
      if (!Array.isArray(m.notes)) m.notes = [];
      const note = { id: newId(), text: "", x: p.x, y: p.y };
      m.notes.push(note);
      activeNoteId = note.id;
      renderEditorStage();
      renderMediaList();
      // Deja el cursor listo para escribir de inmediato
      requestAnimationFrame(focusNoteInput);
    }

    function endStroke() {
      if (!isDrawing || !currentStroke) return;
      const m = (editorItem && activeMediaIndex >= 0) ? editorItem.media[activeMediaIndex] : null;
      isDrawing = false;
      if (m && m.type === "image") {
        m.strokes.push(currentStroke);
        if (editorCanvasEl) drawStrokesOn(editorCanvasEl, m.strokes);
        renderMediaList();
      }
      currentStroke = null;
    }

    function buildToolbar() {
      const wrap = document.createElement("div");
      wrap.style.display = "flex";
      wrap.style.alignItems = "center";
      wrap.style.gap = "8px";
      wrap.style.flexWrap = "wrap";

      const tools = [
        { id: "pen", icon: "fa-pencil", title: "Lápiz" },
        { id: "rect", icon: "fa-vector-square", title: "Rectángulo" },
        { id: "arrow", icon: "fa-arrow-right", title: "Flecha" },
        { id: "text", icon: "fa-font", title: "Texto (Arial 12)" },
        { id: "note", icon: "fa-note-sticky", title: "Nota" },
        { id: "pan", icon: "fa-hand", title: "Mover" }
      ];
      tools.forEach(t => {
        const b = document.createElement("button");
        b.className = "tool-btn" + (drawTool === t.id ? " active" : "");
        b.title = t.title;
        b.innerHTML = `<i class="fa-solid ${t.icon}"></i>`;
        b.addEventListener("click", () => { drawTool = t.id; renderEditorStage(); });
        wrap.appendChild(b);
      });

      const sep = document.createElement("span");
      sep.style.cssText = "width:1px;height:22px;background:#cbd5e1;margin:0 2px;";
      wrap.appendChild(sep);

      const colors = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#3b82f6", "#a855f7", "#0f172a", "#ffffff"];
      colors.forEach(c => {
        const sw = document.createElement("div");
        sw.className = "swatch" + (c === drawColor ? " active" : "");
        sw.style.background = c;
        sw.title = "Color";
        sw.addEventListener("click", () => { drawColor = c; renderEditorStage(); });
        wrap.appendChild(sw);
      });

      [3, 6, 12].forEach(sz => {
        const b = document.createElement("div");
        b.className = "size-dot" + (sz === drawSize ? " active" : "");
        b.innerHTML = `<span style="width:${sz + 2}px;height:${sz + 2}px;"></span>`;
        b.title = "Grosor";
        b.addEventListener("click", () => { drawSize = sz; renderEditorStage(); });
        wrap.appendChild(b);
      });

      const sep2 = document.createElement("span");
      sep2.style.cssText = "width:1px;height:22px;background:#cbd5e1;margin:0 2px;";
      wrap.appendChild(sep2);

      // Zoom
      const btnOut = document.createElement("button");
      btnOut.className = "tool-btn";
      btnOut.title = "Alejar";
      btnOut.innerHTML = `<i class="fa-solid fa-magnifying-glass-minus"></i>`;
      btnOut.addEventListener("click", () => { editorZoom = Math.max(1, editorZoom - 0.5); renderEditorStage(); });
      wrap.appendChild(btnOut);

      const zoomLabel = document.createElement("span");
      zoomLabel.style.cssText = "font-size:12px;font-weight:700;color:#475569;min-width:34px;text-align:center;";
      zoomLabel.textContent = Math.round(editorZoom * 100) + "%";
      wrap.appendChild(zoomLabel);

      const btnIn = document.createElement("button");
      btnIn.className = "tool-btn";
      btnIn.title = "Acercar";
      btnIn.innerHTML = `<i class="fa-solid fa-magnifying-glass-plus"></i>`;
      btnIn.addEventListener("click", () => { editorZoom = Math.min(4, editorZoom + 0.5); renderEditorStage(); });
      wrap.appendChild(btnIn);

      const sep3 = document.createElement("span");
      sep3.style.cssText = "width:1px;height:22px;background:#cbd5e1;margin:0 2px;";
      wrap.appendChild(sep3);

      const undo = document.createElement("button");
      undo.className = "tool-btn";
      undo.title = "Deshacer";
      undo.innerHTML = `<i class="fa-solid fa-rotate-left"></i>`;
      undo.addEventListener("click", () => {
        const m = editorItem.media[activeMediaIndex];
        if (m && m.strokes.length > 0) { m.strokes.pop(); renderEditorStage(); renderMediaList(); }
      });
      wrap.appendChild(undo);

      const clear = document.createElement("button");
      clear.className = "tool-btn";
      clear.title = "Limpiar dibujos";
      clear.innerHTML = `<i class="fa-solid fa-eraser"></i>`;
      clear.addEventListener("click", () => {
        const m = editorItem.media[activeMediaIndex];
        if (m) { m.strokes = []; renderEditorStage(); renderMediaList(); }
      });
      wrap.appendChild(clear);

      return wrap;
    }

    // ============================================================
    // SUBIDA A CLOUDINARY (drag & drop)
    // ============================================================
    async function uploadToCloudinary(file) {
      const isVideo = file.type.startsWith("video/");
      const endpoint = isVideo ? "video/upload" : "image/upload";
      const fd = new FormData();
      fd.append("file", file);
      fd.append("upload_preset", CLOUDINARY.UPLOAD_PRESET);

      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.CLOUD_NAME}/${endpoint}`, {
        method: "POST",
        body: fd
      });
      if (!res.ok) throw new Error("No se pudo subir el archivo");
      const data = await res.json();
      return { type: isVideo ? "video" : "image", url: data.secure_url, notes: [], strokes: [] };
    }

    async function handleFiles(fileList) {
      if (!editorItem) return;
      const files = Array.from(fileList || []).filter(f => f.type.startsWith("image/") || f.type.startsWith("video/"));
      if (files.length === 0) return;

      const dz = document.getElementById("dropzone");
      dz.classList.add("uploading");
      dz.textContent = "Subiendo...";

      try {
        for (const file of files) {
          const media = await uploadToCloudinary(file);
          editorItem.media.push(media);
        }
        // Selecciona la última imagen agregada para dibujar
        const lastImg = editorItem.media.map(m => m.type).lastIndexOf("image");
        if (lastImg >= 0) activeMediaIndex = lastImg;
        else activeMediaIndex = editorItem.media.length - 1;
      } catch (e) {
        console.error(e);
        alert("Error al subir el archivo. Intenta de nuevo.");
      } finally {
        dz.classList.remove("uploading");
        dz.textContent = "Arrastra imágenes o videos aquí";
        renderMediaList();
        renderEditorStage();
      }
    }

    async function saveEditor() {
      if (!isUserAdmin || !editorItem) return;
      const item = findItem(editorItem.id);
      if (!item) return;

      item.title = document.getElementById("ed-title").value.trim() || item.title;
      item.description = document.getElementById("ed-desc").value.trim();
      item.media = editorItem.media.map(m => ({
        type: m.type,
        url: m.url,
        notes: (m.notes || [])
          .filter(n => (n.text || "").trim() !== "")
          .map(n => ({ id: n.id, text: (n.text || "").trim(), x: n.x, y: n.y })),
        strokes: m.strokes || []
      }));

      // Las subfunciones se administran desde la lista, aqui se conservan
      if (!Array.isArray(item.subfunctions)) item.subfunctions = [];

      closeEditor();
      renderList();
      await persistAll();
    }

    function setupEvents() {
      document.getElementById("btn-toggle-admin").addEventListener("click", toggleEditMode);
      document.getElementById("btn-add-inline").addEventListener("click", addNewObjective);

      // Botones de subfunciones en la lista (delegacion de eventos)
      document.getElementById("objectives-list").addEventListener("click", (e) => {
        const toggle = e.target.closest('[data-role="toggle-sub"]');
        if (toggle) {
          e.stopPropagation();
          window.toggleSubfunctions(toggle.dataset.id, toggle);
          return;
        }
        const addSub = e.target.closest('[data-role="add-sub"]');
        if (addSub) {
          e.stopPropagation();
          window.addSubfunction(addSub.dataset.id);
          return;
        }
      });

      // Visor
      document.getElementById("viewer-modal").addEventListener("click", (e) => {
        if (e.target.id === "viewer-modal") closeViewer();
      });
      setupViewerGestures();

      // Editor
      document.getElementById("btn-close-editor").addEventListener("click", closeEditor);
      document.getElementById("btn-cancel-editor").addEventListener("click", closeEditor);
      document.getElementById("btn-save-editor").addEventListener("click", saveEditor);
      document.getElementById("editor-modal").addEventListener("click", (e) => {
        if (e.target.id === "editor-modal") closeEditor();
      });

      // Zona de carga
      const dz = document.getElementById("dropzone");
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = "image/*,video/*";
      fileInput.multiple = true;
      fileInput.style.display = "none";
      document.body.appendChild(fileInput);

      dz.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        handleFiles(fileInput.files);
        fileInput.value = "";
      });

      dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("dragover"); });
      dz.addEventListener("dragleave", () => dz.classList.remove("dragover"));
      dz.addEventListener("drop", (e) => {
        e.preventDefault();
        dz.classList.remove("dragover");
        handleFiles(e.dataTransfer.files);
      });

      window.addEventListener("keydown", (e) => {
        // No interferir mientras se escribe en una nota o en el texto
        const t = e.target;
        if (t && (t.isContentEditable || t.classList && t.classList.contains("editor-text-input"))) {
          if (e.key === "Escape") t.blur();
          return;
        }
        if (e.key === "Escape") {
          if (document.getElementById("editor-modal").classList.contains("active")) closeEditor();
          else closeViewer();
        }
        if (document.getElementById("viewer-modal").classList.contains("active")) {
          if (e.key === "ArrowRight") viewerGo(1);
          if (e.key === "ArrowLeft") viewerGo(-1);
        }
      });

      document.getElementById("ed-title").addEventListener("input", (e) => { if (editorItem) editorItem.title = e.target.value; });
      document.getElementById("ed-desc").addEventListener("input", (e) => { if (editorItem) editorItem.description = e.target.value; });

      window.addEventListener("mouseup", endStroke);
      window.addEventListener("touchend", endStroke);
      window.addEventListener("resize", () => {
        if (document.getElementById("editor-modal").classList.contains("active") && editorSetupCanvasFn) {
          editorSetupCanvasFn();
        }
        // Reposiciona las notas del visor si esta abierto
        if (document.getElementById("viewer-modal").classList.contains("active")) {
          document.querySelectorAll("#viewer-track .viewer-media").forEach((wrap) => {
            const img = wrap.querySelector("img");
            const layer = wrap.querySelector(".viewer-notes-layer");
            if (!img || !layer) return;
            const w = img.clientWidth, h = img.clientHeight;
            layer.style.width = w + "px";
            layer.style.height = h + "px";
            const idx = Number(wrap.dataset.mediaIndex) || 0;
            const notes = (viewerItems[idx] && viewerItems[idx].notes) || [];
            layer.querySelectorAll(".viewer-note-box").forEach((box, i) => {
              const n = notes[i];
              if (!n) return;
              box.style.left = (n.x * w) + "px";
              box.style.top = (n.y * h) + "px";
            });
          });
        }
      });

      if (sb && sb.auth && sb.auth.onAuthStateChange) {
        sb.auth.onAuthStateChange(() => { window.verifyAdminAuth(); });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
