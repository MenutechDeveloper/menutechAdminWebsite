<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avance de Funciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;

      --color-orange: #ea580c;
      --color-green: #16a34a;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 10px -2px rgba(15, 23, 42, 0.06);
      --shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 36px 24px 80px;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    /* BARRA SUPERIOR DISCRETA (SOLO VISIBLE SI ES ADMIN AUTENTICADO) */
    .top-bar {
      display: none;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      min-height: 42px;
    }
    body.is-admin-user .top-bar { display: flex; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      font-family: inherit;
    }

    .btn-toggle-admin {
      background: #ffffff;
      color: #334155;
      border-color: #cbd5e1;
      box-shadow: var(--shadow-sm);
    }
    .btn-toggle-admin:hover { background: #f8fafc; border-color: #94a3b8; }
    .btn-toggle-admin.active { background: #0f172a; color: #ffffff; border-color: #0f172a; }

    .btn-primary {
      background: #ea580c;
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(234, 88, 12, 0.2);
    }
    .btn-primary:hover { background: #c2410c; transform: translateY(-1px); }

    .btn-ghost { background: #ffffff; color: #334155; border-color: #cbd5e1; }
    .btn-ghost:hover { background: #f8fafc; border-color: #94a3b8; }

    .admin-only-btn { display: none; }
    body.is-admin-editing .admin-only-btn { display: inline-flex; }

    /* LISTA VERTICAL DE FUNCIONES */
    .objectives-list { display: flex; flex-direction: column; gap: 16px; }

    .objective-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
      position: relative;
    }
    .objective-row:hover { border-color: #cbd5e1; box-shadow: var(--shadow-md); }

    .row-main { display: flex; width: 100%; align-items: center; gap: 20px; flex-wrap: wrap; }

    /* ARRASTRAR PARA REORDENAR */
    .drag-handle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      color: #94a3b8;
      cursor: grab;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    body.is-admin-editing .drag-handle { display: flex; }
    .drag-handle:hover { background: #f1f5f9; color: #0f172a; }
    .drag-handle:active { cursor: grabbing; }

    .objective-row.dragging {
      opacity: 0.45;
      border-style: dashed;
      border-color: var(--color-orange);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
    }
    .objective-row.drop-target {
      border-color: var(--color-orange);
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.12);
    }

    /* MINIATURA */
    .media-thumb-box {
      width: 90px;
      height: 62px;
      flex-shrink: 0;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #0f172a;
      position: relative;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-thumb-box:hover {
      transform: scale(1.04);
      border-color: #ea580c;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }
    .media-thumb-box video,
    .media-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: 0.9;
      transition: opacity 0.2s;
    }
    .media-thumb-box:hover video,
    .media-thumb-box:hover img { opacity: 1; }

    .thumb-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.28);
      transition: background 0.2s;
    }
    .media-thumb-box:hover .thumb-play-overlay { background: rgba(15, 23, 42, 0.08); }

    .thumb-play-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s, background 0.2s, color 0.2s;
    }
    .media-thumb-box:hover .thumb-play-btn { transform: scale(1.12); background: #ea580c; color: #ffffff; }
    .media-thumb-box.is-100:hover .thumb-play-btn { background: #16a34a; }

    .thumb-count-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(15, 23, 42, 0.75);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: var(--radius-full);
      backdrop-filter: blur(2px);
    }

    /* INFORMACION */
    .obj-info-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .obj-title {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .obj-desc { font-size: 13px; color: #64748b; line-height: 1.45; font-weight: 450; }

    /* PROGRESO Y CONTROLES */
    .obj-progress-col { display: flex; align-items: center; gap: 16px; margin-left: auto; flex-shrink: 0; }

    .progress-pill {
      font-size: 14px;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      padding: 5px 14px;
      border-radius: var(--radius-full);
      min-width: 58px;
      text-align: center;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .admin-slider-wrap { display: none; align-items: center; gap: 12px; width: 200px; }
    body.is-admin-editing .admin-slider-wrap { display: flex; }

    .admin-range-slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #e2e8f0;
      border-radius: var(--radius-full);
      outline: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .admin-range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: var(--radius-full);
      background: #0f172a;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s, background 0.15s;
    }
    .admin-range-slider::-webkit-slider-thumb:hover { transform: scale(1.2); background: #ea580c; }

    .admin-actions { display: none; align-items: center; gap: 6px; }
    body.is-admin-editing .admin-actions { display: flex; }

    .btn-action-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-full);
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #64748b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    .btn-action-icon:hover { background: #f8fafc; color: #0f172a; border-color: #cbd5e1; }
    .btn-action-icon.btn-delete:hover { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }

    /* ============================================================
       VISOR DE MEDIOS (SLIDE LIMPIO, SIN TITULOS NI BOTONES)
       ============================================================ */
    .viewer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 12, 20, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .viewer-overlay.active { display: flex; }

    .viewer-stage-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      max-width: 1400px;
      width: 100%;
      animation: modalFadeIn 0.22s ease-out;
    }

    .viewer-stage {
      position: relative;
      background: #000;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-modal);
      width: min(88vw, 1100px);
      max-height: 86vh;
      transition: width 0.25s ease;
    }
    .viewer-stage-wrap.has-note .viewer-stage { width: min(58vw, 820px); }

    .viewer-track {
      display: flex;
      transition: transform 0.38s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: transform;
    }

    .viewer-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 86vh;
      max-height: 86vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .viewer-media { position: relative; display: inline-flex; max-width: 100%; max-height: 86vh; }
    .viewer-media img,
    .viewer-media video {
      display: block;
      max-width: 100%;
      max-height: 86vh;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .viewer-media canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    /* Nota lateral */
    .viewer-note-panel {
      width: 320px;
      max-width: 34vw;
      max-height: 80vh;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.98);
      color: #0f172a;
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      box-shadow: var(--shadow-modal);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      display: none;
      animation: modalFadeIn 0.25s ease-out;
    }
    .viewer-note-panel.visible { display: block; }
    .viewer-note-text { color: #1e293b; font-weight: 500; }

    /* ============================================================
       EDITOR DE FUNCION (MODAL)
       ============================================================ */
    .editor-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 3200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .editor-overlay.active { display: flex; }

    .editor-modal {
      background: #ffffff;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 1080px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-modal);
      animation: modalFadeIn 0.22s ease-out;
    }

    .editor-header {
      padding: 16px 22px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .editor-header h3 { font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 700; }
    .editor-close {
      background: transparent;
      border: none;
      font-size: 22px;
      line-height: 1;
      color: #94a3b8;
      cursor: pointer;
      transition: color 0.2s;
    }
    .editor-close:hover { color: #0f172a; }

    .editor-body {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 0;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }

    .editor-left {
      padding: 18px 22px;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      overflow-y: auto;
      background: #f8fafc;
    }

    .editor-right {
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      overflow-y: auto;
    }

    .editor-stage-wrap { display: flex; flex-direction: column; gap: 10px; align-items: center; }

    .editor-stage {
      position: relative;
      background: #0f172a;
      border-radius: var(--radius-md);
      overflow: hidden;
      width: 100%;
      max-height: 46vh;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .editor-stage img,
    .editor-stage video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 46vh;
      object-fit: contain;
    }
    .editor-stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .editor-stage.drawing canvas { pointer-events: auto; cursor: crosshair; }

    .editor-empty { color: #94a3b8; font-size: 13px; padding: 40px 20px; text-align: center; }

    .draw-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }

    .draw-toolbar .swatch {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-full);
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px #cbd5e1;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .draw-toolbar .swatch:hover { transform: scale(1.12); }
    .draw-toolbar .swatch.active { box-shadow: 0 0 0 2px #0f172a; }

    .draw-toolbar .size-dot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: var(--radius-full);
      border: 1px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
    }
    .draw-toolbar .size-dot span { display: block; border-radius: var(--radius-full); background: #0f172a; }
    .draw-toolbar .size-dot.active { border-color: #0f172a; background: #f1f5f9; }

    .tool-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      font-size: 13px;
    }
    .tool-btn:hover { background: #f1f5f9; }
    .tool-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 4px;
      display: block;
    }

    .edit-input,
    .edit-textarea {
      width: 100%;
      padding: 9px 12px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-sm);
      color: #0f172a;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }
    .edit-input:focus,
    .edit-textarea:focus { border-color: #ea580c; box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.12); }
    .edit-textarea { resize: vertical; min-height: 56px; line-height: 1.5; }

    .field-group { display: flex; flex-direction: column; }

    /* Zona de carga (drag & drop) */
    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: var(--radius-md);
      padding: 22px 16px;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      background: #fff;
    }
    .dropzone:hover { border-color: #94a3b8; color: #64748b; }
    .dropzone.dragover { border-color: #ea580c; background: #fff7ed; color: #ea580c; }
    .dropzone.uploading { opacity: 0.7; pointer-events: none; }

    /* Lista de medios del editor */
    .media-list { display: flex; flex-direction: column; gap: 10px; }

    .media-item {
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 10px;
      display: flex;
      gap: 10px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .media-item.active { border-color: #ea580c; box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.12); }

    .media-item-thumb {
      width: 64px;
      height: 48px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #0f172a;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .media-item-thumb img,
    .media-item-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }

    .media-item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

    .media-remove {
      width: 26px;
      height: 26px;
      border-radius: var(--radius-sm);
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #64748b;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .media-remove:hover { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }

    .editor-footer {
      padding: 14px 22px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: #fff;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.97) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* RESPONSIVE */
    @media (max-width: 860px) {
      .editor-body { grid-template-columns: 1fr; }
      .editor-left { border-right: none; border-bottom: 1px solid #e2e8f0; }
      .viewer-stage-wrap { flex-direction: column; gap: 16px; }
      .viewer-note-panel { width: 100%; max-width: 88vw; max-height: 30vh; }
    }

    @media (max-width: 768px) {
      body { padding: 20px 14px 40px; }
      .row-main { flex-direction: column; align-items: flex-start; gap: 14px; }
      .obj-progress-col { width: 100%; justify-content: space-between; margin-left: 0; }
      .admin-slider-wrap { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="top-bar" id="top-bar">
      <button class="btn btn-primary admin-only-btn" id="btn-add-inline">
        <i class="fa-solid fa-plus"></i> Agregar Función
      </button>
      <button class="btn btn-toggle-admin" id="btn-toggle-admin" title="Activar/Desactivar controles de edición">
        <i class="fa-solid fa-lock" id="icon-admin-status"></i>
        <span id="text-admin-status">Editar</span>
      </button>
    </div>

    <div class="objectives-list" id="objectives-list"></div>

  </div>

  <!-- VISOR DE MEDIOS (SLIDE LIMPIO) -->
  <div class="viewer-overlay" id="viewer-modal">
    <div class="viewer-stage-wrap">
      <div class="viewer-stage" id="viewer-stage">
        <div class="viewer-track" id="viewer-track"></div>
      </div>
      <div class="viewer-note-panel" id="viewer-note-panel">
        <div class="viewer-note-text" id="viewer-note-text"></div>
      </div>
    </div>
  </div>

  <!-- EDITOR DE FUNCION -->
  <div class="editor-overlay" id="editor-modal">
    <div class="editor-modal">
      <div class="editor-header">
        <h3>Editar Función</h3>
        <button class="editor-close" id="btn-close-editor">&times;</button>
      </div>
      <div class="editor-body">
        <div class="editor-left">
          <span class="field-label">Dibujar sobre la imagen seleccionada</span>
          <div class="editor-stage-wrap">
            <div class="editor-stage" id="editor-stage"></div>
            <div class="draw-toolbar" id="draw-toolbar"></div>
          </div>
        </div>
        <div class="editor-right">
          <div class="field-group">
            <label class="field-label" for="ed-title">Nombre</label>
            <input type="text" class="edit-input" id="ed-title" placeholder="Nombre de la función">
          </div>
          <div class="field-group">
            <label class="field-label" for="ed-desc">Descripción</label>
            <input type="text" class="edit-input" id="ed-desc" placeholder="Descripción">
          </div>
          <div class="field-group">
            <span class="field-label">Imagen/Video</span>
            <div class="dropzone" id="dropzone">Arrastra imágenes o videos aquí</div>
            <div class="media-list" id="media-list" style="margin-top:10px;"></div>
          </div>
        </div>
      </div>
      <div class="editor-footer">
        <button class="btn btn-ghost" id="btn-cancel-editor">Cancelar</button>
        <button class="btn btn-primary" id="btn-save-editor">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase as sb } from './supabase.js';

    // Cloudinary (solo para este archivo)
    const CLOUDINARY = {
      CLOUD_NAME: "dp776nphp",
      UPLOAD_PRESET: "vit0x7dr"
    };

    const TABLE = "avances";

    // Datos de ejemplo (solo si la tabla está vacía)
    const DEFAULT_OBJECTIVES = [
      {
        id: "obj-1",
        title: "Online payment",
        description: "Integración de pasarela de pagos con Stripe Connect para pedidos y reservas.",
        progress: 95,
        media: [{ type: "video", url: "./assets/misAvances/img/onlinepayment.mp4", note: "", strokes: [] }]
      },
      {
        id: "obj-2",
        title: "Menu creation",
        description: "Constructor visual de categorías y platillos en tiempo real.",
        progress: 100,
        media: [{ type: "video", url: "./assets/misAvances/img/menucreation.mp4", note: "", strokes: [] }]
      },
      {
        id: "obj-3",
        title: "Generador de menu con MenutechIA",
        description: "Lectura de fotos de menú físico e importación automática con IA.",
        progress: 85,
        media: [{ type: "video", url: "./assets/misAvances/img/menutechia.mp4", note: "", strokes: [] }]
      },
      {
        id: "obj-4",
        title: "App Android Flutter",
        description: "Aplicación nativa para restaurantes con alertas sonoras y comanderas.",
        progress: 90,
        media: [{ type: "video", url: "./assets/misAvances/img/appflutter.mp4", note: "", strokes: [] }]
      },
      {
        id: "obj-5",
        title: "Google play store",
        description: "Preparación de bundle AAB y publicación en Google Play Console.",
        progress: 60,
        media: [{ type: "video", url: "./assets/misAvances/img/playstore.mp4", note: "", strokes: [] }]
      }
    ];

    // ESTADO
    let objectives = [];
    let isUserAdmin = false;
    let isEditingActive = false;
    let editingId = null;

    // Visor
    let viewerItems = [];
    let viewerIndex = 0;

    // Editor
    let editorItem = null;
    let activeMediaIndex = -1;
    let drawColor = "#ef4444";
    let drawSize = 6;
    let drawMode = true;
    let isDrawing = false;
    let currentStroke = null;
    let editorCanvasEl = null;
    let editorSetupCanvasFn = null;

    // INICIALIZACION
    async function init() {
      await loadData();
      renderList();
      setupEvents();
      await verifyAdminAuthentication();
    }

    function newId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return "av-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    }

    function normalizeMedia(media) {
      if (!Array.isArray(media)) return [];
      return media.map(m => ({
        type: m.type === "video" ? "video" : "image",
        url: m.url || m.src || "",
        note: m.note || "",
        strokes: Array.isArray(m.strokes) ? m.strokes : []
      })).filter(m => m.url);
    }

    async function loadData() {
      try {
        const { data, error } = await sb
          .from(TABLE)
          .select("*")
          .order("sort_order", { ascending: true })
          .order("created_at", { ascending: true });

        if (error) throw error;

        if (data && data.length > 0) {
          objectives = data.map(row => ({
            id: row.id,
            title: row.title || "",
            description: row.description || "",
            progress: Number(row.progress) || 0,
            media: normalizeMedia(row.media)
          }));
        } else {
          // Tabla vacía: se muestran los ejemplos (no se guardan)
          objectives = JSON.parse(JSON.stringify(DEFAULT_OBJECTIVES));
        }
      } catch (e) {
        console.error("Error cargando avances:", e);
        objectives = JSON.parse(JSON.stringify(DEFAULT_OBJECTIVES));
      }
    }

    // Persistencia en Supabase (solo admin)
    let saveTimer = null;
    function saveData() {
      if (!isUserAdmin) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(persistAll, 250);
    }

    async function persistAll() {
      try {
        for (let i = 0; i < objectives.length; i++) {
          const o = objectives[i];
          await sb.from(TABLE).upsert({
            id: o.id,
            title: o.title || "",
            description: o.description || "",
            progress: Number(o.progress) || 0,
            media: o.media || [],
            sort_order: i,
            updated_at: new Date().toISOString()
          });
        }
      } catch (e) {
        console.error("Error guardando avances:", e);
      }
    }

    async function persistOne(item) {
      if (!isUserAdmin) return;
      try {
        const index = objectives.findIndex(o => o.id === item.id);
        await sb.from(TABLE).upsert({
          id: item.id,
          title: item.title || "",
          description: item.description || "",
          progress: Number(item.progress) || 0,
          media: item.media || [],
          sort_order: index < 0 ? 0 : index,
          updated_at: new Date().toISOString()
        });
      } catch (e) {
        console.error("Error guardando avance:", e);
      }
    }

    // Helper: usuario de Supabase en localStorage
    function getStoredAuthUser() {
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.startsWith('sb-') || key.includes('supabase')) && (key.endsWith('-auth-token') || key.includes('auth'))) {
            const raw = localStorage.getItem(key);
            if (!raw) continue;
            const parsed = JSON.parse(raw);
            const user = parsed.user || (parsed.session ? parsed.session.user : null) || (parsed.currentSession ? parsed.currentSession.user : null);
            if (user && user.id) return user;
          }
        }
      } catch (e) {
        console.warn("Error leyendo localStorage de Supabase:", e);
      }
      return null;
    }

    window.verifyAdminAuth = async function verifyAdminAuthentication() {
      try {
        let userId = null;

        if (sb && sb.auth) {
          const { data } = await sb.auth.getSession();
          if (data && data.session && data.session.user) userId = data.session.user.id;
        }

        if (!userId) {
          const storedUser = getStoredAuthUser();
          if (storedUser && storedUser.id) userId = storedUser.id;
        }

        if (!userId) { disableAdminUI(); return; }

        const { data, error } = await sb.from('profiles').select('role').eq('id', userId);
        const profile = (data && data.length > 0) ? data[0] : null;

        if (error || !profile) { disableAdminUI(); return; }

        const role = (profile.role || '').trim().toUpperCase();
        const privilegedRoles = ['ADMIN', 'DEVELOPER', 'CS', 'ADMINCS'];

        if (privilegedRoles.includes(role)) enableAdminUI();
        else disableAdminUI();
      } catch (err) {
        console.error("Error en verificación de administrador:", err);
        disableAdminUI();
      }
    }

    function enableAdminUI() {
      isUserAdmin = true;
      document.body.classList.add("is-admin-user");
    }

    function disableAdminUI() {
      isUserAdmin = false;
      isEditingActive = false;
      editingId = null;
      document.body.classList.remove("is-admin-user");
      document.body.classList.remove("is-admin-editing");
      renderList();
    }

    function toggleEditMode() {
      if (!isUserAdmin) return;

      isEditingActive = !isEditingActive;
      const btnToggle = document.getElementById("btn-toggle-admin");
      const icon = document.getElementById("icon-admin-status");
      const text = document.getElementById("text-admin-status");

      if (isEditingActive) {
        document.body.classList.add("is-admin-editing");
        btnToggle.classList.add("active");
        icon.className = "fa-solid fa-lock-open";
        text.textContent = "Modo Edición Activo";
      } else {
        document.body.classList.remove("is-admin-editing");
        btnToggle.classList.remove("active");
        icon.className = "fa-solid fa-lock";
        text.textContent = "Editar";
        editingId = null;
      }
      renderList();
    }

    function getColorForProgress(pct) {
      const p = Math.max(0, Math.min(100, Number(pct) || 0));
      if (p >= 100) return { bg: "#dcfce7", text: "#15803d", border: "#86efac", is100: true };
      if (p >= 80)  return { bg: "#ecfccb", text: "#4d7c0f", border: "#bef264", is100: false };
      if (p >= 60)  return { bg: "#fef9c3", text: "#a16207", border: "#fde047", is100: false };
      if (p >= 35)  return { bg: "#ffedd5", text: "#c2410c", border: "#fed7aa", is100: false };
      return { bg: "#ffedd5", text: "#c2410c", border: "#fdba74", is100: false };
    }

    function escapeHtml(str) {
      if (!str) return "";
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function getPrimaryMedia(item) {
      const list = Array.isArray(item.media) ? item.media : [];
      return list.length > 0 ? list[0] : { type: "none", url: "" };
    }

    function getMediaCount(item) {
      return Array.isArray(item.media) ? item.media.length : 0;
    }

    // RENDERIZAR LISTA
    function renderList() {
      const listContainer = document.getElementById("objectives-list");
      listContainer.innerHTML = "";

      if (objectives.length === 0) {
        listContainer.innerHTML = `
          <div style="background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:36px; text-align:center; color:#64748b;">
            No hay funciones registradas.
          </div>
        `;
        return;
      }

      objectives.forEach(item => {
        const color = getColorForProgress(item.progress);
        const primary = getPrimaryMedia(item);
        const mediaCount = getMediaCount(item);

        const row = document.createElement("div");
        row.className = "objective-row";
        row.dataset.id = item.id;

        let thumbInner = `<div class="thumb-play-overlay"><div class="thumb-play-btn"></div></div>`;
        if (primary.type === "video") {
          thumbInner = `<video src="${escapeHtml(primary.url)}" preload="metadata" muted></video>` +
            `<div class="thumb-play-overlay"><div class="thumb-play-btn"><i class="fa-solid fa-play"></i></div></div>`;
        } else if (primary.type === "image") {
          thumbInner = `<img src="${escapeHtml(primary.url)}" alt="">` +
            `<div class="thumb-play-overlay"><div class="thumb-play-btn"><i class="fa-solid fa-expand"></i></div></div>`;
        }

        const countBadge = mediaCount > 1 ? `<div class="thumb-count-badge">${mediaCount}</div>` : "";

        row.innerHTML = `
          <div class="row-main">
            <div class="drag-handle" title="Arrastra para reordenar"><i class="fa-solid fa-grip-vertical"></i></div>

            <div class="media-thumb-box ${color.is100 ? 'is-100' : ''}" onclick="window.openViewer('${escapeHtml(item.id)}')" title="Ver contenido">
              ${thumbInner}
              ${countBadge}
            </div>

            <div class="obj-info-col">
              <span class="obj-title">${escapeHtml(item.title)}</span>
              ${item.description ? `<p class="obj-desc">${escapeHtml(item.description)}</p>` : ''}
            </div>

            <div class="obj-progress-col">
              <div class="admin-slider-wrap">
                <input type="range" class="admin-range-slider" min="0" max="100" value="${item.progress}"
                  oninput="window.handleSliderChange('${escapeHtml(item.id)}', this.value)">
              </div>

              <span class="progress-pill pill-${escapeHtml(item.id)}" style="background-color: ${color.bg}; color: ${color.text}; border-color: ${color.border};">
                ${item.progress}%
              </span>

              <div class="admin-actions">
                <button class="btn-action-icon" title="Editar función" onclick="window.openEditor('${escapeHtml(item.id)}')">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button class="btn-action-icon btn-delete" title="Eliminar función" onclick="window.deleteObjective('${escapeHtml(item.id)}')">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        `;

        listContainer.appendChild(row);
      });

      attachDragHandlers();
    }

    // ARRASTRAR Y SOLTAR PARA REORDENAR
    function attachDragHandlers() {
      const rows = document.querySelectorAll(".objective-row");
      rows.forEach(row => {
        const handle = row.querySelector(".drag-handle");
        if (!handle) return;

        handle.setAttribute("draggable", "true");

        handle.addEventListener("dragstart", (e) => {
          if (!isUserAdmin || !isEditingActive) { e.preventDefault(); return; }
          row.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          try { e.dataTransfer.setData("text/plain", row.dataset.id); } catch (err) {}
        });

        handle.addEventListener("dragend", () => {
          row.classList.remove("dragging");
          document.querySelectorAll(".objective-row").forEach(r => r.classList.remove("drop-target"));
          commitDragOrder();
        });

        row.addEventListener("dragover", (e) => {
          if (!isUserAdmin || !isEditingActive) return;
          const dragging = document.querySelector(".objective-row.dragging");
          if (!dragging || dragging === row) return;
          e.preventDefault();

          const list = document.getElementById("objectives-list");
          const rect = row.getBoundingClientRect();
          const after = (e.clientY - rect.top) > rect.height / 2;

          document.querySelectorAll(".objective-row").forEach(r => r.classList.remove("drop-target"));
          row.classList.add("drop-target");

          if (after) list.insertBefore(dragging, row.nextSibling);
          else list.insertBefore(dragging, row);
        });

        row.addEventListener("drop", (e) => {
          if (!isUserAdmin || !isEditingActive) return;
          e.preventDefault();
          document.querySelectorAll(".objective-row").forEach(r => r.classList.remove("drop-target"));
          commitDragOrder();
        });
      });
    }

    function commitDragOrder() {
      if (!isUserAdmin || !isEditingActive) return;
      const ids = Array.from(document.querySelectorAll(".objective-row")).map(r => r.dataset.id);
      const reordered = [];
      ids.forEach(id => {
        const found = objectives.find(o => o.id === id);
        if (found) reordered.push(found);
      });
      if (reordered.length === objectives.length) {
        objectives = reordered;
        saveData();
      }
    }

    window.handleSliderChange = function(id, val) {
      if (!isUserAdmin) return;
      const p = Math.max(0, Math.min(100, parseInt(val, 10) || 0));
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      item.progress = p;

      const pill = document.querySelector(`.pill-${id}`);
      if (pill) {
        const color = getColorForProgress(p);
        pill.textContent = p + "%";
        pill.style.backgroundColor = color.bg;
        pill.style.color = color.text;
        pill.style.borderColor = color.border;
      }
      persistOne(item);
    };

    function addNewObjective() {
      if (!isUserAdmin) return;
      const item = {
        id: newId(),
        title: "Nueva Función",
        description: "",
        progress: 10,
        media: []
      };
      objectives.unshift(item);
      renderList();
      saveData();
      window.openEditor(item.id);
    }

    window.deleteObjective = async function(id) {
      if (!isUserAdmin) return;
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      if (confirm(`¿Eliminar "${item.title}"?`)) {
        objectives = objectives.filter(o => o.id !== id);
        if (editingId === id) editingId = null;
        renderList();
        try {
          await sb.from(TABLE).delete().eq("id", id);
          saveData();
        } catch (e) {
          console.error("Error eliminando:", e);
        }
      }
    };

    // ============================================================
    // VISOR DE MEDIOS (SLIDE)
    // ============================================================
    window.openViewer = function(id) {
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      viewerItems = Array.isArray(item.media) ? item.media : [];
      if (viewerItems.length === 0) return;

      viewerIndex = 0;
      const track = document.getElementById("viewer-track");
      track.innerHTML = "";

      viewerItems.forEach(m => {
        const slide = document.createElement("div");
        slide.className = "viewer-slide";

        const wrap = document.createElement("div");
        wrap.className = "viewer-media";

        if (m.type === "video") {
          const v = document.createElement("video");
          v.src = m.url;
          v.controls = true;
          v.playsInline = true;
          wrap.appendChild(v);
        } else {
          const img = document.createElement("img");
          img.src = m.url;
          img.alt = "";
          img.draggable = false;
          wrap.appendChild(img);

          if (Array.isArray(m.strokes) && m.strokes.length > 0) {
            const canvas = document.createElement("canvas");
            wrap.appendChild(canvas);
            attachViewerStrokes(img, canvas, m.strokes);
          }
        }

        slide.appendChild(wrap);
        track.appendChild(slide);
      });

      updateViewerTransform();
      updateViewerNote();
      document.getElementById("viewer-modal").classList.add("active");
    };

    function attachViewerStrokes(img, canvas, strokes) {
      const draw = () => {
        const rect = img.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        drawStrokesOn(canvas, strokes);
      };
      if (img.complete) draw();
      else img.addEventListener("load", draw);
    }

    function drawStrokesOn(canvas, strokes) {
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!strokes) return;
      strokes.forEach(s => {
        if (!s.pts || s.pts.length === 0) return;
        ctx.strokeStyle = s.color || "#ef4444";
        ctx.lineWidth = (s.w || 0.006) * canvas.width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        s.pts.forEach((p, i) => {
          const x = p.x * canvas.width;
          const y = p.y * canvas.height;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        if (s.pts.length === 1) {
          ctx.arc(s.pts[0].x * canvas.width, s.pts[0].y * canvas.height, ((s.w || 0.006) * canvas.width) / 2, 0, Math.PI * 2);
          ctx.fillStyle = s.color || "#ef4444";
          ctx.fill();
        } else {
          ctx.stroke();
        }
      });
    }

    function updateViewerTransform() {
      const track = document.getElementById("viewer-track");
      track.style.transform = `translateX(${-viewerIndex * 100}%)`;
    }

    function updateViewerNote() {
      const wrap = document.querySelector(".viewer-stage-wrap");
      const panel = document.getElementById("viewer-note-panel");
      const textEl = document.getElementById("viewer-note-text");
      const current = viewerItems[viewerIndex];
      if (current && current.type === "image" && current.note && current.note.trim()) {
        textEl.textContent = current.note;
        panel.classList.add("visible");
        wrap.classList.add("has-note");
      } else {
        panel.classList.remove("visible");
        wrap.classList.remove("has-note");
      }
    }

    function closeViewer() {
      const modal = document.getElementById("viewer-modal");
      modal.classList.remove("active");
      document.querySelectorAll("#viewer-track video").forEach(v => v.pause());
      document.getElementById("viewer-track").innerHTML = "";
      viewerItems = [];
      viewerIndex = 0;
    }

    function viewerGo(delta) {
      const next = viewerIndex + delta;
      if (next < 0 || next >= viewerItems.length) return;
      document.querySelectorAll("#viewer-track video").forEach(v => v.pause());
      viewerIndex = next;
      updateViewerTransform();
      updateViewerNote();
    }

    function setupViewerGestures() {
      const stage = document.getElementById("viewer-stage");
      let startX = 0, startY = 0, dragging = false;

      stage.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        dragging = true;
      }, { passive: true });

      stage.addEventListener("touchend", (e) => {
        if (!dragging) return;
        dragging = false;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) viewerGo(dx < 0 ? 1 : -1);
      }, { passive: true });

      stage.addEventListener("wheel", (e) => {
        if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 30) {
          viewerGo(e.deltaX > 0 ? 1 : -1);
        }
      }, { passive: true });
    }

    // ============================================================
    // EDITOR
    // ============================================================
    window.openEditor = function(id) {
      if (!isUserAdmin) return;
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      editingId = id;
      editorItem = JSON.parse(JSON.stringify(item));
      if (!Array.isArray(editorItem.media)) editorItem.media = [];
      editorItem.media.forEach(m => {
        if (!Array.isArray(m.strokes)) m.strokes = [];
      });

      document.getElementById("ed-title").value = editorItem.title || "";
      document.getElementById("ed-desc").value = editorItem.description || "";

      // Selecciona la primera imagen para dibujar
      activeMediaIndex = editorItem.media.findIndex(m => m.type === "image");
      if (activeMediaIndex < 0 && editorItem.media.length > 0) activeMediaIndex = 0;

      renderMediaList();
      renderEditorStage();
      document.getElementById("editor-modal").classList.add("active");
    };

    function closeEditor() {
      document.getElementById("editor-modal").classList.remove("active");
      editorItem = null;
      activeMediaIndex = -1;
      isDrawing = false;
      currentStroke = null;
    }

    function renderMediaList() {
      const wrap = document.getElementById("media-list");
      wrap.innerHTML = "";

      if (!editorItem || editorItem.media.length === 0) return;

      editorItem.media.forEach((m, idx) => {
        const el = document.createElement("div");
        el.className = "media-item" + (idx === activeMediaIndex ? " active" : "");

        const thumbHtml = m.type === "video"
          ? `<video src="${escapeHtml(m.url)}" muted preload="metadata"></video>`
          : `<img src="${escapeHtml(m.url)}" alt="" onerror="this.style.display='none'">`;

        const noteHtml = m.type === "image"
          ? `<textarea class="edit-textarea" data-role="note" placeholder="Nota">${escapeHtml(m.note || '')}</textarea>`
          : ``;

        el.innerHTML = `
          <div class="media-item-thumb">${thumbHtml}</div>
          <div class="media-item-body">
            ${noteHtml}
          </div>
          <button class="media-remove" data-role="remove" title="Quitar">&times;</button>
        `;

        el.querySelector(".media-item-thumb").addEventListener("click", () => {
          activeMediaIndex = idx;
          renderMediaList();
          renderEditorStage();
        });

        const noteEl = el.querySelector('[data-role="note"]');
        if (noteEl) noteEl.addEventListener("input", (e) => { editorItem.media[idx].note = e.target.value; });

        el.querySelector('[data-role="remove"]').addEventListener("click", () => {
          editorItem.media.splice(idx, 1);
          if (activeMediaIndex >= editorItem.media.length) activeMediaIndex = editorItem.media.length - 1;
          renderMediaList();
          renderEditorStage();
        });

        wrap.appendChild(el);
      });
    }

    function renderEditorStage() {
      const stage = document.getElementById("editor-stage");
      const toolbar = document.getElementById("draw-toolbar");
      stage.innerHTML = "";
      toolbar.innerHTML = "";

      const m = (editorItem && activeMediaIndex >= 0) ? editorItem.media[activeMediaIndex] : null;

      if (!m) {
        stage.classList.remove("drawing");
        stage.innerHTML = `<div class="editor-empty">Agrega una imagen o video</div>`;
        editorCanvasEl = null;
        editorSetupCanvasFn = null;
        return;
      }

      if (m.type === "video") {
        stage.classList.remove("drawing");
        stage.innerHTML = `<video src="${escapeHtml(m.url)}" controls playsinline></video>`;
        editorCanvasEl = null;
        editorSetupCanvasFn = null;
        return;
      }

      stage.innerHTML = `<img src="${escapeHtml(m.url)}" alt="" draggable="false"><canvas></canvas>`;
      const imgEl = stage.querySelector("img");
      const canvas = stage.querySelector("canvas");

      const setupCanvas = () => {
        const rect = imgEl.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(rect.width * dpr));
        canvas.height = Math.max(1, Math.round(rect.height * dpr));
        drawStrokesOn(canvas, m.strokes);
      };

      editorCanvasEl = canvas;
      editorSetupCanvasFn = setupCanvas;

      if (imgEl.complete) setupCanvas();
      imgEl.addEventListener("load", setupCanvas);

      toolbar.appendChild(buildToolbar());

      if (drawMode) stage.classList.add("drawing");

      const getPos = (ev) => {
        const r = canvas.getBoundingClientRect();
        const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
        const cy = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
        return { x: cx / r.width, y: cy / r.height };
      };

      const start = (ev) => {
        if (!drawMode) return;
        ev.preventDefault();
        isDrawing = true;
        const r = canvas.getBoundingClientRect();
        currentStroke = { color: drawColor, w: drawSize / Math.max(1, r.width), pts: [getPos(ev)] };
      };
      const move = (ev) => {
        if (!isDrawing || !currentStroke) return;
        ev.preventDefault();
        currentStroke.pts.push(getPos(ev));
        drawStrokesOn(canvas, m.strokes.concat([currentStroke]));
      };

      canvas.addEventListener("mousedown", start);
      canvas.addEventListener("mousemove", move);
      canvas.addEventListener("touchstart", start, { passive: false });
      canvas.addEventListener("touchmove", move, { passive: false });
    }

    function endStroke() {
      if (!isDrawing || !currentStroke) return;
      const m = (editorItem && activeMediaIndex >= 0) ? editorItem.media[activeMediaIndex] : null;
      isDrawing = false;
      if (m && m.type === "image") {
        m.strokes.push(currentStroke);
        if (editorCanvasEl) drawStrokesOn(editorCanvasEl, m.strokes);
      }
      currentStroke = null;
    }

    function buildToolbar() {
      const wrap = document.createElement("div");
      wrap.style.display = "flex";
      wrap.style.alignItems = "center";
      wrap.style.gap = "8px";
      wrap.style.flexWrap = "wrap";

      const btnMode = document.createElement("button");
      btnMode.className = "tool-btn" + (drawMode ? " active" : "");
      btnMode.title = "Dibujar";
      btnMode.innerHTML = `<i class="fa-solid fa-pencil"></i>`;
      btnMode.addEventListener("click", () => { drawMode = !drawMode; renderEditorStage(); });
      wrap.appendChild(btnMode);

      const colors = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#3b82f6", "#a855f7", "#0f172a", "#ffffff"];
      colors.forEach(c => {
        const sw = document.createElement("div");
        sw.className = "swatch" + (c === drawColor ? " active" : "");
        sw.style.background = c;
        sw.title = "Color";
        sw.addEventListener("click", () => { drawColor = c; renderEditorStage(); });
        wrap.appendChild(sw);
      });

      [3, 6, 12].forEach(sz => {
        const b = document.createElement("div");
        b.className = "size-dot" + (sz === drawSize ? " active" : "");
        b.innerHTML = `<span style="width:${sz + 2}px;height:${sz + 2}px;"></span>`;
        b.title = "Grosor";
        b.addEventListener("click", () => { drawSize = sz; renderEditorStage(); });
        wrap.appendChild(b);
      });

      const undo = document.createElement("button");
      undo.className = "tool-btn";
      undo.title = "Deshacer";
      undo.innerHTML = `<i class="fa-solid fa-rotate-left"></i>`;
      undo.addEventListener("click", () => {
        const m = editorItem.media[activeMediaIndex];
        if (m && m.strokes.length > 0) { m.strokes.pop(); renderEditorStage(); }
      });
      wrap.appendChild(undo);

      const clear = document.createElement("button");
      clear.className = "tool-btn";
      clear.title = "Limpiar";
      clear.innerHTML = `<i class="fa-solid fa-eraser"></i>`;
      clear.addEventListener("click", () => {
        const m = editorItem.media[activeMediaIndex];
        if (m) { m.strokes = []; renderEditorStage(); }
      });
      wrap.appendChild(clear);

      return wrap;
    }

    // ============================================================
    // SUBIDA A CLOUDINARY (drag & drop)
    // ============================================================
    async function uploadToCloudinary(file) {
      const isVideo = file.type.startsWith("video/");
      const endpoint = isVideo ? "video/upload" : "image/upload";
      const fd = new FormData();
      fd.append("file", file);
      fd.append("upload_preset", CLOUDINARY.UPLOAD_PRESET);

      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.CLOUD_NAME}/${endpoint}`, {
        method: "POST",
        body: fd
      });
      if (!res.ok) throw new Error("No se pudo subir el archivo");
      const data = await res.json();
      return { type: isVideo ? "video" : "image", url: data.secure_url, note: "", strokes: [] };
    }

    async function handleFiles(fileList) {
      if (!editorItem) return;
      const files = Array.from(fileList || []).filter(f => f.type.startsWith("image/") || f.type.startsWith("video/"));
      if (files.length === 0) return;

      const dz = document.getElementById("dropzone");
      dz.classList.add("uploading");
      dz.textContent = "Subiendo...";

      try {
        for (const file of files) {
          const media = await uploadToCloudinary(file);
          editorItem.media.push(media);
        }
        // Selecciona la última imagen agregada para dibujar
        const lastImg = editorItem.media.map(m => m.type).lastIndexOf("image");
        if (lastImg >= 0) activeMediaIndex = lastImg;
        else activeMediaIndex = editorItem.media.length - 1;
      } catch (e) {
        console.error(e);
        alert("Error al subir el archivo. Intenta de nuevo.");
      } finally {
        dz.classList.remove("uploading");
        dz.textContent = "Arrastra imágenes o videos aquí";
        renderMediaList();
        renderEditorStage();
      }
    }

    async function saveEditor() {
      if (!isUserAdmin || !editorItem) return;
      const item = objectives.find(o => o.id === editorItem.id);
      if (!item) return;

      item.title = document.getElementById("ed-title").value.trim() || item.title;
      item.description = document.getElementById("ed-desc").value.trim();
      item.media = editorItem.media.map(m => ({
        type: m.type,
        url: m.url,
        note: (m.note || "").trim(),
        strokes: m.strokes || []
      }));

      closeEditor();
      renderList();
      await persistOne(item);
      saveData();
    }

    function setupEvents() {
      document.getElementById("btn-toggle-admin").addEventListener("click", toggleEditMode);
      document.getElementById("btn-add-inline").addEventListener("click", addNewObjective);

      // Visor
      document.getElementById("viewer-modal").addEventListener("click", (e) => {
        if (e.target.id === "viewer-modal") closeViewer();
      });
      setupViewerGestures();

      // Editor
      document.getElementById("btn-close-editor").addEventListener("click", closeEditor);
      document.getElementById("btn-cancel-editor").addEventListener("click", closeEditor);
      document.getElementById("btn-save-editor").addEventListener("click", saveEditor);
      document.getElementById("editor-modal").addEventListener("click", (e) => {
        if (e.target.id === "editor-modal") closeEditor();
      });

      // Zona de carga
      const dz = document.getElementById("dropzone");
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = "image/*,video/*";
      fileInput.multiple = true;
      fileInput.style.display = "none";
      document.body.appendChild(fileInput);

      dz.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        handleFiles(fileInput.files);
        fileInput.value = "";
      });

      dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("dragover"); });
      dz.addEventListener("dragleave", () => dz.classList.remove("dragover"));
      dz.addEventListener("drop", (e) => {
        e.preventDefault();
        dz.classList.remove("dragover");
        handleFiles(e.dataTransfer.files);
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (document.getElementById("editor-modal").classList.contains("active")) closeEditor();
          else closeViewer();
        }
        if (document.getElementById("viewer-modal").classList.contains("active")) {
          if (e.key === "ArrowRight") viewerGo(1);
          if (e.key === "ArrowLeft") viewerGo(-1);
        }
      });

      document.getElementById("ed-title").addEventListener("input", (e) => { if (editorItem) editorItem.title = e.target.value; });
      document.getElementById("ed-desc").addEventListener("input", (e) => { if (editorItem) editorItem.description = e.target.value; });

      window.addEventListener("mouseup", endStroke);
      window.addEventListener("touchend", endStroke);
      window.addEventListener("resize", () => {
        if (document.getElementById("editor-modal").classList.contains("active") && editorSetupCanvasFn) {
          editorSetupCanvasFn();
        }
      });

      if (sb && sb.auth && sb.auth.onAuthStateChange) {
        sb.auth.onAuthStateChange(() => { window.verifyAdminAuth(); });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
