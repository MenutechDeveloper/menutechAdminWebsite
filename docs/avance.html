<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avance de Objetivos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;

      --color-orange: #ea580c;
      --color-green: #16a34a;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 10px -2px rgba(15, 23, 42, 0.06);
      --shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 36px 24px 80px;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* BARRA SUPERIOR DISCRETA */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      min-height: 42px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      font-family: inherit;
    }

    .btn-toggle-admin {
      background: #ffffff;
      color: #334155;
      border-color: #cbd5e1;
      box-shadow: var(--shadow-sm);
    }
    .btn-toggle-admin:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }
    .btn-toggle-admin.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .btn-primary {
      background: #ea580c;
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(234, 88, 12, 0.2);
    }
    .btn-primary:hover {
      background: #c2410c;
      transform: translateY(-1px);
    }

    .admin-only-btn {
      display: none;
    }
    body.is-admin .admin-only-btn {
      display: inline-flex;
    }

    /* LISTA VERTICAL DE OBJETIVOS (FILA POR FILA) */
    .objectives-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .objective-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px 22px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
      position: relative;
    }

    .objective-row:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
    }

    /* 1. CUADRITO DE VISTA PREVIA DEL VIDEO */
    .video-thumb-box {
      width: 90px;
      height: 62px;
      flex-shrink: 0;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #0f172a;
      position: relative;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-thumb-box:hover {
      transform: scale(1.04);
      border-color: #ea580c;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    .video-thumb-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .video-thumb-box:hover video {
      opacity: 1;
    }

    .thumb-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.35);
      transition: background 0.2s;
    }
    .video-thumb-box:hover .thumb-play-overlay {
      background: rgba(15, 23, 42, 0.1);
    }

    .thumb-play-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s, background 0.2s, color 0.2s;
    }
    .video-thumb-box:hover .thumb-play-btn {
      transform: scale(1.12);
      background: #ea580c;
      color: #ffffff;
    }
    .video-thumb-box.is-100:hover .thumb-play-btn {
      background: #16a34a;
    }

    /* 2. COLUMNA INFORMACION (TITULO Y DESCRIPCION A LA DERECHA DEL VIDEO) */
    .obj-info-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .obj-title {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .obj-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.45;
      font-weight: 450;
    }

    /* 3. PROGRESO Y CONTROLES SEGUN MODO */
    .obj-progress-col {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-left: auto;
      flex-shrink: 0;
    }

    /* Para visitantes (sin admin): SOLO porcentaje con color dinámico, NADA de barra/línea */
    .progress-pill {
      font-size: 14px;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      padding: 5px 14px;
      border-radius: var(--radius-full);
      min-width: 58px;
      text-align: center;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    /* Para admin: LA LINEA INTERACTIVA (slider para mover a gusto directamente en la interfaz) */
    .admin-slider-wrap {
      display: none;
      align-items: center;
      gap: 12px;
      width: 200px;
    }
    body.is-admin .admin-slider-wrap {
      display: flex;
    }

    .admin-range-slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #e2e8f0;
      border-radius: var(--radius-full);
      outline: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .admin-range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: var(--radius-full);
      background: #0f172a;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s, background 0.15s;
    }
    .admin-range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      background: #ea580c;
    }

    /* ACCIONES ADMIN EN FILA */
    .admin-actions {
      display: none;
      align-items: center;
      gap: 6px;
    }
    body.is-admin .admin-actions {
      display: flex;
    }

    .btn-action-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-full);
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #64748b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .btn-action-icon:hover {
      background: #f8fafc;
      color: #0f172a;
      border-color: #cbd5e1;
    }

    .btn-action-icon.btn-delete:hover {
      background: #fef2f2;
      color: #ef4444;
      border-color: #fca5a5;
    }

    /* MODO EDICION INLINE (DENTRO DE LA PROPIA FILA, SIN POPUPS) */
    .inline-edit-panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-top: 12px;
      animation: fadeIn 0.2s ease;
    }
    .objective-row.editing-inline .inline-edit-panel {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .edit-inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .edit-input {
      padding: 8px 12px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-sm);
      color: #0f172a;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }
    .edit-input:focus {
      border-color: #ea580c;
      box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.12);
    }

    .edit-input-full {
      grid-column: span 2;
    }

    .edit-actions-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* REPRODUCTOR DE VIDEO MODAL FLOTANTE (GRANDE, PLAY, PAUSE, FULLSCREEN) */
    .video-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .video-modal-overlay.active {
      display: flex;
    }

    .video-theater {
      background: #000000;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 900px;
      overflow: hidden;
      box-shadow: var(--shadow-modal);
      position: relative;
      display: flex;
      flex-direction: column;
      animation: modalFadeIn 0.22s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.97) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .video-theater-header {
      background: rgba(15, 23, 42, 0.96);
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .video-theater-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #ffffff;
    }

    .video-theater-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }
    .video-theater-close:hover {
      color: #ffffff;
    }

    .video-theater-body {
      background: #000000;
      width: 100%;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .video-theater video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .video-error-placeholder {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #94a3b8;
      text-align: center;
      padding: 30px;
    }
    .video-error-placeholder i {
      font-size: 40px;
      color: #ea580c;
    }
    .video-error-placeholder p {
      font-size: 14px;
      max-width: 440px;
      line-height: 1.4;
    }
    .video-path-preview {
      font-family: monospace;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.12);
      padding: 5px 12px;
      border-radius: 4px;
      color: #f1f5f9;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      body {
        padding: 20px 14px 40px;
      }
      .objective-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .obj-progress-col {
        width: 100%;
        justify-content: space-between;
        margin-left: 0;
      }
      .admin-slider-wrap {
        width: 100%;
      }
      .edit-inputs-grid {
        grid-template-columns: 1fr;
      }
      .edit-input-full {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- BARRA SUPERIOR DISCRETA (SOLO ACCIONES ESENCIALES) -->
    <div class="top-bar">
      <!-- Botón para nuevo objetivo (visible en modo admin) -->
      <button class="btn btn-primary admin-only-btn" id="btn-add-inline">
        <i class="fa-solid fa-plus"></i> Agregar Objetivo
      </button>

      <!-- Toggle directo de modo Administrador -->
      <button class="btn btn-toggle-admin" id="btn-toggle-admin" title="Activar/Desactivar controles de edición">
        <i class="fa-solid fa-lock" id="icon-admin-status"></i>
        <span id="text-admin-status">Editar</span>
      </button>
    </div>

    <!-- LISTA VERTICAL DE OBJETIVOS (UNO DEBAJO DEL OTRO EN FILA) -->
    <div class="objectives-list" id="objectives-list">
      <!-- Los objetivos se renderizan aquí dinámicamente -->
    </div>

  </div>

  <!-- REPRODUCTOR DE VIDEO MODAL FLOTANTE (GRANDE, PLAY, PAUSE, FULLSCREEN) -->
  <div class="video-modal-overlay" id="video-theater-modal">
    <div class="video-theater">
      <div class="video-theater-header">
        <span class="video-theater-title" id="theater-title">Video de Muestra</span>
        <button class="video-theater-close" id="btn-close-theater">&times;</button>
      </div>
      <div class="video-theater-body">
        <video id="theater-video" controls playsinline></video>
        <div class="video-error-placeholder" id="video-error-msg">
          <i class="fa-solid fa-film"></i>
          <p>Ruta local configurada para este objetivo:</p>
          <span class="video-path-preview" id="video-path-text"></span>
          <p style="font-size: 12px; color: #64748b; margin-top: 6px;">
            Coloca el archivo de video en la ruta especificada de tu proyecto para reproducirlo.
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- CARGA OPCIONAL DE SUPABASE (PARA DETECTAR SESION ADMIN AUTOMATICAMENTE SI EXISTE) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js" onerror="console.log('supabase.js opcional')"></script>

  <script>
    // OBJETIVOS SOLICITADOS POR DEFECTO
    const DEFAULT_OBJECTIVES = [
      {
        id: "obj-1",
        title: "Online payment",
        description: "Integración de pasarela de pagos con Stripe Connect para pedidos y reservas.",
        progress: 95,
        video: "./assets/misAvances/img/onlinepayment.mp4"
      },
      {
        id: "obj-2",
        title: "Menu creation",
        description: "Constructor visual de categorías y platillos en tiempo real.",
        progress: 100,
        video: "./assets/misAvances/img/menucreation.mp4"
      },
      {
        id: "obj-3",
        title: "Generador de menu con MenutechIA",
        description: "Lectura de fotos de menú físico e importación automática con IA.",
        progress: 85,
        video: "./assets/misAvances/img/menutechia.mp4"
      },
      {
        id: "obj-4",
        title: "App Android Flutter",
        description: "Aplicación nativa para restaurantes con alertas sonoras y comanderas.",
        progress: 90,
        video: "./assets/misAvances/img/appflutter.mp4"
      },
      {
        id: "obj-5",
        title: "Google play store",
        description: "Preparación de bundle AAB y publicación en Google Play Console.",
        progress: 60,
        video: "./assets/misAvances/img/playstore.mp4"
      }
    ];

    const STORAGE_KEY = "menutech_avances_list_v3";
    const ADMIN_KEY = "menutech_avance_is_admin";

    // ESTADO
    let objectives = [];
    let isAdmin = false;
    let editingId = null;

    // INICIALIZACION
    function init() {
      loadData();
      checkAdminStatus();
      setupEvents();
      renderList();
    }

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          objectives = JSON.parse(saved);
        } else {
          objectives = [...DEFAULT_OBJECTIVES];
          saveData();
        }
      } catch (e) {
        objectives = [...DEFAULT_OBJECTIVES];
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(objectives));
      } catch (e) {
        console.error("Error guardando en localStorage:", e);
      }
    }

    function checkAdminStatus() {
      const urlParams = new URLSearchParams(window.location.search);

      if (urlParams.get("admin") === "true" || urlParams.get("admin") === "1" || urlParams.get("edit") === "true") {
        setAdminState(true);
        return;
      }

      const localAdmin = localStorage.getItem(ADMIN_KEY);
      if (localAdmin === "true") {
        setAdminState(true);
        return;
      }

      try {
        const sbClient = window.sbClient || window.supabaseClient;
        if (sbClient && sbClient.auth) {
          sbClient.auth.getSession().then(({ data }) => {
            if (data && data.session) {
              setAdminState(true);
            }
          });
        }
      } catch (e) {}

      setAdminState(false);
    }

    function setAdminState(adminActive) {
      isAdmin = adminActive;
      localStorage.setItem(ADMIN_KEY, isAdmin ? "true" : "false");

      const btnToggle = document.getElementById("btn-toggle-admin");
      const icon = document.getElementById("icon-admin-status");
      const text = document.getElementById("text-admin-status");

      if (isAdmin) {
        document.body.classList.add("is-admin");
        btnToggle.classList.add("active");
        icon.className = "fa-solid fa-lock-open";
        text.textContent = "Modo Admin Activo";
      } else {
        document.body.classList.remove("is-admin");
        btnToggle.classList.remove("active");
        icon.className = "fa-solid fa-lock";
        text.textContent = "Editar";
        editingId = null; // Cierra cualquier editor inline abierto
      }

      renderList();
    }

    // CALCULO DEL COLOR DINAMICO PROGRESIVO:
    // Estado normal/inicial: naranja (#ea580c)
    // Conforme avanza se vuelve más verde hasta llegar a verde esmeralda (#16a34a) al 100%
    function getColorForProgress(pct) {
      const p = Math.max(0, Math.min(100, Number(pct) || 0));

      if (p >= 100) {
        return {
          color: "#16a34a",
          bg: "#dcfce7",
          text: "#15803d",
          border: "#86efac",
          is100: true
        };
      } else if (p >= 80) {
        return {
          color: "#65a30d",
          bg: "#ecfccb",
          text: "#4d7c0f",
          border: "#bef264",
          is100: false
        };
      } else if (p >= 60) {
        return {
          color: "#eab308",
          bg: "#fef9c3",
          text: "#a16207",
          border: "#fde047",
          is100: false
        };
      } else if (p >= 35) {
        return {
          color: "#f97316",
          bg: "#ffedd5",
          text: "#c2410c",
          border: "#fed7aa",
          is100: false
        };
      } else {
        return {
          color: "#ea580c",
          bg: "#ffedd5",
          text: "#c2410c",
          border: "#fdba74",
          is100: false
        };
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // RENDERIZAR LISTA
    function renderList() {
      const listContainer = document.getElementById("objectives-list");
      listContainer.innerHTML = "";

      if (objectives.length === 0) {
        listContainer.innerHTML = `
          <div style="background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:36px; text-align:center; color:#64748b;">
            No hay objetivos registrados.
          </div>
        `;
        return;
      }

      objectives.forEach(item => {
        const color = getColorForProgress(item.progress);
        const isEditing = editingId === item.id;

        const row = document.createElement("div");
        row.className = `objective-row ${isEditing ? 'editing-inline' : ''}`;
        row.dataset.id = item.id;

        // Renderizado del HTML de la fila
        row.innerHTML = `
          <div style="display:flex; width:100%; align-items:center; gap:20px; flex-wrap:wrap;">

            <!-- 1. CUADRITO DE VISTA PREVIA DEL VIDEO -->
            <div class="video-thumb-box ${color.is100 ? 'is-100' : ''}" onclick="openVideo('${escapeHtml(item.id)}')" title="Ver video de muestra">
              <video src="${escapeHtml(item.video || '')}" preload="metadata" muted></video>
              <div class="thumb-play-overlay">
                <div class="thumb-play-btn">
                  <i class="fa-solid fa-play"></i>
                </div>
              </div>
            </div>

            <!-- 2. TITULO Y DESCRIPCION (SOLO SI TIENE DESCRIPCION SE MUESTRA A LA DERECHA) -->
            <div class="obj-info-col">
              <span class="obj-title">${escapeHtml(item.title)}</span>
              ${item.description ? `<p class="obj-desc">${escapeHtml(item.description)}</p>` : ''}
            </div>

            <!-- 3. PROGRESO Y CONTROLES -->
            <div class="obj-progress-col">

              <!-- PARA ADMIN: LINEA / SLIDER INTERACTIVO DIRECTO (MOVER A GUSTO SIN POPUPS) -->
              <div class="admin-slider-wrap">
                <input
                  type="range"
                  class="admin-range-slider"
                  min="0"
                  max="100"
                  value="${item.progress}"
                  oninput="handleSliderChange('${escapeHtml(item.id)}', this.value)"
                >
              </div>

              <!-- PARA VISITANTES (Y ADMIN): PORCENTAJE EN COLOR DINAMICO (SIN LINEA PARA VISITANTES) -->
              <span class="progress-pill pill-${escapeHtml(item.id)}" style="background-color: ${color.bg}; color: ${color.text}; border-color: ${color.border};">
                ${item.progress}%
              </span>

              <!-- BOTONES DE EDICION INLINE (SOLO ADMIN) -->
              <div class="admin-actions">
                <button class="btn-action-icon" title="Editar datos" onclick="toggleInlineEdit('${escapeHtml(item.id)}')">
                  <i class="fa-solid ${isEditing ? 'fa-xmark' : 'fa-pen'}"></i>
                </button>
                <button class="btn-action-icon btn-delete" title="Eliminar objetivo" onclick="deleteObjective('${escapeHtml(item.id)}')">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>

            </div>

          </div>

          <!-- PANEL DE EDICION INLINE (SIN POPUPS, SE ABRE EN LA MISMA FILA) -->
          <div class="inline-edit-panel">
            <div class="edit-inputs-grid">
              <input type="text" class="edit-input" id="edit-title-${escapeHtml(item.id)}" value="${escapeHtml(item.title)}" placeholder="Nombre del objetivo">
              <input type="text" class="edit-input" id="edit-video-${escapeHtml(item.id)}" value="${escapeHtml(item.video || '')}" placeholder="Ruta video (ej. ./assets/video.mp4)">
              <input type="text" class="edit-input edit-input-full" id="edit-desc-${escapeHtml(item.id)}" value="${escapeHtml(item.description || '')}" placeholder="Descripción opcional (se muestra a la derecha del video)">
            </div>
            <div class="edit-actions-bar">
              <button class="btn btn-primary" onclick="saveInlineEdit('${escapeHtml(item.id)}')">
                <i class="fa-solid fa-check"></i> Guardar Cambios
              </button>
            </div>
          </div>
        `;

        listContainer.appendChild(row);
      });
    }

    // SLIDER INTERACTIVO ADMIN (SIN POPUPS, SE MUEVE EN TIEMPO REAL)
    window.handleSliderChange = function(id, val) {
      const p = Math.max(0, Math.min(100, parseInt(val, 10) || 0));
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      item.progress = p;
      saveData();

      // Actualizar dinámicamente el pill de porcentaje y colores en pantalla al instante
      const pill = document.querySelector(`.pill-${id}`);
      if (pill) {
        const color = getColorForProgress(p);
        pill.textContent = p + "%";
        pill.style.backgroundColor = color.bg;
        pill.style.color = color.text;
        pill.style.borderColor = color.border;
      }
    };

    // TOGGLE MODO EDICION INLINE
    window.toggleInlineEdit = function(id) {
      editingId = editingId === id ? null : id;
      renderList();
    };

    window.saveInlineEdit = function(id) {
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      const titleInput = document.getElementById(`edit-title-${id}`);
      const descInput = document.getElementById(`edit-desc-${id}`);
      const videoInput = document.getElementById(`edit-video-${id}`);

      if (titleInput && titleInput.value.trim()) {
        item.title = titleInput.value.trim();
      }
      if (descInput) {
        item.description = descInput.value.trim();
      }
      if (videoInput) {
        item.video = videoInput.value.trim();
      }

      editingId = null;
      saveData();
      renderList();
    };

    // AGREGAR NUEVO OBJETIVO DIRECTO
    function addNewObjective() {
      const newId = "obj-" + Date.now();
      objectives.unshift({
        id: newId,
        title: "Nuevo Objetivo",
        description: "",
        progress: 10,
        video: "./assets/misAvances/img/video.mp4"
      });
      editingId = newId;
      saveData();
      renderList();
    }

    // ELIMINAR OBJETIVO
    window.deleteObjective = function(id) {
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      if (confirm(`¿Eliminar "${item.title}"?`)) {
        objectives = objectives.filter(o => o.id !== id);
        if (editingId === id) editingId = null;
        saveData();
        renderList();
      }
    };

    // REPRODUCTOR DE VIDEO MODAL FLOTANTE (GRANDE, PLAY/PAUSE/FULLSCREEN)
    window.openVideo = function(id) {
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      const theaterModal = document.getElementById("video-theater-modal");
      const theaterTitle = document.getElementById("theater-title");
      const videoPlayer = document.getElementById("theater-video");
      const errorMsg = document.getElementById("video-error-msg");
      const videoPathText = document.getElementById("video-path-text");

      theaterTitle.textContent = item.title;
      videoPathText.textContent = item.video || "(sin ruta configurada)";

      errorMsg.style.display = "none";
      videoPlayer.style.display = "block";
      videoPlayer.src = item.video || "";

      theaterModal.classList.add("active");

      videoPlayer.onerror = function() {
        videoPlayer.style.display = "none";
        errorMsg.style.display = "flex";
      };

      const playPromise = videoPlayer.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {});
      }
    };

    function closeVideoModal() {
      const theaterModal = document.getElementById("video-theater-modal");
      const videoPlayer = document.getElementById("theater-video");
      theaterModal.classList.remove("active");
      videoPlayer.pause();
      videoPlayer.src = "";
    }

    function setupEvents() {
      // Toggle admin
      document.getElementById("btn-toggle-admin").addEventListener("click", () => {
        setAdminState(!isAdmin);
      });

      // Agregar inline
      document.getElementById("btn-add-inline").addEventListener("click", () => {
        addNewObjective();
      });

      // Cerrar modal de video
      document.getElementById("btn-close-theater").addEventListener("click", closeVideoModal);
      document.getElementById("video-theater-modal").addEventListener("click", (e) => {
        if (e.target.id === "video-theater-modal") closeVideoModal();
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeVideoModal();
      });
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
