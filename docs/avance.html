<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avance de Objetivos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;

      --color-orange: #ea580c;
      --color-green: #16a34a;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 32px 20px 60px;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    /* BARRA SUPERIOR DISCRETA (SOLO ACCIONES ESENCIALES) */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      min-height: 40px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      font-family: inherit;
    }

    .btn-toggle-admin {
      background: #ffffff;
      color: #334155;
      border-color: #cbd5e1;
      box-shadow: var(--shadow-sm);
    }
    .btn-toggle-admin:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }
    .btn-toggle-admin.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .btn-primary {
      background: #ea580c;
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(234, 88, 12, 0.2);
    }
    .btn-primary:hover {
      background: #c2410c;
      transform: translateY(-1px);
    }

    .admin-controls {
      display: none;
      gap: 10px;
      align-items: center;
    }
    body.is-admin .admin-controls {
      display: flex;
    }

    /* LISTA VERTICAL (UNO DEBAJO DEL OTRO EN FILA) */
    .objectives-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .objective-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 320px 1fr 110px auto;
      align-items: center;
      gap: 24px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      position: relative;
    }

    .objective-row:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
    }

    /* 1. TITULO DEL OBJETIVO */
    .obj-title-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .obj-title {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 2. BARRA DE PROGRESO Y COLOR DINÁMICO */
    .obj-progress-col {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .progress-track {
      flex: 1;
      height: 10px;
      background: #e2e8f0;
      border-radius: var(--radius-full);
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      border-radius: var(--radius-full);
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.5s ease;
    }

    .progress-badge {
      font-size: 13px;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      min-width: 52px;
      text-align: center;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }

    /* 3. BOTON DE VIDEO */
    .obj-video-col {
      display: flex;
      justify-content: flex-end;
    }

    .btn-video {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      font-family: inherit;
    }

    .btn-video:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn-video i {
      color: #ea580c;
      font-size: 12px;
    }

    .btn-video.has-100 i {
      color: #16a34a;
    }

    /* 4. ACCIONES ADMIN (EDITAR / ELIMINAR) */
    .obj-admin-col {
      display: none;
      align-items: center;
      gap: 8px;
    }

    body.is-admin .obj-admin-col {
      display: flex;
    }

    .btn-action-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-full);
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #64748b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .btn-action-icon:hover {
      background: #f8fafc;
      color: #0f172a;
      border-color: #cbd5e1;
    }

    .btn-action-icon.btn-delete:hover {
      background: #fef2f2;
      color: #ef4444;
      border-color: #fca5a5;
    }

    /* MODAL DE EDICIÓN / AGREGAR */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-modal);
      overflow: hidden;
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }

    .modal-close {
      background: transparent;
      border: none;
      font-size: 18px;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }
    .modal-close:hover {
      color: #0f172a;
    }

    .modal-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-input {
      padding: 10px 14px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-sm);
      color: #0f172a;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      background: #ffffff;
      border-color: #ea580c;
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.12);
    }

    .range-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .range-wrap input[type="range"] {
      flex: 1;
      accent-color: #ea580c;
    }
    .range-val {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 16px;
      min-width: 48px;
      text-align: right;
      color: #0f172a;
    }

    .modal-footer {
      padding: 16px 24px;
      background: #f8fafc;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-secondary {
      background: #ffffff;
      color: #475569;
      border-color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    /* MODAL DE REPRODUCTOR DE VIDEO (GRANDE, PLAY/PAUSE/FULLSCREEN) */
    .video-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .video-modal-overlay.active {
      display: flex;
    }

    .video-theater {
      background: #000000;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 860px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .video-theater-header {
      background: rgba(15, 23, 42, 0.95);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .video-theater-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #ffffff;
    }

    .video-theater-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }
    .video-theater-close:hover {
      color: #ffffff;
    }

    .video-theater-body {
      background: #000000;
      width: 100%;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .video-theater video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .video-error-placeholder {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #94a3b8;
      text-align: center;
      padding: 30px;
    }
    .video-error-placeholder i {
      font-size: 40px;
      color: #ea580c;
    }
    .video-error-placeholder p {
      font-size: 14px;
      max-width: 400px;
      line-height: 1.4;
    }
    .video-path-preview {
      font-family: monospace;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 4px;
      color: #f1f5f9;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      body {
        padding: 20px 14px 40px;
      }
      .objective-row {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .obj-title {
        white-space: normal;
      }
      .obj-video-col {
        justify-content: flex-start;
      }
      .obj-admin-col {
        border-top: 1px solid #f1f5f9;
        padding-top: 10px;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- BARRA SUPERIOR DISCRETA (SOLO CONTROLES) -->
    <div class="top-bar">
      <!-- Botón para nuevo objetivo (visible en modo admin) -->
      <div class="admin-controls">
        <button class="btn btn-primary" id="btn-add-obj">
          <i class="fa-solid fa-plus"></i> Agregar Objetivo
        </button>
      </div>

      <!-- Toggle directo de modo Administrador -->
      <button class="btn btn-toggle-admin" id="btn-toggle-admin" title="Activar/Desactivar controles de edición">
        <i class="fa-solid fa-lock" id="icon-admin-status"></i>
        <span id="text-admin-status">Editar</span>
      </button>
    </div>

    <!-- LISTA VERTICAL DE OBJETIVOS (UNO DEBAJO DEL OTRO EN FILA) -->
    <div class="objectives-list" id="objectives-list">
      <!-- Los objetivos se renderizan aquí dinámicamente -->
    </div>

  </div>

  <!-- MODAL PARA AGREGAR O EDITAR OBJETIVO -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-heading">Editar Objetivo</h3>
        <button class="modal-close" id="btn-close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-id">

        <div class="form-group">
          <label class="form-label" for="input-title">Objetivo</label>
          <input type="text" id="input-title" class="form-input" placeholder="Nombre del objetivo (ej. Online payment)">
        </div>

        <div class="form-group">
          <label class="form-label">Porcentaje de Avance</label>
          <div class="range-wrap">
            <input type="range" id="input-progress" min="0" max="100" value="0">
            <span class="range-val" id="label-progress">0%</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="input-video">Ruta del Video de Muestra</label>
          <input type="text" id="input-video" class="form-input" placeholder="./assets/misAvances/img/video.mp4">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-cancel-modal">Cancelar</button>
        <button class="btn btn-primary" id="btn-save-modal">Guardar</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE REPRODUCTOR DE VIDEO GRANDE -->
  <div class="video-modal-overlay" id="video-theater-modal">
    <div class="video-theater">
      <div class="video-theater-header">
        <span class="video-theater-title" id="theater-title">Video de Muestra</span>
        <button class="video-theater-close" id="btn-close-theater">&times;</button>
      </div>
      <div class="video-theater-body">
        <video id="theater-video" controls playsinline></video>
        <div class="video-error-placeholder" id="video-error-msg">
          <i class="fa-solid fa-film"></i>
          <p>Ruta local configurada para este objetivo:</p>
          <span class="video-path-preview" id="video-path-text"></span>
          <p style="font-size: 12px; color: #64748b; margin-top: 6px;">
            Coloca el archivo de video en la ruta especificada dentro de tu proyecto para reproducirlo.
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- CARGA OPCIONAL DE SUPABASE (PARA DETECTAR SESION ADMIN AUTOMATICAMENTE SI EXISTE) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js" onerror="console.log('supabase.js opcional')"></script>

  <script>
    // LISTA DE OBJETIVOS SOLICITADOS POR DEFECTO
    const DEFAULT_OBJECTIVES = [
      {
        id: "obj-1",
        title: "Online payment",
        progress: 95,
        video: "./assets/misAvances/img/onlinepayment.mp4"
      },
      {
        id: "obj-2",
        title: "Menu creation",
        progress: 100,
        video: "./assets/misAvances/img/menucreation.mp4"
      },
      {
        id: "obj-3",
        title: "Generador de menu con MenutechIA",
        progress: 85,
        video: "./assets/misAvances/img/menutechia.mp4"
      },
      {
        id: "obj-4",
        title: "App Android Flutter",
        progress: 90,
        video: "./assets/misAvances/img/appflutter.mp4"
      },
      {
        id: "obj-5",
        title: "Google play store",
        progress: 60,
        video: "./assets/misAvances/img/playstore.mp4"
      }
    ];

    const STORAGE_KEY = "menutech_avances_list_v2";
    const ADMIN_KEY = "menutech_avance_is_admin";

    // ESTADO DE LA APLICACION
    let objectives = [];
    let isAdmin = false;

    // INICIALIZACION
    function init() {
      loadData();
      checkAdminStatus();
      setupEvents();
      renderList();
    }

    // CARGAR DATOS
    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          objectives = JSON.parse(saved);
        } else {
          objectives = [...DEFAULT_OBJECTIVES];
          saveData();
        }
      } catch (e) {
        objectives = [...DEFAULT_OBJECTIVES];
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(objectives));
      } catch (e) {
        console.error("Error guardando en localStorage:", e);
      }
    }

    // GESTION DEL MODO ADMIN
    function checkAdminStatus() {
      const urlParams = new URLSearchParams(window.location.search);

      // 1. Si viene por query param ?admin=true o ?admin=1
      if (urlParams.get("admin") === "true" || urlParams.get("admin") === "1" || urlParams.get("edit") === "true") {
        setAdminState(true);
        return;
      }

      // 2. Si ya lo tenía activo en localStorage
      const localAdmin = localStorage.getItem(ADMIN_KEY);
      if (localAdmin === "true") {
        setAdminState(true);
        return;
      }

      // 3. Revisar si hay sesion activa de Supabase
      try {
        const sbClient = window.sbClient || window.supabaseClient;
        if (sbClient && sbClient.auth) {
          sbClient.auth.getSession().then(({ data }) => {
            if (data && data.session) {
              setAdminState(true);
            }
          });
        }
      } catch (e) {}

      setAdminState(false);
    }

    function setAdminState(adminActive) {
      isAdmin = adminActive;
      localStorage.setItem(ADMIN_KEY, isAdmin ? "true" : "false");

      const btnToggle = document.getElementById("btn-toggle-admin");
      const icon = document.getElementById("icon-admin-status");
      const text = document.getElementById("text-admin-status");

      if (isAdmin) {
        document.body.classList.add("is-admin");
        btnToggle.classList.add("active");
        icon.className = "fa-solid fa-lock-open";
        text.textContent = "Modo Admin Activo";
      } else {
        document.body.classList.remove("is-admin");
        btnToggle.classList.remove("active");
        icon.className = "fa-solid fa-lock";
        text.textContent = "Editar";
      }
    }

    // CALCULO DEL COLOR PROGRESIVO SEGUN EL %
    // Estado normal/inicial: naranja (#ea580c)
    // Va cambiando mientras se acerca al 100% hasta verde esmeralda (#16a34a)
    function getColorForProgress(pct) {
      const p = Math.max(0, Math.min(100, Number(pct) || 0));

      if (p >= 100) {
        return {
          barColor: "#16a34a",       // Verde esmeralda vivo
          badgeBg: "#dcfce7",        // Verde suave
          badgeText: "#15803d",
          badgeBorder: "#86efac",
          is100: true
        };
      } else if (p >= 80) {
        return {
          barColor: "#65a30d",       // Verde lima avanzado
          badgeBg: "#ecfccb",
          badgeText: "#4d7c0f",
          badgeBorder: "#bef264",
          is100: false
        };
      } else if (p >= 60) {
        return {
          barColor: "#eab308",       // Amarillo / ámbar intermedio
          badgeBg: "#fef9c3",
          badgeText: "#a16207",
          badgeBorder: "#fde047",
          is100: false
        };
      } else if (p >= 35) {
        return {
          barColor: "#f97316",       // Naranja vivo
          badgeBg: "#ffedd5",
          badgeText: "#c2410c",
          badgeBorder: "#fed7aa",
          is100: false
        };
      } else {
        return {
          barColor: "#ea580c",       // Naranja base
          badgeBg: "#ffedd5",
          badgeText: "#c2410c",
          badgeBorder: "#fdba74",
          is100: false
        };
      }
    }

    // ESCAPAR STRINGS HTML
    function escapeHtml(str) {
      if (!str) return "";
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // RENDERIZAR LISTA EN FILA (UNO DEBAJO DEL OTRO)
    function renderList() {
      const listContainer = document.getElementById("objectives-list");
      listContainer.innerHTML = "";

      if (objectives.length === 0) {
        listContainer.innerHTML = `
          <div style="background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:32px; text-align:center; color:#64748b;">
            No hay objetivos registrados.
          </div>
        `;
        return;
      }

      objectives.forEach(item => {
        const color = getColorForProgress(item.progress);

        const row = document.createElement("div");
        row.className = "objective-row";
        row.dataset.id = item.id;

        row.innerHTML = `
          <!-- 1. TITULO -->
          <div class="obj-title-col">
            <span class="obj-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</span>
          </div>

          <!-- 2. PROGRESO CON COLOR PROGRESIVO -->
          <div class="obj-progress-col">
            <div class="progress-track">
              <div class="progress-fill" style="width: ${item.progress}%; background-color: ${color.barColor};"></div>
            </div>
            <span class="progress-badge" style="background-color: ${color.badgeBg}; color: ${color.badgeText}; border-color: ${color.badgeBorder};">
              ${item.progress}%
            </span>
          </div>

          <!-- 3. VIDEO DE MUESTRA -->
          <div class="obj-video-col">
            <button class="btn-video ${color.is100 ? 'has-100' : ''}" onclick="openVideo('${escapeHtml(item.id)}')">
              <i class="fa-solid fa-circle-play"></i> Video
            </button>
          </div>

          <!-- 4. CONTROLES ADMIN (EDITAR / ELIMINAR) -->
          <div class="obj-admin-col">
            <button class="btn-action-icon" title="Editar objetivo" onclick="openEditModal('${escapeHtml(item.id)}')">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button class="btn-action-icon btn-delete" title="Eliminar objetivo" onclick="deleteObjective('${escapeHtml(item.id)}')">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;

        listContainer.appendChild(row);
      });
    }

    // LOGICA DE EVENTOS
    function setupEvents() {
      // Toggle modo Admin directo al hacer clic
      const btnToggle = document.getElementById("btn-toggle-admin");
      btnToggle.addEventListener("click", () => {
        setAdminState(!isAdmin);
      });

      // Boton Agregar
      document.getElementById("btn-add-obj").addEventListener("click", () => {
        openAddModal();
      });

      // Cerrar modales
      document.getElementById("btn-close-modal").addEventListener("click", closeEditModal);
      document.getElementById("btn-cancel-modal").addEventListener("click", closeEditModal);

      document.getElementById("btn-close-theater").addEventListener("click", closeVideoModal);

      // Sincronizar input range con label
      const range = document.getElementById("input-progress");
      const label = document.getElementById("label-progress");
      range.addEventListener("input", (e) => {
        label.textContent = e.target.value + "%";
      });

      // Guardar formulario
      document.getElementById("btn-save-modal").addEventListener("click", saveModalData);

      // Cerrar al hacer clic en fondo
      document.getElementById("edit-modal").addEventListener("click", (e) => {
        if (e.target.id === "edit-modal") closeEditModal();
      });

      document.getElementById("video-theater-modal").addEventListener("click", (e) => {
        if (e.target.id === "video-theater-modal") closeVideoModal();
      });

      // Tecla Escape cierra modales
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeEditModal();
          closeVideoModal();
        }
      });
    }

    // MODAL DE AGREGAR / EDITAR
    function openAddModal() {
      document.getElementById("modal-heading").textContent = "Agregar Objetivo";
      document.getElementById("edit-id").value = "";
      document.getElementById("input-title").value = "";
      document.getElementById("input-progress").value = 0;
      document.getElementById("label-progress").textContent = "0%";
      document.getElementById("input-video").value = "./assets/misAvances/img/";
      document.getElementById("edit-modal").classList.add("active");
      document.getElementById("input-title").focus();
    }

    window.openEditModal = function(id) {
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      document.getElementById("modal-heading").textContent = "Editar Objetivo";
      document.getElementById("edit-id").value = item.id;
      document.getElementById("input-title").value = item.title;
      document.getElementById("input-progress").value = item.progress;
      document.getElementById("label-progress").textContent = item.progress + "%";
      document.getElementById("input-video").value = item.video || "";
      document.getElementById("edit-modal").classList.add("active");
      document.getElementById("input-title").focus();
    };

    function closeEditModal() {
      document.getElementById("edit-modal").classList.remove("active");
    }

    function saveModalData() {
      const id = document.getElementById("edit-id").value;
      const title = document.getElementById("input-title").value.trim();
      const progress = parseInt(document.getElementById("input-progress").value, 10) || 0;
      const video = document.getElementById("input-video").value.trim();

      if (!title) {
        alert("Por favor escribe el nombre del objetivo.");
        return;
      }

      if (id) {
        // Editar existente
        const index = objectives.findIndex(o => o.id === id);
        if (index !== -1) {
          objectives[index].title = title;
          objectives[index].progress = Math.max(0, Math.min(100, progress));
          objectives[index].video = video;
        }
      } else {
        // Nuevo
        objectives.push({
          id: "obj-" + Date.now(),
          title: title,
          progress: Math.max(0, Math.min(100, progress)),
          video: video
        });
      }

      saveData();
      renderList();
      closeEditModal();
    }

    window.deleteObjective = function(id) {
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      if (confirm(`¿Deseas eliminar el objetivo "${item.title}"?`)) {
        objectives = objectives.filter(o => o.id !== id);
        saveData();
        renderList();
      }
    };

    // REPRODUCTOR DE VIDEO GRANDE (PLAY/PAUSE/SEEK/FULLSCREEN)
    window.openVideo = function(id) {
      const item = objectives.find(o => o.id === id);
      if (!item) return;

      const theaterModal = document.getElementById("video-theater-modal");
      const theaterTitle = document.getElementById("theater-title");
      const videoPlayer = document.getElementById("theater-video");
      const errorMsg = document.getElementById("video-error-msg");
      const videoPathText = document.getElementById("video-path-text");

      theaterTitle.textContent = item.title;
      videoPathText.textContent = item.video || "(sin ruta especificada)";

      // Resetear vista
      errorMsg.style.display = "none";
      videoPlayer.style.display = "block";
      videoPlayer.src = item.video || "";

      theaterModal.classList.add("active");

      // Intentar reproducir si existe el archivo
      videoPlayer.onerror = function() {
        videoPlayer.style.display = "none";
        errorMsg.style.display = "flex";
      };

      const playPromise = videoPlayer.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // Autoplay prevenido por navegador, listo para interactuar con controles
        });
      }
    };

    function closeVideoModal() {
      const theaterModal = document.getElementById("video-theater-modal");
      const videoPlayer = document.getElementById("theater-video");
      theaterModal.classList.remove("active");
      videoPlayer.pause();
      videoPlayer.src = "";
    }

    // EJECUTAR AL CARGAR DOM
    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
